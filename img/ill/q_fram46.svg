<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="28" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">图1-18 电阻混联电路（先串后并：R1+R2 与 R3∥R4 串联）</text>

  <!-- 回路 -->
  <line x1="90" y1="110" x2="150" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="110" x2="90" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="330" x2="570" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="570" y1="330" x2="570" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="510" y1="110" x2="570" y2="110" stroke="#333" stroke-width="2"/>

  <!-- 电源 E=8V 左侧 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="74" y1="190" x2="106" y2="190"/>
    <line x1="82" y1="210" x2="98" y2="210"/>
  </g>
  <line x1="90" y1="190" x2="90" y2="210" stroke="#333" stroke-width="2"/>
  <text x="30" y="206" font-size="14" fill="#1a1a1a">E=8V</text>
  <text x="108" y="182" font-size="13" fill="#c01c28">+</text>

  <!-- R1 串 -->
  <rect x="160" y="100" width="100" height="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="110" x2="160" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="260" y1="110" x2="300" y2="110" stroke="#333" stroke-width="2"/>
  <text x="210" y="92" font-size="14" text-anchor="middle" fill="#1a1a1a">R1=5Ω</text>

  <!-- R2 串 -->
  <rect x="300" y="100" width="100" height="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="110" x2="450" y2="110" stroke="#333" stroke-width="2"/>
  <text x="350" y="92" font-size="14" text-anchor="middle" fill="#1a1a1a">R2=7Ω</text>

  <!-- 并联段 R3∥R4（右竖排） -->
  <line x1="450" y1="110" x2="510" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="510" y1="110" x2="510" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="510" y1="110" x2="510" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="510" y1="160" x2="450" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="510" y1="160" x2="570" y2="160" stroke="#333" stroke-width="2"/>
  <rect x="440" y="160" width="20" height="90" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="560" y="160" width="20" height="90" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="250" x2="450" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="570" y1="250" x2="570" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="110" x2="450" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="160" x2="450" y2="160" stroke="#333" stroke-width="2"/>
  <text x="430" y="212" font-size="14" fill="#1a1a1a" text-anchor="end">R3=6Ω</text>
  <text x="592" y="212" font-size="14" fill="#1a1a1a">R4=12Ω</text>

  <!-- 并联段标注（置于左侧空白区，避免与 R3 矩形重叠） -->
  <path d="M 430 155 l -12 0 l 0 100 l 12 0" stroke="#1a5fb4" stroke-width="1.5" fill="none"/>
  <text x="150" y="290" font-size="14" fill="#1a5fb4">并联段：R0 = R3∥R4 = 4Ω</text>

  <!-- 电流箭头 -->
  <path d="M 168 145 l 16 0 m -7 -5 l 7 5 l -7 5" stroke="#1a5fb4" stroke-width="2" fill="none"/>
  <text x="196" y="150" font-size="14" fill="#1a5fb4">I=0.5A</text>

  <text x="330" y="382" font-size="14" fill="#666" text-anchor="middle">R0=R3R4/(R3+R4)=4Ω；R=R1+R2+R0=16Ω；I=E/R=0.5A</text>
</svg>
