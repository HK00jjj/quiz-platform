<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">联锁保护的意义：一个接触器未释放，绝不强迫闭合另一个</text>
  <!-- 主电路 -->
  <text x="20" y="62" font-size="14" fill="#2F5FD0" font-weight="bold">主电路（正反转各用自己的相序）</text>
  <rect x="30" y="74" width="300" height="150" rx="8" fill="#f4f7ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <!-- 主电路：两条平行支路各自经接触器接电动机（KM2 对调相序） -->
  <line x1="60" y1="96" x2="60" y2="212" stroke="#c33" stroke-width="2.4"/>
  <line x1="100" y1="96" x2="100" y2="212" stroke="#333" stroke-width="2.4"/>
  <line x1="140" y1="96" x2="140" y2="212" stroke="#333" stroke-width="2.4"/>
  <text x="56" y="90" font-size="10" fill="#c33" font-weight="bold">L1</text>
  <text x="96" y="90" font-size="10" fill="#333" font-weight="bold">L2</text>
  <text x="136" y="90" font-size="10" fill="#333" font-weight="bold">L3</text>
  <!-- 上支路：KM1（正转） -->
  <line x1="60" y1="124" x2="86" y2="124" stroke="#333" stroke-width="2"/>
  <line x1="86" y1="116" x2="86" y2="132" stroke="#2a7a2a" stroke-width="2.4"/>
  <line x1="100" y1="116" x2="100" y2="132" stroke="#2a7a2a" stroke-width="2.4"/>
  <line x1="100" y1="124" x2="130" y2="124" stroke="#333" stroke-width="2"/>
  <text x="93" y="110" font-size="10.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">KM1（三对触头）</text>
  <line x1="130" y1="124" x2="176" y2="124" stroke="#333" stroke-width="2"/>
  <circle cx="196" cy="124" r="16" fill="none" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="196" y="128" font-size="10.5" text-anchor="middle" fill="#2a7a2a">M</text>
  <text x="196" y="106" font-size="10.5" text-anchor="middle" fill="#2a7a2a">正转</text>
  <!-- 下支路：KM2（反转，L1/L3 对调） -->
  <line x1="60" y1="186" x2="86" y2="186" stroke="#333" stroke-width="2"/>
  <line x1="86" y1="178" x2="86" y2="194" stroke="#c33" stroke-width="2.4"/>
  <line x1="100" y1="178" x2="100" y2="194" stroke="#c33" stroke-width="2.4"/>
  <line x1="100" y1="186" x2="130" y2="186" stroke="#333" stroke-width="2"/>
  <text x="93" y="172" font-size="10.5" text-anchor="middle" fill="#c33" font-weight="bold">KM2（三对触头）</text>
  <line x1="130" y1="186" x2="176" y2="186" stroke="#333" stroke-width="2"/>
  <line x1="176" y1="186" x2="176" y2="124" stroke="#333" stroke-width="2"/>
  <text x="196" y="204" font-size="10.5" text-anchor="middle" fill="#c33">反转</text>
  <text x="163" y="216" font-size="10.5" text-anchor="middle" fill="#555">KM2 把 L1、L3 对调 → 相序相反</text>
  <!-- 危险 -->
  <rect x="352" y="74" width="278" height="150" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="491" y="98" font-size="13" text-anchor="middle" fill="#c33" font-weight="bold">✗ 强迫闭合（把未释放的 KM1 硬按）</text>
  <text x="368" y="124" font-size="12" fill="#c33">KM1 尚在吸合（主触头未断、电弧未熄）时，</text>
  <text x="368" y="144" font-size="12" fill="#c33">强行让 KM2 吸合 → 两条相序支路同时接通</text>
  <text x="368" y="172" font-size="12.5" fill="#c33" font-weight="bold">⚡ 主电路相间短路：电弧飞溅、触头熔焊、</text>
  <text x="368" y="192" font-size="12.5" fill="#c33" font-weight="bold">短路跳闸，甚至烧毁接触器与母线</text>
  <text x="368" y="214" font-size="11.5" fill="#888">（联锁常闭触点正是为了防止这一幕）</text>
  <!-- 正确做法 -->
  <rect x="30" y="236" width="600" height="64" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="46" y="258" font-size="12.5" fill="#2a7a2a" font-weight="bold">✓ 正确处置：等它自然释放（或按停止/断电查明为何不释放）后再操作另一个接触器。</text>
  <text x="46" y="282" font-size="12.5" fill="#2a7a2a">互锁（电气联锁）的本意就是「你不释放、我就合不上」——强迫闭合等于把保护拆掉。</text>
  <!-- 错项列出 -->
  <rect x="30" y="312" width="600" height="72" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="332" font-size="12.5" fill="#7a5c00">其余三个错项的毛病：</text>
  <text x="46" y="352" font-size="12.5" fill="#7a5c00">✗「立即强迫闭合另一个以对比」——制造短路；✗「先短接自锁触头再强迫闭合」——跳过联锁更危险；</text>
  <text x="46" y="372" font-size="12.5" fill="#7a5c00">✗「加大触发电压强迫吸合」——电压再高也改变不了触头未断的事实，纯属硬来。</text>
</svg>
