<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="430" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">控制电路图样三兄弟：原理图 · 接线图 · 安装图</text>
  <!-- 原理图 -->
  <rect x="24" y="52" width="196" height="200" rx="8" fill="#f4f7ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="122" y="76" font-size="14" text-anchor="middle" fill="#2F5FD0" font-weight="bold">① 电气原理图</text>
  <text x="122" y="96" font-size="11" text-anchor="middle" fill="#555">按「工作原理」展开，不按实际位置</text>
  <line x1="46" y1="120" x2="46" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="46" y1="140" x2="70" y2="140" stroke="#333" stroke-width="1.8"/>
  <line x1="70" y1="134" x2="70" y2="146" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="134" x2="80" y2="146" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="140" x2="98" y2="140" stroke="#333" stroke-width="1.8"/>
  <circle cx="112" cy="140" r="11" fill="none" stroke="#333" stroke-width="1.6"/>
  <text x="112" y="144" font-size="9.5" text-anchor="middle" fill="#333">M</text>
  <text x="36" y="162" font-size="10" fill="#2F5FD0" font-weight="bold">主电路</text>
  <line x1="46" y1="196" x2="200" y2="196" stroke="#333" stroke-width="1.8"/>
  <line x1="60" y1="186" x2="60" y2="206" stroke="#333" stroke-width="2"/>
  <line x1="74" y1="186" x2="74" y2="206" stroke="#333" stroke-width="2"/>
  <rect x="110" y="184" width="42" height="24" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="131" y="200" font-size="10.5" text-anchor="middle" fill="#7a5c00">KM</text>
  <text x="36" y="222" font-size="10" fill="#2F5FD0" font-weight="bold">控制电路</text>
  <text x="122" y="240" font-size="10.5" text-anchor="middle" fill="#555">分析原理、查故障逻辑用它 ✓</text>
  <!-- 接线图 -->
  <rect x="232" y="52" width="196" height="200" rx="8" fill="#fbf9f2" stroke="#b8860b" stroke-width="1.6"/>
  <text x="330" y="76" font-size="14" text-anchor="middle" fill="#7a5c00" font-weight="bold">② 接线图（敷线图）</text>
  <text x="330" y="96" font-size="11" text-anchor="middle" fill="#555">按元件「实际布置」绘制</text>
  <rect x="258" y="112" width="144" height="104" rx="6" fill="#fff" stroke="#b8860b" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="276" y1="134" x2="316" y2="134" stroke="#333" stroke-width="1.8"/>
  <line x1="316" y1="128" x2="316" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="326" y1="128" x2="326" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="326" y1="134" x2="360" y2="134" stroke="#333" stroke-width="1.8"/>
  <rect x="298" y="156" width="44" height="24" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="320" y="172" font-size="10.5" text-anchor="middle" fill="#7a5c00">KM</text>
  <line x1="288" y1="194" x2="318" y2="194" stroke="#333" stroke-width="1.8"/>
  <line x1="318" y1="188" x2="318" y2="200" stroke="#333" stroke-width="1.8"/>
  <line x1="330" y1="188" x2="330" y2="200" stroke="#333" stroke-width="1.8"/>
  <line x1="330" y1="194" x2="360" y2="194" stroke="#333" stroke-width="1.8"/>
  <circle cx="276" cy="134" r="2.4" fill="#2F5FD0"/><circle cx="360" cy="134" r="2.4" fill="#2F5FD0"/>
  <circle cx="298" cy="168" r="2.4" fill="#2F5FD0"/><circle cx="342" cy="168" r="2.4" fill="#2F5FD0"/>
  <text x="330" y="236" font-size="10.5" text-anchor="middle" fill="#555">同一元件各部件画在一起 ✓</text>
  <text x="330" y="248" font-size="10.5" text-anchor="middle" fill="#7a5c00">安装接线、逐点查线用它</text>
  <!-- 安装图 -->
  <rect x="440" y="52" width="196" height="200" rx="8" fill="#f7f7f7" stroke="#888" stroke-width="1.6"/>
  <text x="538" y="76" font-size="14" text-anchor="middle" fill="#555" font-weight="bold">③ 安装图</text>
  <text x="538" y="96" font-size="11" text-anchor="middle" fill="#555">标明安装位置与规格尺寸</text>
  <rect x="466" y="112" width="144" height="104" rx="6" fill="#fff" stroke="#999" stroke-width="1.4"/>
  <rect x="480" y="124" width="52" height="34" rx="3" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.4"/>
  <text x="506" y="145" font-size="9.5" text-anchor="middle" fill="#2F5FD0">接触器</text>
  <rect x="544" y="124" width="52" height="34" rx="3" fill="#fff8ec" stroke="#b8860b" stroke-width="1.4"/>
  <text x="570" y="145" font-size="9.5" text-anchor="middle" fill="#7a5c00">继电器</text>
  <rect x="480" y="170" width="52" height="34" rx="3" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.4"/>
  <text x="506" y="191" font-size="9.5" text-anchor="middle" fill="#2a7a2a">端子排</text>
  <rect x="544" y="170" width="52" height="34" rx="3" fill="#fdecec" stroke="#c33" stroke-width="1.4"/>
  <text x="570" y="191" font-size="9.5" text-anchor="middle" fill="#c33">熔断器</text>
  <text x="538" y="236" font-size="10.5" text-anchor="middle" fill="#555">元件多用实际/简化外形图</text>
  <text x="538" y="248" font-size="10.5" text-anchor="middle" fill="#555">施工布置、配管配线用它</text>
  <!-- 定义与要点 -->
  <rect x="24" y="266" width="612" height="60" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="40" y="288" font-size="12.5" fill="#7a5c00">定义：用导线把电动机、电器、仪表等连接起来、实现某种要求的电路，称电气控制电路。</text>
  <text x="40" y="310" font-size="12.5" fill="#7a5c00">三图各司其职：原理图看逻辑、接线图看接线、安装图看位置尺寸——掌握基本环节便于分析故障、改进性能。</text>
  <!-- 常见错项 -->
  <rect x="24" y="338" width="612" height="76" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.5"/>
  <text x="40" y="358" font-size="12.5" fill="#c33">✗ 常见错项：①「控制电路图仅含原理图一种」（漏了接线图、安装图）；</text>
  <text x="40" y="378" font-size="12.5" fill="#c33">②「基本控制环节对分析故障无帮助」；③「只能由软件自动生成、不可手工绘制」——均错。</text>
  <text x="40" y="400" font-size="12.5" fill="#2a7a2a" font-weight="bold">✓ 控制电路可手工绘制；基本环节正是查故障的抓手。</text>
</svg>
