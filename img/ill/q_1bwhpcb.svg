<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">上下级断路器级差配合：电流定值不够，需加时间级差</text>
  <!-- 特性曲线对比 -->
  <rect x="40" y="56" width="280" height="180" rx="8" fill="#fafafa" stroke="#888" stroke-width="1.5"/>
  <text x="180" y="78" font-size="12.5" text-anchor="middle" fill="#555" font-weight="bold">理想配合（上级慢、下级快）</text>
  <!-- 曲线 -->
  <path d="M 70 220 Q 140 200 180 140 Q 220 100 290 90" stroke="#2a7a2a" stroke-width="2.4" fill="none"/>
  <path d="M 70 220 Q 150 212 200 176 Q 250 152 290 146" stroke="#c33" stroke-width="2.4" fill="none"/>
  <text x="220" y="100" font-size="11" fill="#c33" font-weight="bold">下级快（先跳）</text>
  <text x="230" y="160" font-size="11" fill="#2a7a2a" font-weight="bold">上级慢（后跳）</text>
  <text x="180" y="222" font-size="10" text-anchor="middle" fill="#888">故障电流 →</text>
  <!-- 时间级差说明 -->
  <rect x="344" y="56" width="276" height="180" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="482" y="80" font-size="13" text-anchor="middle" fill="#c33" font-weight="bold">短路点距上下级都很近时</text>
  <text x="360" y="104" font-size="12" fill="#c33">· 流过两级开关的故障电流幅值几乎相同</text>
  <text x="360" y="126" font-size="12" fill="#c33">· 仅靠电流定值难以区分 → 级差配合失效</text>
  <text x="360" y="152" font-size="12.5" fill="#2a7a2a" font-weight="bold">✓ 应结合时间级差或联锁方式</text>
  <text x="360" y="176" font-size="12" fill="#555">上级多一个 Δt 延时 → 下级先跳、上级后跳</text>
  <text x="360" y="198" font-size="12" fill="#555">（或采用联锁：上级检测到下级未跳再动作）</text>
  <!-- 要点 -->
  <rect x="30" y="248" width="600" height="72" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="270" font-size="12.5" fill="#7a5c00">级差配合的核心不是「谁定值大」而是「谁动作慢」——短路电流幅值相同时，</text>
  <text x="46" y="292" font-size="12.5" fill="#7a5c00">只能靠时间差（Δt≥0.3s）或联锁逻辑保证选择性，否则越级跳闸。</text>
  <text x="46" y="314" font-size="12" fill="#7a5c00">「近端短路」是级差配合最容易失效的场景——需特别注意。</text>
</svg>
