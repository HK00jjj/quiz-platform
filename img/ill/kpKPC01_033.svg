<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L8,4 L0,7.5 z" fill="#333333"/>
    </marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0.5 L0,4 L8,7.5 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="25" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">三相交流电的波形：表达式中的滞后角</text>

  <text x="180" y="58" font-size="17" fill="#222222" text-anchor="middle">u<tspan dy="4" font-size="12">U</tspan><tspan dy="-4"> = Um·sin ωt</tspan></text>
  <text x="450" y="58" font-size="17" fill="#1a5fb4" text-anchor="middle">u<tspan dy="4" font-size="12">V</tspan><tspan dy="-4"> = Um·sin(ωt − 120°)</tspan></text>
  <ellipse cx="508" cy="51" rx="62" ry="17" fill="none" stroke="#c01c28" stroke-width="1.4" stroke-dasharray="4 3"/>

  <line x1="80" y1="350" x2="80" y2="92" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="80" y1="250" x2="634" y2="250" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="58" y="102" font-size="14" fill="#1a1a1a">u</text>
  <text x="620" y="272" font-size="14" fill="#1a1a1a">t</text>
  <text x="70" y="268" font-size="13" fill="#1a1a1a">0</text>

  <path d="M80,250 C121.67,122.5 163.33,122.5 205,250 C246.67,377.5 288.33,377.5 330,250 C371.67,122.5 413.33,122.5 455,250" fill="none" stroke="#222222" stroke-width="2.2"/>
  <path d="M163.33,250 C205,122.5 246.67,122.5 288.33,250 C330,377.5 371.67,377.5 413.33,250 C455,122.5 496.67,122.5 538.33,250" fill="none" stroke="#1a5fb4" stroke-width="2.2"/>

  <text x="142.5" y="150" font-size="14" fill="#222222" text-anchor="middle">u<tspan dy="4" font-size="11">U</tspan></text>
  <text x="225.83" y="150" font-size="14" fill="#1a5fb4" text-anchor="middle">u<tspan dy="4" font-size="11">V</tspan></text>

  <line x1="80" y1="165" x2="142.5" y2="165" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="54" y="170" font-size="14" fill="#1a1a1a">Um</text>

  <line x1="142.5" y1="165" x2="142.5" y2="138" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="225.83" y1="165" x2="225.83" y2="138" stroke="#888888" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="142.5" y1="138" x2="225.83" y2="138" stroke="#333333" stroke-width="1.2" marker-start="url(#ah2)" marker-end="url(#ah)"/>
  <text x="184" y="130" font-size="14" fill="#1a1a1a" text-anchor="middle">120°</text>

  <text x="330" y="385" font-size="15" fill="#1a1a1a" text-anchor="middle">表达式中的 −120° 表示 u<tspan dy="4" font-size="11">V</tspan><tspan dy="-4"> 的相位滞后 u</tspan><tspan dy="4" font-size="11">U</tspan><tspan dy="-4"> 120°（负号 = 落后，两最大值相同）</tspan></text>
</svg>
