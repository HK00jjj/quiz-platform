<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L8,4 L0,7.5 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="25" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">三相交流电的波形：瞬时值错开比较</text>

  <line x1="80" y1="355" x2="80" y2="88" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="80" y1="250" x2="634" y2="250" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="58" y="98" font-size="14" fill="#1a1a1a">u</text>
  <text x="620" y="272" font-size="14" fill="#1a1a1a">t</text>
  <text x="70" y="268" font-size="13" fill="#1a1a1a">0</text>

  <path d="M80,250 C121.67,115 163.33,115 205,250 C246.67,385 288.33,385 330,250 C371.67,115 413.33,115 455,250" fill="none" stroke="#222222" stroke-width="2.2"/>
  <path d="M163.33,250 C205,115 246.67,115 288.33,250 C330,385 371.67,385 413.33,250 C455,115 496.67,115 538.33,250" fill="none" stroke="#1a5fb4" stroke-width="2.2"/>
  <path d="M246.67,250 C288.33,115 330,115 371.67,250 C413.33,385 455,385 496.67,250 C538.33,115 580,115 621.67,250" fill="none" stroke="#c01c28" stroke-width="2.2"/>

  <text x="455" y="270" font-size="14" fill="#222222" text-anchor="middle">u<tspan dy="4" font-size="11">U</tspan></text>
  <text x="538.33" y="270" font-size="14" fill="#1a5fb4" text-anchor="middle">u<tspan dy="4" font-size="11">V</tspan></text>
  <text x="618" y="270" font-size="14" fill="#c01c28" text-anchor="middle">u<tspan dy="4" font-size="11">W</tspan></text>

  <line x1="80" y1="160" x2="142.5" y2="160" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="54" y="165" font-size="14" fill="#1a1a1a">Um</text>

  <line x1="300" y1="130" x2="300" y2="370" stroke="#555555" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="300" y="122" font-size="14" fill="#1a1a1a" text-anchor="middle">t₁</text>
  <circle cx="300" cy="311.6" r="4" fill="#222222"/>
  <circle cx="300" cy="278.4" r="4" fill="#1a5fb4"/>
  <circle cx="300" cy="162.4" r="4" fill="#c01c28"/>
  <text x="270" y="308" font-size="14" fill="#222222" text-anchor="end">u<tspan dy="4" font-size="11">U</tspan></text>
  <text x="313" y="284" font-size="14" fill="#1a5fb4">u<tspan dy="4" font-size="11">V</tspan></text>
  <text x="314" y="150" font-size="14" fill="#c01c28">u<tspan dy="4" font-size="11">W</tspan></text>

  <rect x="445" y="70" width="200" height="80" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
  <text x="545" y="93" font-size="14" fill="#1a1a1a" text-anchor="middle">同一时刻 t₁：</text>
  <text x="545" y="117" font-size="14" fill="#8b1a1a" text-anchor="middle">uU ≠ uV ≠ uW</text>
  <text x="545" y="141" font-size="13" fill="#666666" text-anchor="middle">（仅相位互差 120°）</text>

  <text x="330" y="390" font-size="15" fill="#1a1a1a" text-anchor="middle">最大值相同 ≠ 瞬时值相同：任一时刻三相瞬时值因相位错开而各不相同</text>
</svg>
