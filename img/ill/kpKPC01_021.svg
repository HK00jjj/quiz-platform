<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="32" font-size="21" font-weight="bold" text-anchor="middle" fill="#222222">直流电与交流电的波形对比</text>

  <!-- ======== 栏1 稳定直流 ======== -->
  <line x1="40" y1="230" x2="40" y2="100" stroke="#222222" stroke-width="1.8"/>
  <line x1="40" y1="200" x2="200" y2="200" stroke="#222222" stroke-width="1.8"/>
  <line x1="48" y1="140" x2="192" y2="140" stroke="#1a4f8a" stroke-width="2.5"/>
  <text x="50" y="130" font-size="14" fill="#1a4f8a">I 恒定</text>
  <text x="40" y="90" font-size="14" font-style="italic" fill="#222222">i</text>
  <text x="205" y="216" font-size="14" font-style="italic" fill="#222222">t</text>
  <text x="120" y="266" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">稳定直流电</text>
  <text x="120" y="292" font-size="14" text-anchor="middle" fill="#555555">方向不变、大小恒定</text>

  <!-- ======== 栏2 脉动直流 ======== -->
  <line x1="255" y1="230" x2="255" y2="100" stroke="#222222" stroke-width="1.8"/>
  <line x1="255" y1="200" x2="415" y2="200" stroke="#222222" stroke-width="1.8"/>
  <path d="M 258 200 C 270 140 288 140 300 200 C 312 150 330 150 342 200 C 354 145 372 145 384 200 C 392 168 402 168 410 200"
        fill="none" stroke="#1a4f8a" stroke-width="2.5"/>
  <text x="262" y="120" font-size="14" fill="#555555">始终在零线上方</text>
  <text x="255" y="90" font-size="14" font-style="italic" fill="#222222">i</text>
  <text x="420" y="216" font-size="14" font-style="italic" fill="#222222">t</text>
  <text x="335" y="266" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">脉动直流电</text>
  <text x="335" y="292" font-size="14" text-anchor="middle" fill="#555555">方向不变、大小波动</text>

  <!-- ======== 栏3 交流电 ======== -->
  <line x1="470" y1="230" x2="470" y2="100" stroke="#222222" stroke-width="1.8"/>
  <line x1="470" y1="200" x2="630" y2="200" stroke="#222222" stroke-width="1.8"/>
  <path d="M 470 200 C 488 122 508 122 526 200 C 544 278 564 278 582 200 C 591 161 604 161 613 200"
        fill="none" stroke="#1a4f8a" stroke-width="2.5"/>
  <text x="530" y="120" font-size="14" fill="#8a3b00">正负交变</text>
  <text x="470" y="90" font-size="14" font-style="italic" fill="#222222">i</text>
  <text x="635" y="216" font-size="14" font-style="italic" fill="#222222">t</text>
  <text x="550" y="266" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">交流电</text>
  <text x="550" y="292" font-size="14" text-anchor="middle" fill="#555555">方向、大小都周期变化</text>

  <!-- 分隔虚线 -->
  <line x1="225" y1="95" x2="225" y2="300" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="442" y1="95" x2="442" y2="300" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- 底部判据 -->
  <text x="330" y="340" font-size="15" text-anchor="middle" fill="#8a3b00">分类判据：方向不变的都是直流电（稳定直流、脉动直流）</text>
  <text x="330" y="368" font-size="15" text-anchor="middle" fill="#8a3b00">只有方向随时间交变的才是交流电</text>
</svg>
