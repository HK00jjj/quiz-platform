<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="18.5" font-weight="bold" fill="#222">桥架内多层并列敷设：校正系数按 GB 50217-2018 附录逐档选取</text>
  <rect x="34" y="52" width="180" height="230" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="124" y="76" font-size="13" text-anchor="middle" fill="#555" font-weight="bold">单层并列敷设</text>
  <rect x="70" y="92" width="108" height="22" rx="3" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <rect x="70" y="122" width="108" height="22" rx="3" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <rect x="70" y="152" width="108" height="22" rx="3" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="124" y="200" font-size="12" text-anchor="middle" fill="#2F5FD0">电缆平铺一层 · 相互热影响小</text>
  <rect x="86" y="212" width="76" height="34" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="124" y="234" font-size="13" text-anchor="middle" fill="#2a7a2a" font-weight="bold">系数较高</text>
  <text x="124" y="266" font-size="11" text-anchor="middle" fill="#777">（示意，按附录表取值）</text>

  <rect x="238" y="52" width="180" height="230" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="328" y="76" font-size="13" text-anchor="middle" fill="#c33" font-weight="bold">多层并列敷设</text>
  <rect x="274" y="92" width="108" height="22" rx="3" fill="#ffeef0" stroke="#c33" stroke-width="1.5"/>
  <rect x="274" y="122" width="108" height="22" rx="3" fill="#ffeef0" stroke="#c33" stroke-width="1.5"/>
  <rect x="274" y="152" width="108" height="22" rx="3" fill="#ffeef0" stroke="#c33" stroke-width="1.5"/>
  <rect x="274" y="182" width="108" height="22" rx="3" fill="#ffeef0" stroke="#c33" stroke-width="1.5"/>
  <text x="328" y="228" font-size="12" text-anchor="middle" fill="#c33">上层受下层热气流加热 · 散热恶化</text>
  <text x="328" y="250" font-size="12.5" text-anchor="middle" fill="#c33" font-weight="bold">系数须取「多层并列」档</text>
  <text x="328" y="270" font-size="11" text-anchor="middle" fill="#777">层数/根数越多 → 系数越严</text>

  <rect x="446" y="52" width="184" height="230" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="538" y="78" font-size="13" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ 正解 A</text>
  <text x="462" y="106" font-size="12.3" fill="#333">按 GB 50217-2018 附录</text>
  <text x="462" y="127" font-size="12.3" fill="#333">「多层并列校正系数」</text>
  <text x="462" y="148" font-size="12.3" fill="#333">按层数与根数逐档选取</text>
  <line x1="462" y1="162" x2="614" y2="162" stroke="#cfe3cf" stroke-width="1"/>
  <text x="462" y="184" font-size="12" fill="#c33">✗ B 沿用单层系数</text>
  <text x="462" y="204" font-size="11.5" fill="#666">→ 高估允许载流量</text>
  <text x="462" y="224" font-size="12" fill="#c33">✗ C 样本额定值直接用</text>
  <text x="462" y="244" font-size="11.5" fill="#666">→ 放弃工况修正</text>
  <text x="462" y="264" font-size="12" fill="#c33">✗ D 经验倍数放大</text>
  <text x="462" y="278" font-size="11.5" fill="#666">→ 无标准依据</text>
  <rect x="30" y="300" width="600" height="84" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="322" font-size="12.3" fill="#7a5c00">记忆：多层并列散热比单层差，「单层系数」只能用于单层；校正系数一律查 GB 50217-2018 附录，</text>
  <text x="46" y="343" font-size="12.3" fill="#7a5c00">按并列层数与每层根数分档取值。图中系数高低仅为示意，不作为查表数值使用。</text>
  <text x="46" y="364" font-size="12.3" fill="#7a5c00">误诊提醒：把产品样本标称额定载流量当可用值，是最常见的错法（忽略敷设工况修正）。</text>
</svg>