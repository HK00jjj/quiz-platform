<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">TN-S 与 TN-C-S 的区别：N 与 PE 分开的范围不同</text>
  <!-- ============ 左：TN-S ============ -->
  <text x="170" y="60" font-size="14" text-anchor="middle" fill="#2a7a2a" font-weight="bold">TN-S（全系统分开）</text>
  <rect x="40" y="95" width="44" height="90" rx="6" fill="#eef2ff" stroke="#2F5FD0" stroke-width="2"/>
  <circle cx="62" cy="118" r="12" fill="none" stroke="#2F5FD0" stroke-width="1.6"/>
  <circle cx="62" cy="162" r="12" fill="none" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="62" y="205" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">变压器</text>
  <!-- 5 根线 -->
  <line x1="84" y1="105" x2="300" y2="105" stroke="#333" stroke-width="2"/>
  <line x1="84" y1="125" x2="300" y2="125" stroke="#333" stroke-width="2"/>
  <line x1="84" y1="145" x2="300" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="84" y1="165" x2="300" y2="165" stroke="#2F5FD0" stroke-width="2.2"/>
  <line x1="84" y1="185" x2="300" y2="185" stroke="#6a8f00" stroke-width="2.2"/>
  <text x="90" y="101" font-size="10.5" fill="#555">L1</text>
  <text x="90" y="121" font-size="10.5" fill="#555">L2</text>
  <text x="90" y="141" font-size="10.5" fill="#555">L3</text>
  <text x="90" y="161" font-size="10.5" fill="#2F5FD0" font-weight="bold">N</text>
  <text x="90" y="181" font-size="10.5" fill="#6a8f00" font-weight="bold">PE</text>
  <rect x="300" y="92" width="26" height="102" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="313" y="212" font-size="11" text-anchor="middle" fill="#666">负荷</text>
  <text x="170" y="240" font-size="12" text-anchor="middle" fill="#555">5 线全程独立：L1·L2·L3·N·PE</text>
  <!-- ============ 右：TN-C-S ============ -->
  <text x="480" y="60" font-size="14" text-anchor="middle" fill="#b8860b" font-weight="bold">TN-C-S（前段合一·后段分开）</text>
  <rect x="360" y="95" width="44" height="90" rx="6" fill="#eef2ff" stroke="#2F5FD0" stroke-width="2"/>
  <circle cx="382" cy="118" r="12" fill="none" stroke="#2F5FD0" stroke-width="1.6"/>
  <circle cx="382" cy="162" r="12" fill="none" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="382" y="205" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">变压器</text>
  <!-- 前段 4 根（PEN 合一） -->
  <line x1="404" y1="105" x2="500" y2="105" stroke="#333" stroke-width="2"/>
  <line x1="404" y1="125" x2="500" y2="125" stroke="#333" stroke-width="2"/>
  <line x1="404" y1="145" x2="500" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="404" y1="168" x2="492" y2="168" stroke="#b8860b" stroke-width="2.6"/>
  <text x="408" y="101" font-size="10.5" fill="#555">L1</text>
  <text x="408" y="121" font-size="10.5" fill="#555">L2</text>
  <text x="408" y="141" font-size="10.5" fill="#555">L3</text>
  <text x="410" y="162" font-size="10.5" fill="#b8860b" font-weight="bold">PEN（N+PE 合一）</text>
  <!-- 分离点 -->
  <circle cx="496" cy="168" r="4.5" fill="#b8860b"/>
  <text x="496" y="228" font-size="11" text-anchor="middle" fill="#b8860b" font-weight="bold">分离点</text>
  <line x1="496" y1="168" x2="496" y2="192" stroke="#b8860b" stroke-width="2"/>
  <line x1="496" y1="168" x2="560" y2="150" stroke="#2F5FD0" stroke-width="2.2"/>
  <line x1="560" y1="150" x2="612" y2="150" stroke="#2F5FD0" stroke-width="2.2"/>
  <line x1="496" y1="192" x2="560" y2="192" stroke="#6a8f00" stroke-width="2.2"/>
  <line x1="560" y1="192" x2="612" y2="192" stroke="#6a8f00" stroke-width="2.2"/>
  <text x="566" y="146" font-size="10.5" fill="#2F5FD0" font-weight="bold">N</text>
  <text x="566" y="207" font-size="10.5" fill="#6a8f00" font-weight="bold">PE</text>
  <rect x="612" y="105" width="26" height="102" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="625" y="222" font-size="11" text-anchor="middle" fill="#666">负荷</text>
  <text x="480" y="250" font-size="12" text-anchor="middle" fill="#555">前段 4 线（PEN），分离点后 5 线</text>
  <!-- 要点 -->
  <rect x="40" y="272" width="580" height="52" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="293" font-size="12.5" fill="#7a5c00">TN-S：N 与 PE 全系统分开；TN-C-S：前段 N 与 PE 合为 PEN，自分离点起分开。</text>
  <text x="56" y="313" font-size="12.5" fill="#7a5c00">分开后的 N 与 PE 严禁再合并、不得互换——这是两种型式的本质区别。</text>
  <text x="20" y="352" font-size="12" fill="#888">正式技术文件应写标准代号 TN-S / TN-C-S（GB 规定的接地系统代号），不写「三相五线制」。</text>
  <text x="20" y="378" font-size="12" fill="#888">记忆点：TN-S 全程分；TN-C-S 先合后分，分后再不合。</text>
</svg>
