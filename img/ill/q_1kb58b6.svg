<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="28" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">图1-5 电位概念电路（以 C 点为接地零电位参考点）</text>

  <line x1="120" y1="110" x2="540" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="110" x2="120" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="540" y1="110" x2="540" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="330" x2="300" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="420" y1="330" x2="540" y2="330" stroke="#333" stroke-width="2"/>

  <!-- 电源 E=3V 在底部：C 到 A 之间提供 3V -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="300" y1="312" x2="300" y2="348"/>
    <line x1="320" y1="320" x2="320" y2="340"/>
  </g>
  <line x1="300" y1="330" x2="320" y2="330" stroke="#333" stroke-width="2"/>
  <text x="310" y="372" font-size="14" text-anchor="middle" fill="#1a1a1a">E=3V</text>
  <text x="292" y="308" font-size="13" fill="#c01c28">+</text>
  <text x="326" y="308" font-size="13" fill="#1a5fb4">−</text>

  <!-- R1 顶段 A->B -->
  <rect x="240" y="100" width="80" height="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="280" y="92" font-size="14" text-anchor="middle" fill="#1a1a1a">R1</text>

  <!-- R2 右竖段 B->C -->
  <rect x="530" y="180" width="20" height="80" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="566" y="225" font-size="14" fill="#1a1a1a">R2</text>

  <!-- 节点 -->
  <circle cx="120" cy="110" r="4" fill="#ff5a36"/><text x="106" y="98" font-size="15" fill="#ff5a36" font-weight="bold">A</text>
  <text x="146" y="100" font-size="14" fill="#ff5a36" font-weight="bold">3V</text>
  <circle cx="440" cy="110" r="4" fill="#1a5fb4"/><text x="430" y="98" font-size="15" fill="#1a5fb4" font-weight="bold">B</text>
  <text x="462" y="100" font-size="14" fill="#1a5fb4" font-weight="bold">1V</text>
  <circle cx="540" cy="330" r="4" fill="#1a1a1a"/><text x="552" y="340" font-size="15" fill="#1a1a1a" font-weight="bold">C</text>
  <text x="586" y="340" font-size="14" fill="#1a1a1a" font-weight="bold">0V</text>

  <!-- 接地符号 -->
  <g stroke="#1a1a1a" stroke-width="2.2">
    <line x1="528" y1="342" x2="552" y2="342"/>
    <line x1="534" y1="352" x2="546" y2="352"/>
    <line x1="539" y1="362" x2="541" y2="362"/>
  </g>

  <text x="330" y="388" font-size="14" fill="#666" text-anchor="middle">C 点接地规定为 0V；A、B 点电位均为相对 C 点测量：A=3V、B=1V</text>
</svg>
