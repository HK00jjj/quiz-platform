<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="30" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">磁铁插入线圈使灵敏电流计指针偏转</text>

  <!-- 磁铁：S 左 N 右，N 极伸入线圈 -->
  <rect x="55" y="168" width="125" height="26" fill="#eeeeee" stroke="#222" stroke-width="2"/>
  <rect x="180" y="168" width="120" height="26" fill="#3a3a3a" stroke="#222" stroke-width="2"/>
  <text x="118" y="187" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">S</text>
  <text x="240" y="187" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
  <!-- 插入箭头 -->
  <line x1="120" y1="152" x2="160" y2="152" stroke="#222" stroke-width="3"/>
  <polygon points="170,152 156,146 156,158" fill="#222"/>
  <text x="140" y="140" font-size="14" fill="#222" text-anchor="middle">插入</text>

  <!-- 线圈骨架与绕线（管状侧视，轴线水平） -->
  <rect x="258" y="140" width="124" height="10" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <rect x="258" y="212" width="124" height="10" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <g stroke="#222" stroke-width="2.5" fill="none">
    <path d="M268,196 a13,15 0 0 1 26,0"/>
    <path d="M294,196 a13,15 0 0 1 26,0"/>
    <path d="M320,196 a13,15 0 0 1 26,0"/>
    <path d="M346,196 a13,15 0 0 1 26,0"/>
  </g>
  <text x="320" y="132" font-size="15" fill="#222" text-anchor="middle">线圈</text>

  <!-- 穿过线圈的磁感线（磁通示意） -->
  <path d="M300,158 Q 365,138 430,156" fill="none" stroke="#555" stroke-width="1.8" stroke-dasharray="7 4"/>
  <polygon points="438,158 425,151 424,162" fill="#555"/>
  <path d="M300,206 Q 365,226 430,208" fill="none" stroke="#555" stroke-width="1.8" stroke-dasharray="7 4"/>
  <polygon points="438,206 425,203 424,214" fill="#555"/>
  <text x="392" y="246" font-size="14" fill="#555">磁通量</text>

  <!-- 灵敏电流计 -->
  <circle cx="540" cy="290" r="48" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <circle cx="540" cy="290" r="38" fill="none" stroke="#888" stroke-width="1"/>
  <!-- 刻度：0 居中，左右刻度 -->
  <text x="540" y="266" font-size="13" fill="#222" text-anchor="middle">0</text>
  <line x1="506" y1="272" x2="514" y2="277" stroke="#222" stroke-width="1.5"/>
  <line x1="574" y1="272" x2="566" y2="277" stroke="#222" stroke-width="1.5"/>
  <!-- 偏转的指针 -->
  <line x1="540" y1="296" x2="566" y2="260" stroke="#8a4a12" stroke-width="3"/>
  <circle cx="540" cy="296" r="4" fill="#222"/>
  <text x="592" y="252" font-size="14" font-weight="bold" fill="#8a4a12">指针偏转</text>
  <!-- 接线柱 -->
  <circle cx="496" cy="310" r="4" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <circle cx="584" cy="310" r="4" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="540" y="352" font-size="14" fill="#222" text-anchor="middle">灵敏电流计</text>

  <!-- 回路导线 -->
  <polyline points="268,196 268,330 490,330 496,312" fill="none" stroke="#222" stroke-width="2"/>
  <polyline points="372,196 372,248 622,248 622,330 590,330 584,312" fill="none" stroke="#222" stroke-width="2"/>

  <!-- 回路电流方向 -->
  <polygon points="268,300 262,312 274,312" fill="#1a5c2e"/>
  <text x="252" y="312" font-size="14" font-weight="bold" fill="#1a5c2e">i</text>

  <!-- 因果链 -->
  <line x1="40" y1="360" x2="620" y2="360" stroke="#bbb" stroke-width="1"/>
  <text x="330" y="382" font-size="14" fill="#333" text-anchor="middle">磁铁插入 → 穿过线圈的磁通量发生变化（ΔΦ≠0）→ 闭合回路产生感应电流 → 指针偏转</text>
</svg>
