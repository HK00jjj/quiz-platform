<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="30" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">夹角 α 从 90° 减到 0°，安培力 F 随之减小</text>
  <text x="330" y="58" font-size="15" fill="#444" text-anchor="middle">F = B·I·L·sinα（保持 B、I、L 不变，仅 α 变化）</text>

  <!-- ===== 左半：三个典型位置的导体 ===== -->
  <text x="185" y="88" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">导体在磁场中的方位变化</text>
  <g stroke="#555" stroke-width="1.6" fill="#555">
    <line x1="40" y1="120" x2="315" y2="120"/><polygon points="324,120 313,115 313,125"/>
    <line x1="40" y1="185" x2="315" y2="185"/><polygon points="324,185 313,180 313,190"/>
    <line x1="40" y1="250" x2="315" y2="250"/><polygon points="324,250 313,245 313,255"/>
  </g>
  <text x="332" y="126" font-size="14" fill="#555">B</text>

  <!-- 位置1：α=90° 竖直导体，F 最大 -->
  <line x1="105" y1="112" x2="105" y2="258" stroke="#222" stroke-width="4"/>
  <line x1="105" y1="108" x2="105" y2="78" stroke="#8a4a12" stroke-width="4"/>
  <polygon points="105,68 98,84 112,84" fill="#8a4a12"/>
  <text x="90" y="66" font-size="14" font-weight="bold" fill="#8a4a12">F 最大</text>
  <text x="105" y="278" font-size="14" fill="#222" text-anchor="middle">α=90°</text>

  <!-- 位置2：α=45° 斜导体，F 减小 -->
  <line x1="180" y1="242" x2="250" y2="172" stroke="#222" stroke-width="4"/>
  <line x1="196" y1="186" x2="170" y2="152" stroke="#8a4a12" stroke-width="3"/>
  <polygon points="164,144 168,160 178,152" fill="#8a4a12"/>
  <text x="140" y="136" font-size="14" font-weight="bold" fill="#8a4a12">F 减小</text>
  <text x="215" y="278" font-size="14" fill="#222" text-anchor="middle">α=45°</text>

  <!-- 位置3：α=0° 水平导体，F=0 -->
  <line x1="272" y1="206" x2="336" y2="206" stroke="#222" stroke-width="4"/>
  <text x="304" y="190" font-size="14" font-weight="bold" fill="#8a1f1f">F=0</text>
  <text x="304" y="278" font-size="14" fill="#222" text-anchor="middle">α=0°</text>

  <!-- 转动弧箭头 -->
  <path d="M105,300 Q 215,330 310,300" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="316,298 302,294 304,306" fill="#555"/>
  <text x="212" y="340" font-size="14" fill="#444" text-anchor="middle">导体逐渐转向与磁场平行（α 减小）</text>

  <!-- 中缝 -->
  <line x1="355" y1="90" x2="355" y2="345" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== 右半：F 随 α 变化曲线 ===== -->
  <text x="492" y="88" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">F 与 sinα 成正比</text>
  <!-- 坐标轴 -->
  <line x1="405" y1="300" x2="405" y2="112" stroke="#222" stroke-width="2"/>
  <polygon points="405,104 400,116 410,116" fill="#222"/>
  <line x1="405" y1="300" x2="630" y2="300" stroke="#222" stroke-width="2"/>
  <polygon points="638,300 626,295 626,305" fill="#222"/>
  <text x="392" y="118" font-size="15" font-weight="bold" fill="#222">F</text>
  <text x="634" y="322" font-size="15" font-weight="bold" fill="#222">α</text>
  <!-- sinα 曲线：起点陡、终点平 -->
  <path d="M405,300 C 440,185 490,122 605,122" fill="none" stroke="#1a5c2e" stroke-width="3"/>
  <!-- 参考虚线 -->
  <line x1="405" y1="122" x2="605" y2="122" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="605" y1="122" x2="605" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="612" y="128" font-size="13" fill="#222">F最大=BIL</text>
  <text x="605" y="318" font-size="13" fill="#222" text-anchor="middle">90°</text>
  <text x="405" y="318" font-size="13" fill="#222" text-anchor="middle">0°</text>
  <!-- 45° 参考点 -->
  <circle cx="505" cy="176" r="4" fill="#8a4a12"/>
  <line x1="505" y1="176" x2="505" y2="300" stroke="#8a4a12" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="505" y="318" font-size="13" fill="#222" text-anchor="middle">45°</text>
  <text x="545" y="230" font-size="15" fill="#1a5c2e">F ∝ sinα</text>

  <line x1="40" y1="356" x2="620" y2="356" stroke="#bbb" stroke-width="1"/>
  <text x="330" y="378" font-size="14" fill="#333" text-anchor="middle">α 从 90° 逐渐减小到 0°：sinα 由 1 减到 0，F 从最大值 BIL 相应减小到零</text>
</svg>
