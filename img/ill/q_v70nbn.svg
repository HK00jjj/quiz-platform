<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="18.5" font-weight="bold" fill="#222">PLC 基本内部器件七类：均为内存单元，不是物理器件</text>
  <rect x="34" y="52" width="180" height="46" rx="8" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="124" y="72" font-size="12.3" text-anchor="middle" fill="#2F5FD0" font-weight="bold">输入继电器</text>
  <text x="124" y="90" font-size="11" text-anchor="middle" fill="#555">X / I　由外设信号驱动</text>
  <rect x="226" y="52" width="180" height="46" rx="8" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="316" y="72" font-size="12.3" text-anchor="middle" fill="#2F5FD0" font-weight="bold">输出继电器</text>
  <text x="316" y="90" font-size="11" text-anchor="middle" fill="#555">Y / O / Q　驱动外部负载</text>
  <rect x="418" y="52" width="208" height="46" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="522" y="72" font-size="12.3" text-anchor="middle" fill="#7a5c00" font-weight="bold">内部继电器（辅助继电器）</text>
  <text x="522" y="90" font-size="11" text-anchor="middle" fill="#555">M 等　程序中转用</text>

  <rect x="34" y="108" width="180" height="46" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="124" y="128" font-size="12.3" text-anchor="middle" fill="#7a5c00" font-weight="bold">定时器</text>
  <text x="124" y="146" font-size="11" text-anchor="middle" fill="#555">T　延时动作</text>
  <rect x="226" y="108" width="180" height="46" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="316" y="128" font-size="12.3" text-anchor="middle" fill="#7a5c00" font-weight="bold">计数器</text>
  <text x="316" y="146" font-size="11" text-anchor="middle" fill="#555">C　计数动作</text>
  <rect x="418" y="108" width="208" height="46" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="522" y="128" font-size="12.3" text-anchor="middle" fill="#7a5c00" font-weight="bold">数据寄存器 / 状态元件</text>
  <text x="522" y="146" font-size="11" text-anchor="middle" fill="#555">D / S　数据存放与步进状态</text>

  <rect x="34" y="164" width="592" height="90" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.7"/>
  <text x="52" y="186" font-size="12.8" fill="#c33" font-weight="bold">✗ E 物理中间继电器与真实接触器 —— 不选</text>
  <text x="52" y="208" font-size="12" fill="#333">PLC 内部器件沿用「继电器线圈/触点」的名称，但对应的是存储器中的一位（bit），</text>
  <text x="52" y="228" font-size="12" fill="#333">不是机内的物理继电器；真实中间继电器、接触器属于外部硬件，不在内部器件之列。</text>
  <text x="52" y="248" font-size="11.8" fill="#777">触点可无限次引用、无磨损；线圈状态只存在于内存映像区</text>
  <rect x="30" y="264" width="600" height="96" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="286" font-size="12.3" fill="#7a5c00">正解 ABCD：输入/输出继电器、定时器与计数器、数据寄存器与状态元件、内部继电器，共七类。</text>
  <text x="46" y="307" font-size="12.3" fill="#7a5c00">记忆：X/I 进、Y/O/Q 出、M 中转、T 延时、C 计数、D 存数、S 步进——七类软元件皆非物理器件。</text>
  <text x="46" y="328" font-size="12.3" fill="#7a5c00">易错点：被「继电器」三个字带偏，把机内软元件当成机内真实继电器。</text>
</svg>