<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">PE 线端子：OT 圆形冷压端子压接与防松</text>
  <!-- OT 端子放大 -->
  <rect x="40" y="70" width="240" height="180" rx="10" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="160" y="94" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">OT 圆形冷压端子</text>
  <circle cx="115" cy="160" r="34" fill="none" stroke="#b8860b" stroke-width="7"/>
  <rect x="140" y="146" width="90" height="30" rx="4" fill="#d9c9a8" stroke="#8b4513" stroke-width="2"/>
  <text x="185" y="167" font-size="11" text-anchor="middle" fill="#5a4a2a">压接管</text>
  <text x="115" y="212" font-size="11" text-anchor="middle" fill="#555">圆环接触面大、不易松脱</text>
  <!-- 黄绿线进压接管 -->
  <line x1="230" y1="161" x2="278" y2="161" stroke="#2e8b2e" stroke-width="6"/>
  <line x1="243" y1="148" x2="265" y2="148" stroke="#ffd400" stroke-width="6"/>
  <text x="248" y="136" font-size="11" fill="#2e8b2e">黄绿双色线</text>
  <!-- 右：压接到接地排 -->
  <rect x="330" y="70" width="290" height="180" rx="10" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="475" y="94" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">压接于专用接地端子</text>
  <rect x="360" y="150" width="250" height="26" rx="4" fill="#c0c0c0" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="169" font-size="11" text-anchor="middle" fill="#333">接地排（带 ⊥ 标识）</text>
  <circle cx="430" cy="163" r="9" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="430" y1="120" x2="430" y2="154" stroke="#333" stroke-width="3"/>
  <rect x="418" y="136" width="24" height="7" fill="#888"/>
  <text x="452" y="128" font-size="11" fill="#555">螺栓+弹簧垫圈</text>
  <circle cx="430" cy="163" r="0" fill="none"/>
  <line x1="360" y1="196" x2="356" y2="163" stroke="#2e8b2e" stroke-width="5"/>
  <line x1="365" y1="196" x2="361" y2="163" stroke="#ffd400" stroke-width="5"/>
  <text x="330" y="220" font-size="11" fill="#2e8b2e">OT 端子套入螺栓后压紧</text>
  <!-- 要点 -->
  <text x="20" y="284" font-size="12.5" fill="#333">工艺要点：一个端子只压一根接地线，不得多根串压；压接后回拉检查不脱出；</text>
  <text x="20" y="304" font-size="12.5" fill="#333">弹垫/齿形垫防松，接触面除漆除锈见金属光泽。</text>
  <text x="20" y="330" font-size="12" fill="#888">要点：PE 严禁经开关或熔断器；黄绿双色专用，不得作载流导体他用。</text>
</svg>
