<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="32" font-size="21" font-weight="bold" text-anchor="middle" fill="#222222">电阻的并联总电阻判据（越并越小）</text>

  <!-- ======== 左：两电阻并联电路 ======== -->
  <!-- 电池 -->
  <line x1="70" y1="80" x2="70" y2="140" stroke="#222222" stroke-width="2"/>
  <line x1="56" y1="140" x2="84" y2="140" stroke="#222222" stroke-width="2.5"/>
  <line x1="63" y1="150" x2="77" y2="150" stroke="#222222" stroke-width="2.5"/>
  <line x1="70" y1="150" x2="70" y2="230" stroke="#222222" stroke-width="2"/>
  <text x="42" y="151" font-size="15" text-anchor="middle" fill="#222222">E</text>
  <!-- 顶线与两竖直支路 -->
  <line x1="70" y1="80" x2="250" y2="80" stroke="#222222" stroke-width="2"/>
  <circle cx="200" cy="80" r="3.5" fill="#222222"/>
  <circle cx="250" cy="80" r="3.5" fill="#222222"/>
  <line x1="200" y1="80" x2="200" y2="110" stroke="#222222" stroke-width="2"/>
  <rect x="185" y="110" width="30" height="60" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <line x1="200" y1="170" x2="200" y2="230" stroke="#222222" stroke-width="2"/>
  <line x1="250" y1="80" x2="250" y2="110" stroke="#222222" stroke-width="2"/>
  <rect x="235" y="110" width="30" height="60" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <line x1="250" y1="170" x2="250" y2="230" stroke="#222222" stroke-width="2"/>
  <line x1="70" y1="230" x2="250" y2="230" stroke="#222222" stroke-width="2"/>
  <text x="163" y="145" font-size="15" text-anchor="middle" fill="#222222">R1</text>
  <text x="285" y="145" font-size="15" text-anchor="middle" fill="#222222">R2</text>
  <text x="163" y="166" font-size="14" text-anchor="middle" fill="#1a4f8a">6Ω</text>
  <text x="287" y="166" font-size="14" text-anchor="middle" fill="#1a4f8a">12Ω</text>
  <text x="160" y="66" font-size="14" text-anchor="middle" fill="#555555">两电阻并联</text>

  <!-- 中间等效箭头 -->
  <line x1="300" y1="155" x2="368" y2="155" stroke="#8a3b00" stroke-width="2.5"/>
  <polygon points="380,155 364,148 364,162" fill="#8a3b00"/>
  <text x="340" y="136" font-size="15" text-anchor="middle" fill="#8a3b00">等效为</text>

  <!-- ======== 右：等效单电阻电路 ======== -->
  <line x1="410" y1="80" x2="410" y2="140" stroke="#222222" stroke-width="2"/>
  <line x1="396" y1="140" x2="424" y2="140" stroke="#222222" stroke-width="2.5"/>
  <line x1="403" y1="150" x2="417" y2="150" stroke="#222222" stroke-width="2.5"/>
  <line x1="410" y1="150" x2="410" y2="230" stroke="#222222" stroke-width="2"/>
  <text x="384" y="151" font-size="15" text-anchor="middle" fill="#222222">E</text>
  <line x1="410" y1="80" x2="480" y2="80" stroke="#222222" stroke-width="2"/>
  <rect x="480" y="65" width="70" height="30" fill="#ffffff" stroke="#a01010" stroke-width="2.5"/>
  <line x1="550" y1="80" x2="600" y2="80" stroke="#222222" stroke-width="2"/>
  <line x1="600" y1="80" x2="600" y2="230" stroke="#222222" stroke-width="2"/>
  <line x1="410" y1="230" x2="600" y2="230" stroke="#222222" stroke-width="2"/>
  <text x="515" y="54" font-size="16" font-weight="bold" text-anchor="middle" fill="#a01010">R = 4Ω</text>
  <text x="505" y="258" font-size="14" text-anchor="middle" fill="#555555">等效总电阻</text>

  <!-- ======== 下：阻值比较数轴 ======== -->
  <text x="330" y="302" font-size="15" text-anchor="middle" fill="#222222">阻值比较：R总 = 4Ω　＜　R1 = 6Ω　＜　R2 = 12Ω</text>
  <line x1="120" y1="340" x2="560" y2="340" stroke="#222222" stroke-width="2"/>
  <polygon points="572,340 558,334 558,346" fill="#222222"/>
  <!-- 刻度 -->
  <line x1="220" y1="333" x2="220" y2="347" stroke="#222222" stroke-width="2"/>
  <line x1="350" y1="333" x2="350" y2="347" stroke="#222222" stroke-width="2"/>
  <line x1="490" y1="333" x2="490" y2="347" stroke="#222222" stroke-width="2"/>
  <circle cx="220" cy="340" r="5" fill="#a01010"/>
  <text x="220" y="374" font-size="14" text-anchor="middle" fill="#a01010">R总=4Ω</text>
  <text x="350" y="374" font-size="14" text-anchor="middle" fill="#222222">R1=6Ω</text>
  <text x="490" y="374" font-size="14" text-anchor="middle" fill="#222222">R2=12Ω</text>
</svg>
