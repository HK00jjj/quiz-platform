<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="380" fill="#ffffff"/>
  <text x="330" y="28" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">图1-21 正弦交流电波形（t1～t4 分段：t2→t3 过零换向并反向增大）</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="200" x2="600" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="330" stroke="#333" stroke-width="2"/>
  <text x="612" y="206" font-size="14" fill="#333">t</text>
  <text x="70" y="66" font-size="13" fill="#333">u / i</text>
  <text x="76" y="216" font-size="13" fill="#333">0</text>

  <!-- 正弦波：从 0 起，一个完整周期+ -->
  <!-- 采样点：x 90..570，周期 240px（t2=T/2 在 210？） -->
  <!-- 用路径近似：正半周 t1 峰值在 x=180，过零 t2 在 x=270，负峰 t3 在 x=360，过零 t4 在 x=450 -->
  <path d="M 90 200 C 135 80, 225 80, 270 200 C 315 320, 405 320, 450 200 C 495 80, 585 80, 630 200"
        fill="none" stroke="#c01c28" stroke-width="2.5"/>

  <!-- t 标注 -->
  <g font-size="14" fill="#1a1a1a" text-anchor="middle">
    <line x1="180" y1="200" x2="180" y2="105" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="180" y="232">t1</text>
    <line x1="270" y1="200" x2="270" y2="225" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="270" y="232">t2</text>
    <line x1="360" y1="200" x2="360" y2="295" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="360" y="232">t3</text>
    <line x1="450" y1="200" x2="450" y2="225" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="450" y="232">t4</text>
  </g>

  <!-- 分段标注 -->
  <text x="225" y="66" font-size="13" fill="#1a5fb4" text-anchor="middle">t1～t2：极性上正下负，电流正向减小</text>
  <text x="315" y="348" font-size="13" fill="#c01c28" text-anchor="middle">t2～t3：过零换向，极性变上负下正，反向电流逐渐增大</text>
  <text x="405" y="366" font-size="13" fill="#666" text-anchor="middle">t3～t4：反向电流逐渐减小，回到零点</text>

  <text x="540" y="110" font-size="13" fill="#c01c28">t3 = 反向最大值</text>
  <text x="120" y="110" font-size="13" fill="#c01c28">t1 = 正向最大值</text>
</svg>
