<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">接触器不吸合：四种常用故障分析方法（E 谐振法为干扰项）</text>
  <!-- 四法卡片 -->
  <rect x="30" y="52" width="290" height="92" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="46" y="74" font-size="13" fill="#2a7a2a" font-weight="bold">A. 感官诊断法</text>
  <text x="46" y="96" font-size="12" fill="#333">看（烧痕、指示）、听（异响、吸合声）、</text>
  <text x="46" y="116" font-size="12" fill="#333">闻（焦糊味）、摸（发热、振动）</text>
  <text x="46" y="136" font-size="11" fill="#888">先整体判断，缩小范围，不接触带电体</text>
  <rect x="340" y="52" width="290" height="92" rx="8" fill="#f4f7ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="356" y="74" font-size="13" fill="#2F5FD0" font-weight="bold">B. 电压测量法</text>
  <text x="356" y="96" font-size="12" fill="#333">万用表电压档逐段测「应有电压处有无电压」</text>
  <text x="356" y="116" font-size="12" fill="#333">断路点前后：有电压/无电压的分界</text>
  <text x="356" y="136" font-size="11" fill="#888">通电状态下进行，注意档位与安全</text>
  <rect x="30" y="156" width="290" height="92" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="46" y="178" font-size="13" fill="#7a5c00" font-weight="bold">C. 电阻测量法</text>
  <text x="46" y="200" font-size="12" fill="#333">断电后测通断/阻值：判断触点接触状态</text>
  <text x="46" y="220" font-size="12" fill="#333">线圈阻值判断是否开路/短路</text>
  <text x="46" y="240" font-size="11" fill="#888">必须断电、放电后进行；注意并联支路干扰</text>
  <rect x="340" y="156" width="290" height="92" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="356" y="178" font-size="13" fill="#c33" font-weight="bold">D. 短接法（只用于确认断路点）</text>
  <text x="356" y="200" font-size="12" fill="#333">用绝缘导线短接怀疑断路的触点/线段</text>
  <text x="356" y="220" font-size="12" fill="#333">短接后能吸合 → 该处即为断路点</text>
  <text x="356" y="240" font-size="11" fill="#c33">严禁短接电源、线圈、负载；逐点、临时、随即拆除</text>
  <!-- 干扰项 -->
  <rect x="30" y="260" width="600" height="44" rx="8" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="46" y="288" font-size="12.5" fill="#999">E. 谐振诊断法 —— ✗ 不属于电气控制电路的常用故障分析方法（干扰项，排除）</text>
  <!-- 排查顺序 -->
  <rect x="30" y="316" width="600" height="72" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="336" font-size="12.5" fill="#7a5c00">推荐顺序（从简到繁、从安全到带电）：</text>
  <text x="46" y="356" font-size="12.5" fill="#7a5c00" font-weight="bold">感官诊断 → 电阻法（断电查触点/线圈）→ 电压法（通电分段测量）→ 短接法（确认断路点）</text>
  <text x="46" y="378" font-size="12" fill="#7a5c00">四法互相印证：接触器不吸合最常见的链路是「电源→熔断器→停止按钮→起动按钮→互锁触点→线圈」逐段排除。</text>
</svg>
