<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">0-10V 与 DALI 调光：布线差别由寻址方式决定（正解 A）</text>
  <rect x="30" y="46" width="290" height="150" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.4"/>
  <text x="44" y="68" font-size="12.5" font-weight="bold" fill="#7a5c00">0-10V：模拟量调光</text>
  <text x="44" y="94" font-size="12.3" fill="#333">线上电压值直接就是亮度指令</text>
  <text x="44" y="118" font-size="12.3" fill="#333">承载不了「给哪只灯」→ 每回路需独立控制线</text>
  <text x="44" y="142" font-size="12.3" fill="#333">回路越多，控制线越多</text>
  <text x="44" y="166" font-size="11" fill="#777">模拟量：只能「整条线一起亮暗」</text>
  <rect x="336" y="46" width="294" height="150" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.4"/>
  <text x="350" y="68" font-size="12.5" font-weight="bold" fill="#2F5FD0">DALI：数字总线调光</text>
  <text x="350" y="94" font-size="12.3" fill="#333">每只驱动器有唯一地址</text>
  <text x="350" y="118" font-size="12.3" fill="#333">指令带地址寻址 → 一对总线挂多台设备</text>
  <text x="350" y="142" font-size="12.3" fill="#333">可按地址分别调光并查询状态</text>
  <text x="350" y="166" font-size="11" fill="#777">数字量：可「单独点名某只灯」</text>
  <rect x="46" y="208" width="568" height="30" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="228" font-size="12.3" fill="#555">共同要求：调光线须与 220V 强电分开敷设，防止干扰</text>
  <rect x="46" y="244" width="568" height="30" rx="5" fill="#fdecec" stroke="#c33" stroke-width="1.3"/>
  <text x="58" y="264" font-size="12.3" fill="#c33">✗B 0-10V 环形、DALI 星形：布形不是两者本质差别</text>
  <rect x="30" y="282" width="600" height="80" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="304" font-size="12.3" fill="#7a5c00">正解 A：0-10V 每调光回路需独立控制线；DALI 一对总线按地址单独寻址。</text>
  <text x="46" y="325" font-size="12.3" fill="#7a5c00">记忆点：模拟量「整路一起」，数字量「按地址点名」——差别来自寻址方式。</text>
</svg>