<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#ffffff"/>

  <!-- 电路导线 -->
  <line x1="60" y1="210" x2="240" y2="210" stroke="#333333" stroke-width="2"/>
  <line x1="430" y1="210" x2="600" y2="210" stroke="#333333" stroke-width="2"/>

  <!-- 导体段（含阻碍栅栏） -->
  <rect x="240" y="165" width="190" height="90" fill="#ffffff" stroke="#333333" stroke-width="2.5"/>
  <line x1="275" y1="185" x2="275" y2="235" stroke="#333333" stroke-width="2"/>
  <line x1="305" y1="185" x2="305" y2="235" stroke="#333333" stroke-width="2"/>
  <line x1="335" y1="185" x2="335" y2="235" stroke="#333333" stroke-width="2"/>
  <line x1="365" y1="185" x2="365" y2="235" stroke="#333333" stroke-width="2"/>
  <line x1="395" y1="185" x2="395" y2="235" stroke="#333333" stroke-width="2"/>

  <!-- 电流箭头：流入 -->
  <polygon points="110,203 165,203 165,196 185,210 165,224 165,217 110,217" fill="#333333"/>
  <text x="145" y="192" font-size="16" font-style="italic" font-weight="bold" text-anchor="middle" fill="#111111">I</text>

  <!-- 电流箭头：流出 -->
  <polygon points="470,206 525,206 525,201 545,210 525,219 525,214 470,214" fill="#333333"/>
  <text x="505" y="192" font-size="16" font-style="italic" font-weight="bold" text-anchor="middle" fill="#111111">I</text>

  <!-- 上标注：阻碍作用 -->
  <text x="335" y="132" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">导体对电流的阻碍作用</text>
  <line x1="335" y1="140" x2="335" y2="160" stroke="#333333" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- 下标注：电阻定义 -->
  <line x1="335" y1="258" x2="335" y2="276" stroke="#333333" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="335" y="300" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">称为电阻，用字母 R 表示</text>

  <!-- R 字母标注 -->
  <text x="452" y="192" font-size="20" font-style="italic" font-weight="bold" fill="#111111">R</text>

  <!-- 底部说明 -->
  <text x="330" y="348" font-size="14" text-anchor="middle" fill="#444444">任何导体接在电路中，都会对电流产生阻碍作用</text>
</svg>
