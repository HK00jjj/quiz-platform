<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">单相 380V 电焊机接入三相四线制系统</text>
  <!-- 电源母线 -->
  <line x1="80" y1="80" x2="580" y2="80" stroke="#8b4513" stroke-width="3"/>
  <text x="60" y="72" font-size="12" fill="#8b4513">L1</text>
  <line x1="80" y1="110" x2="580" y2="110" stroke="#00a000" stroke-width="3"/>
  <text x="60" y="102" font-size="12" fill="#00a000">L2</text>
  <line x1="80" y1="140" x2="580" y2="140" stroke="#d40000" stroke-width="3"/>
  <text x="60" y="132" font-size="12" fill="#d40000">L3</text>
  <line x1="80" y1="170" x2="580" y2="170" stroke="#7ec8e3" stroke-width="3"/>
  <text x="60" y="162" font-size="12" fill="#4a90b8">N</text>
  <!-- 取电：两根相线 -->
  <line x1="230" y1="80" x2="230" y2="230" stroke="#8b4513" stroke-width="3"/>
  <line x1="330" y1="110" x2="330" y2="230" stroke="#00a000" stroke-width="3"/>
  <text x="238" y="206" font-size="12" fill="#8b4513">L1 → 输入端子1</text>
  <text x="338" y="206" font-size="12" fill="#00a000">L2 → 输入端子2</text>
  <!-- 电焊机 -->
  <rect x="200" y="230" width="200" height="80" rx="10" fill="#f4f4f4" stroke="#333" stroke-width="2.5"/>
  <text x="300" y="262" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">交流电焊机</text>
  <text x="300" y="286" font-size="12" text-anchor="middle" fill="#555">输入 1×380V（两相线间）</text>
  <!-- 说明框 -->
  <rect x="430" y="220" width="200" height="120" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="444" y="246" font-size="12" font-weight="bold" fill="#7a5c00">为什么不用 L+N：</text>
  <text x="444" y="268" font-size="11.5" fill="#7a5c00">相线—N 之间只有 220V，</text>
  <text x="444" y="288" font-size="11.5" fill="#7a5c00">达不到铭牌 380V；</text>
  <text x="444" y="308" font-size="11.5" fill="#7a5c00">380V 取自两根相线的</text>
  <text x="444" y="328" font-size="11.5" fill="#7a5c00">线电压（任取两相）。</text>
  <text x="20" y="332" font-size="12" fill="#888">要点：先看铭牌额定电压，再选对应电压的取电方式；外壳 PE 必接；容量大时核算该两相的负载均衡。</text>
</svg>
