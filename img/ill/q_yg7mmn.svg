<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="18.5" font-weight="bold" fill="#222">CPU 模板 POWER 灯不亮：先查前级输入，不查输出继电器</text>
  <rect x="34" y="52" width="592" height="52" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="52" y="72" font-size="13" fill="#2a7a2a" font-weight="bold">第 1 步　检查熔断器是否熔断</text>
  <text x="52" y="92" font-size="11.8" fill="#333">熔丝断 → CPU 板失电 → POWER 灭（最常见原因）</text>
  <rect x="34" y="112" width="592" height="52" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="52" y="132" font-size="13" fill="#2a7a2a" font-weight="bold">第 2 步　检查输入接触是否不良</text>
  <text x="52" y="152" font-size="11.8" fill="#333">电源端子、插接件松动氧化 → 供电时有时无</text>
  <rect x="34" y="172" width="592" height="52" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="52" y="192" font-size="13" fill="#2a7a2a" font-weight="bold">第 3 步　检查输入线是否断线</text>
  <text x="52" y="212" font-size="11.8" fill="#333">外部供电回路开路 → 板上无电</text>

  <rect x="34" y="232" width="592" height="66" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.7"/>
  <text x="52" y="254" font-size="12.8" fill="#c33" font-weight="bold">✗ 题干顺序「先查输出继电器是否损坏」——错误</text>
  <text x="52" y="276" font-size="12" fill="#333">输出继电器损坏不会导致 POWER 灯熄灭；POWER 灯亮而输出继电器不闭合，才涉及</text>
  <text x="52" y="292" font-size="12" fill="#333">电源故障或 I/O 总线异常等后级问题。</text>
  <rect x="30" y="302" width="600" height="62" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="324" font-size="12.3" fill="#7a5c00">判据：POWER 不亮的三个原因（熔丝、输入接触、输入线）都在前级输入侧，与输出继电器无关 → 判错误。</text>
  <text x="46" y="345" font-size="12.3" fill="#7a5c00">对照记忆：POWER 灭 = 前级没电；POWER 亮但输出不动 = 后级（电源带载能力 / I-O 总线 / 输出点）。</text>
</svg>