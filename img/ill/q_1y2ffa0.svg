<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">直流电动机励磁方式：串励＝励磁绕组与电枢串联，Ia = I = If</text>
  <!-- 串励 -->
  <rect x="30" y="54" width="196" height="176" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="128" y="76" font-size="13.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">串励（本题 D 正确）</text>
  <rect x="104" y="90" width="50" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="129" y="108" font-size="11" text-anchor="middle" fill="#333">电源 U</text>
  <line x1="104" y1="116" x2="104" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="154" y1="116" x2="188" y2="116" stroke="#333" stroke-width="2"/>
  <line x1="188" y1="116" x2="188" y2="206" stroke="#333" stroke-width="2"/>
  <!-- 励磁绕组（串联） -->
  <rect x="88" y="150" width="32" height="22" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.8"/>
  <text x="104" y="188" font-size="10.5" text-anchor="middle" fill="#7a5c00" font-weight="bold">If 励磁</text>
  <line x1="104" y1="172" x2="104" y2="196" stroke="#333" stroke-width="2"/>
  <!-- 电枢 -->
  <circle cx="130" cy="196" r="15" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <text x="130" y="200" font-size="10" text-anchor="middle" fill="#333">M</text>
  <line x1="145" y1="196" x2="188" y2="196" stroke="#333" stroke-width="2"/>
  <text x="128" y="222" font-size="11" text-anchor="middle" fill="#2a7a2a" font-weight="bold">Ia = I = If（电流相等）</text>
  <!-- 并励 -->
  <rect x="240" y="54" width="186" height="176" rx="8" fill="#f4f7ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="333" y="76" font-size="13.5" text-anchor="middle" fill="#2F5FD0" font-weight="bold">并励</text>
  <rect x="308" y="90" width="50" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="333" y="108" font-size="11" text-anchor="middle" fill="#333">电源 U</text>
  <line x1="300" y1="116" x2="300" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="366" y1="116" x2="366" y2="200" stroke="#333" stroke-width="2"/>
  <rect x="288" y="140" width="24" height="34" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="300" y="196" font-size="10" anchor="middle" fill="#7a5c00">If</text>
  <circle cx="333" cy="176" r="15" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <text x="333" y="180" font-size="10" text-anchor="middle" fill="#333">M</text>
  <line x1="308" y1="176" x2="318" y2="176" stroke="#333" stroke-width="2"/>
  <line x1="348" y1="176" x2="366" y2="176" stroke="#333" stroke-width="2"/>
  <text x="333" y="216" font-size="11" text-anchor="middle" fill="#2F5FD0">I = Ia + If（分流）</text>
  <!-- 复励 -->
  <rect x="440" y="54" width="190" height="176" rx="8" fill="#fbf9f2" stroke="#b8860b" stroke-width="1.5"/>
  <text x="535" y="76" font-size="13.5" text-anchor="middle" fill="#7a5c00" font-weight="bold">复励</text>
  <rect x="510" y="90" width="50" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="535" y="108" font-size="11" text-anchor="middle" fill="#333">电源 U</text>
  <line x1="500" y1="116" x2="500" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="570" y1="116" x2="570" y2="200" stroke="#333" stroke-width="2"/>
  <rect x="492" y="136" width="22" height="30" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <rect x="524" y="136" width="50" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="549" y="152" font-size="10" text-anchor="middle" fill="#333">串联 If₁</text>
  <circle cx="549" cy="182" r="14" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <text x="549" y="186" font-size="9.5" text-anchor="middle" fill="#333">M</text>
  <line x1="570" y1="160" x2="570" y2="176" stroke="#333" stroke-width="2"/>
  <text x="535" y="216" font-size="11" text-anchor="middle" fill="#7a5c00">串励绕组＋并励绕组</text>
  <!-- 要点 -->
  <rect x="30" y="246" width="600" height="108" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="268" font-size="12.5" fill="#7a5c00">· 串励：励磁绕组与电枢绕组「串联」在同一电流回路中——Ia = I = If，励磁电流随负载同步增减；</text>
  <text x="46" y="290" font-size="12.5" fill="#7a5c00">  负载增大 → 电流增大 → 磁通增大 → 转矩显著上升（起动转矩大，故常用于起重机、电力机车）。</text>
  <text x="46" y="312" font-size="12.5" fill="#c33">✗ 错项：A「励磁由独立电源供电、与电枢无关」＝他励；B「励磁与电枢并联」＝并励；</text>
  <text x="46" y="334" font-size="12.5" fill="#c33">  C「同时具有并励和串励两种绕组」＝复励——都不是串励的定义。</text>
</svg>
