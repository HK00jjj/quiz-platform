<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#1a1a1a">
    <text x="330" y="32" font-size="20" font-weight="bold" text-anchor="middle">右手螺旋定则：螺旋管与直导体两种用法对比</text>

    <line x1="330" y1="58" x2="330" y2="300" stroke="#999999" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- 左栏：通电螺旋管 -->
    <text x="165" y="72" font-size="16" font-weight="bold" text-anchor="middle">通电螺旋管</text>
    <path d="M 70 135 A 15 18 0 0 1 100 135 A 15 18 0 0 1 130 135 A 15 18 0 0 1 160 135 A 15 18 0 0 1 190 135 A 15 18 0 0 1 220 135 A 15 18 0 0 1 250 135" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="58" y="141" font-size="14" font-weight="bold" text-anchor="end">S</text>
    <text x="258" y="141" font-size="14" font-weight="bold">N</text>
    <line x1="90" y1="135" x2="220" y2="135" stroke="#444444" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="230,135 218,129 218,141" fill="#444444"/>
    <polygon points="115,122 124,114 128,125" fill="#1a1a1a"/>
    <polygon points="175,122 184,114 188,125" fill="#1a1a1a"/>
    <!-- 小手势 -->
    <rect x="110" y="172" width="40" height="36" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="110" y1="183" x2="88" y2="183" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="195" x2="86" y2="195" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="182" x2="168" y2="182" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
    <polygon points="178,182 165,175 165,189" fill="#1a1a1a"/>
    <text x="165" y="238" font-size="15" text-anchor="middle" font-weight="bold">四指 → 电流方向</text>
    <text x="165" y="264" font-size="15" text-anchor="middle" font-weight="bold">拇指 → 磁感线方向</text>

    <!-- 右栏：通电直导体 -->
    <text x="495" y="72" font-size="16" font-weight="bold" text-anchor="middle">通电直导体</text>
    <line x1="495" y1="98" x2="495" y2="222" stroke="#1a1a1a" stroke-width="5"/>
    <line x1="495" y1="204" x2="495" y2="152" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="495,142 488,157 502,157" fill="#1a1a1a"/>
    <text x="508" y="192" font-size="15" font-weight="bold">I</text>
    <ellipse cx="495" cy="160" rx="55" ry="22" fill="none" stroke="#444444" stroke-width="1.5"/>
    <ellipse cx="495" cy="160" rx="95" ry="38" fill="none" stroke="#444444" stroke-width="1.5"/>
    <polygon points="550,165 545,152 555,152" fill="#444444"/>
    <polygon points="440,155 435,168 445,168" fill="#444444"/>
    <!-- 小手势 -->
    <rect x="580" y="176" width="36" height="34" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="580" y1="187" x2="560" y2="187" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <line x1="580" y1="198" x2="558" y2="198" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <line x1="598" y1="176" x2="598" y2="152" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
    <polygon points="598,142 591,155 605,155" fill="#1a1a1a"/>
    <text x="495" y="238" font-size="15" text-anchor="middle" font-weight="bold">拇指 → 电流方向</text>
    <text x="495" y="264" font-size="15" text-anchor="middle" font-weight="bold">四指 → 磁感线方向</text>

    <!-- 结论框 -->
    <rect x="80" y="300" width="500" height="76" fill="none" stroke="#555555" stroke-width="1.5" rx="6"/>
    <text x="330" y="330" font-size="15" text-anchor="middle" font-weight="bold">两种用法中拇指与四指的分工恰好相反，不能混用</text>
    <text x="330" y="356" font-size="14" text-anchor="middle" fill="#333333">"无论哪种导体都是拇指指向电流方向"的说法是错误的</text>
  </g>
</svg>
