<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="26" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">两相触电的电流回路：相线 → 人体 → 相线</text>

  <!-- 电源框 -->
  <rect x="240" y="42" width="180" height="36" rx="6" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
  <text x="330" y="65" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">三相电源</text>
  <!-- 电源内部回路箭头 -->
  <line x1="382" y1="60" x2="286" y2="60" stroke="#555" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polygon points="278,60 290,55 290,65" fill="#555"/>
  <text x="334" y="52" font-size="12" fill="#555" text-anchor="middle">经电源构成回路</text>

  <!-- 相线 -->
  <line x1="270" y1="78" x2="270" y2="150" stroke="#222" stroke-width="3.5"/>
  <line x1="390" y1="78" x2="390" y2="150" stroke="#222" stroke-width="3.5"/>
  <circle cx="270" cy="150" r="4" fill="#222"/>
  <circle cx="390" cy="150" r="4" fill="#222"/>
  <text x="254" y="132" font-size="14" font-weight="bold" fill="#222" text-anchor="end">L1</text>
  <text x="406" y="132" font-size="14" font-weight="bold" fill="#222">L2</text>

  <!-- U=380V -->
  <line x1="280" y1="100" x2="380" y2="100" stroke="#8a1f1f" stroke-width="2.5"/>
  <polygon points="270,100 284,94 284,106" fill="#8a1f1f"/>
  <polygon points="390,100 376,94 376,106" fill="#8a1f1f"/>
  <text x="330" y="90" font-size="16" font-weight="bold" fill="#8a1f1f" text-anchor="middle">U = 380 V</text>

  <!-- 人形 -->
  <circle cx="330" cy="162" r="14" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <line x1="330" y1="176" x2="330" y2="240" stroke="#222" stroke-width="5"/>
  <polyline points="330,184 296,170 272,152" fill="none" stroke="#222" stroke-width="4"/>
  <polyline points="330,184 364,170 388,152" fill="none" stroke="#222" stroke-width="4"/>
  <line x1="330" y1="240" x2="314" y2="288" stroke="#222" stroke-width="4"/>
  <line x1="330" y1="240" x2="346" y2="288" stroke="#222" stroke-width="4"/>
  <!-- 绝缘鞋 -->
  <rect x="298" y="288" width="28" height="10" rx="2" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <rect x="334" y="288" width="28" height="10" rx="2" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="382" y="296" font-size="12" fill="#555">绝缘鞋</text>

  <!-- 回路电流箭头 -->
  <polygon points="270,128 265,140 275,140" fill="#1a5c2e"/>
  <polygon points="298,166 286,160 291,171" fill="#1a5c2e"/>
  <polygon points="330,218 325,206 335,206" fill="#1a5c2e"/>
  <polygon points="362,166 374,160 369,171" fill="#1a5c2e"/>
  <polygon points="390,116 385,128 395,128" fill="#1a5c2e"/>
  <text x="344" y="216" font-size="15" font-weight="bold" fill="#1a5c2e">i 很大</text>

  <!-- 地面与接地符号 -->
  <line x1="180" y1="302" x2="448" y2="302" stroke="#222" stroke-width="2"/>
  <g stroke="#555" stroke-width="1.5">
    <line x1="200" y1="302" x2="192" y2="312"/>
    <line x1="250" y1="302" x2="242" y2="312"/>
    <line x1="300" y1="302" x2="292" y2="312"/>
    <line x1="350" y1="302" x2="342" y2="312"/>
    <line x1="400" y1="302" x2="392" y2="312"/>
    <line x1="440" y1="302" x2="432" y2="312"/>
  </g>
  <!-- 人脚到大地的虚线（不通） -->
  <line x1="308" y1="300" x2="252" y2="322" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="258" y1="310" x2="276" y2="326" stroke="#8a1f1f" stroke-width="3"/>
  <line x1="276" y1="310" x2="258" y2="326" stroke="#8a1f1f" stroke-width="3"/>
  <!-- 接地符号 -->
  <line x1="240" y1="322" x2="240" y2="340" stroke="#222" stroke-width="2.5"/>
  <line x1="224" y1="340" x2="256" y2="340" stroke="#222" stroke-width="2.5"/>
  <line x1="229" y1="346" x2="251" y2="346" stroke="#222" stroke-width="2.5"/>
  <line x1="234" y1="352" x2="246" y2="352" stroke="#222" stroke-width="2.5"/>
  <text x="262" y="354" font-size="13" fill="#555">大地</text>

  <!-- 右侧要点框 -->
  <rect x="462" y="222" width="186" height="92" rx="8" fill="#fdf4f4" stroke="#8a1f1f" stroke-width="2"/>
  <text x="555" y="246" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">回路不经大地</text>
  <text x="476" y="268" font-size="13.5" fill="#8a1f1f">穿绝缘鞋、站绝缘台</text>
  <text x="476" y="288" font-size="13.5" fill="#8a1f1f">均不起保护作用</text>
  <text x="476" y="306" font-size="13" fill="#555">电流大小与大地无关</text>

  <!-- 底部 -->
  <line x1="40" y1="368" x2="620" y2="368" stroke="#bbb" stroke-width="1"/>
  <text x="330" y="390" font-size="14" fill="#333" text-anchor="middle">电流路径：L1 → 人体 → L2 → 电源：380V 直接加于人体，电阻小、电流大，十分危险</text>
</svg>
