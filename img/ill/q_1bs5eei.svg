<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">触发脉冲的两种输出方式——多管隔离触发必选脉冲变压器</text>
  <line x1="330" y1="52" x2="330" y2="250" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- 左：直接输出 -->
  <text x="50" y="70" font-size="14" font-weight="bold" fill="#555">① 直接输出</text>
  <rect x="50" y="96" width="100" height="52" rx="8" fill="#eef4ff" stroke="#2F5FD0" stroke-width="2"/>
  <text x="100" y="118" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">触发电路</text>
  <text x="100" y="136" font-size="10.5" text-anchor="middle" fill="#2F5FD0">（控制侧）</text>
  <line x1="150" y1="122" x2="238" y2="122" stroke="#333" stroke-width="2"/>
  <text x="186" y="112" font-size="11" fill="#c33" font-weight="bold">直接相连</text>
  <rect x="238" y="96" width="80" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="278" y="118" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">晶闸管</text>
  <text x="278" y="136" font-size="10.5" text-anchor="middle" fill="#555">（主电路侧）</text>
  <rect x="50" y="168" width="268" height="64" rx="8" fill="#fdf0f0" stroke="#c33" stroke-width="1.5"/>
  <text x="64" y="190" font-size="11.5" fill="#a33">✗ 触发电路与主电路有电的联系</text>
  <text x="64" y="210" font-size="11.5" fill="#a33">仅在触发少量晶闸管且无须绝缘时可用；</text>
  <text x="64" y="226" font-size="11.5" fill="#a33">优点：效率较高、电路简单、脉冲前沿陡。</text>
  <!-- 右：脉冲变压器输出 -->
  <text x="356" y="70" font-size="14" font-weight="bold" fill="#2a7a2a">② 脉冲变压器输出</text>
  <rect x="356" y="96" width="88" height="52" rx="8" fill="#eef4ff" stroke="#2F5FD0" stroke-width="2"/>
  <text x="400" y="118" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">触发电路</text>
  <text x="400" y="136" font-size="10.5" text-anchor="middle" fill="#2F5FD0">（控制侧）</text>
  <line x1="444" y1="122" x2="468" y2="122" stroke="#333" stroke-width="2"/>
  <!-- 脉冲变压器 TP -->
  <rect x="468" y="104" width="26" height="36" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <line x1="500" y1="98" x2="500" y2="146" stroke="#2a7a2a" stroke-width="2.5"/>
  <line x1="506" y1="98" x2="506" y2="146" stroke="#2a7a2a" stroke-width="2.5"/>
  <rect x="512" y="104" width="26" height="36" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="503" y="166" font-size="11" text-anchor="middle" fill="#2a7a2a" font-weight="bold">脉冲变压器 TP</text>
  <line x1="538" y1="122" x2="562" y2="122" stroke="#333" stroke-width="2"/>
  <rect x="562" y="96" width="76" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="600" y="118" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">多只 VT</text>
  <text x="600" y="136" font-size="10.5" text-anchor="middle" fill="#555">（门极）</text>
  <rect x="356" y="176" width="282" height="56" rx="8" fill="#f0f9f0" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="370" y="198" font-size="11.5" fill="#1c5c1c">✓ 主电路与触发电路无电联系、选极性方便</text>
  <text x="370" y="218" font-size="11.5" fill="#1c5c1c">适合多只晶闸管同时触发且需要电气隔离的场合</text>
  <!-- 要点 -->
  <rect x="40" y="262" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="284" font-size="12.5" fill="#7a5c00">本题场景：同一触发电路驱动多只晶闸管＋必须电气隔离 → 直接输出不满足，应改用脉冲变压器输出。</text>
  <text x="20" y="334" font-size="12" fill="#888">判别要点：先看「是否多管」、再看「是否要隔离」，两条任一不满足直接输出即被否决。</text>
</svg>
