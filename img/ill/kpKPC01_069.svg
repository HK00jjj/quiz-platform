<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr69" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="330" y="30" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">同一电路中多处标注接地符号且互相连通的示意</text>

  <!-- 电路回路 -->
  <line x1="110" y1="100" x2="550" y2="100" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="260" x2="550" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="550" y1="100" x2="550" y2="260" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 电池（左边线） -->
  <line x1="110" y1="100" x2="110" y2="135" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="88" y1="135" x2="132" y2="135" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="98" y1="150" x2="122" y2="150" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="110" y1="150" x2="110" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <text x="70" y="132" font-size="15" fill="#1a1a1a">+</text>
  <text x="70" y="156" font-size="15" fill="#1a1a1a">E</text>

  <!-- R1、R2（顶边串联） -->
  <rect x="210" y="86" width="60" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="390" y="86" width="60" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="240" y="78" font-size="14" fill="#1a1a1a" text-anchor="middle">R1</text>
  <text x="420" y="78" font-size="14" fill="#1a1a1a" text-anchor="middle">R2</text>
  <circle cx="340" cy="100" r="4.5" fill="#1a1a1a"/>
  <line x1="146" y1="100" x2="176" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arr69)"/>
  <text x="156" y="90" font-size="14" fill="#1a1a1a">I</text>

  <!-- 接地点A（底边） -->
  <line x1="170" y1="260" x2="170" y2="290" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="148" y1="296" x2="192" y2="296" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="156" y1="304" x2="184" y2="304" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="163" y1="312" x2="177" y2="312" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="196" y="308" font-size="14" font-weight="bold" fill="#1a1a1a">0V</text>

  <!-- 接地点B（顶边节点，向上） -->
  <line x1="340" y1="100" x2="340" y2="74" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="318" y1="80" x2="362" y2="80" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="326" y1="88" x2="354" y2="88" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="333" y1="96" x2="347" y2="96" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="366" y="90" font-size="14" font-weight="bold" fill="#1a1a1a">0V</text>

  <!-- 接地点C（右边线，向右再向下） -->
  <line x1="550" y1="180" x2="575" y2="180" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="575" y1="180" x2="575" y2="212" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="553" y1="218" x2="597" y2="218" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="561" y1="226" x2="589" y2="226" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="568" y1="234" x2="582" y2="234" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="601" y="230" font-size="14" font-weight="bold" fill="#1a1a1a">0V</text>

  <!-- 互相连通虚线 -->
  <polyline points="170,312 170,344 620,344 620,54 340,54 340,74" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="7,5"/>
  <polyline points="575,234 575,344" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="470" y="336" font-size="13" fill="#333333">互相连通（同一参考点）</text>

  <!-- 说明 -->
  <text x="330" y="376" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">各接地符号处互相连通，电位一律为 0V</text>
</svg>
