<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr72" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="330" y="30" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">金属屏蔽罩封闭元器件并接地示意</text>

  <!-- 外界电磁干扰（弧线波） -->
  <path d="M 160 150 Q 195 185 160 220" fill="none" stroke="#333333" stroke-width="2"/>
  <path d="M 190 138 Q 232 185 190 232" fill="none" stroke="#333333" stroke-width="2"/>
  <path d="M 220 126 Q 268 185 220 244" fill="none" stroke="#333333" stroke-width="2"/>
  <line x1="224" y1="185" x2="244" y2="185" stroke="#333333" stroke-width="2.5" marker-end="url(#arr72)"/>
  <text x="62" y="112" font-size="14" fill="#333333">外界电磁干扰</text>

  <!-- 金属屏蔽罩（双线表示壁厚，底部开口） -->
  <path d="M 250 260 L 250 110 L 410 110 L 410 260" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M 262 260 L 262 122 L 398 122 L 398 260" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="330" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">金属屏蔽罩</text>

  <!-- 罩内元器件与电路 -->
  <text x="330" y="164" font-size="13" fill="#333333" text-anchor="middle">被保护电路</text>
  <line x1="270" y1="202" x2="300" y2="202" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="360" y1="202" x2="390" y2="202" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="300" y="180" width="60" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="330" y="207" font-size="13" fill="#1a1a1a" text-anchor="middle">元器件</text>

  <!-- 罩体接地 -->
  <line x1="410" y1="260" x2="410" y2="300" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="410" y1="300" x2="410" y2="328" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="388" y1="308" x2="432" y2="308" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="396" y1="316" x2="424" y2="316" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="403" y1="324" x2="417" y2="324" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="440" y="316" font-size="14" fill="#1a1a1a">接地</text>
  <text x="440" y="336" font-size="14" font-weight="bold" fill="#1a1a1a">罩体电位 0V</text>

  <!-- 大地 -->
  <line x1="360" y1="344" x2="500" y2="344" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="385" y1="344" x2="377" y2="354" stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="430" y1="344" x2="422" y2="354" stroke="#1a1a1a" stroke-width="1.3"/>
  <line x1="475" y1="344" x2="467" y2="354" stroke="#1a1a1a" stroke-width="1.3"/>

  <!-- 说明 -->
  <rect x="70" y="360" width="520" height="36" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="330" y="384" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">金属罩封闭 + 接地缺一不可：干扰电荷经接地泄放，罩内电路免受干扰</text>
</svg>
