<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#ffffff"/>

  <!-- 上半：简单实物电路 -->
  <line x1="140" y1="80" x2="250" y2="80" stroke="#333333" stroke-width="2"/>
  <circle cx="250" cy="80" r="4" fill="#333333"/>
  <line x1="254" y1="80" x2="306" y2="80" stroke="#333333" stroke-width="2"/>
  <circle cx="310" cy="80" r="4" fill="#333333"/>
  <line x1="314" y1="80" x2="420" y2="80" stroke="#333333" stroke-width="2"/>
  <line x1="420" y1="80" x2="420" y2="119" stroke="#333333" stroke-width="2"/>
  <circle cx="420" cy="145" r="26" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="402" y1="127" x2="438" y2="163" stroke="#333333" stroke-width="2"/>
  <line x1="438" y1="127" x2="402" y2="163" stroke="#333333" stroke-width="2"/>
  <line x1="420" y1="171" x2="420" y2="210" stroke="#333333" stroke-width="2"/>
  <line x1="420" y1="210" x2="140" y2="210" stroke="#333333" stroke-width="2"/>
  <line x1="140" y1="210" x2="140" y2="140" stroke="#333333" stroke-width="2"/>
  <line x1="140" y1="125" x2="140" y2="80" stroke="#333333" stroke-width="2"/>

  <!-- 电池符号 -->
  <line x1="120" y1="125" x2="160" y2="125" stroke="#333333" stroke-width="2.5"/>
  <line x1="130" y1="140" x2="150" y2="140" stroke="#333333" stroke-width="2.5"/>
  <line x1="140" y1="140" x2="140" y2="210" stroke="#333333" stroke-width="2"/>
  <text x="100" y="137" font-size="15" font-style="italic" font-weight="bold" fill="#333333">E</text>

  <!-- 电流箭头 -->
  <polygon points="180,75 210,75 210,71 224,80 210,89 210,85 180,85" fill="#333333" transform="translate(0,-5)"/>

  <!-- 虚线引线：部件 → 归类框 -->
  <line x1="162" y1="132" x2="135" y2="253" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="280" y1="88" x2="330" y2="253" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="444" y1="158" x2="525" y2="253" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 归类框1：电源 -->
  <rect x="50" y="255" width="170" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="135" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">电源</text>
  <text x="135" y="303" font-size="14" text-anchor="middle" fill="#444444">干电池</text>

  <!-- 归类框2：中间环节 -->
  <rect x="245" y="255" width="170" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="330" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">中间环节</text>
  <text x="330" y="303" font-size="14" text-anchor="middle" fill="#444444">开关、导线</text>

  <!-- 归类框3：负载 -->
  <rect x="440" y="255" width="170" height="60" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="525" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">负载</text>
  <text x="525" y="303" font-size="14" text-anchor="middle" fill="#444444">小灯泡</text>

  <!-- 底部结论 -->
  <text x="330" y="355" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">三部分缺一不可，共同构成闭合电路</text>
</svg>
