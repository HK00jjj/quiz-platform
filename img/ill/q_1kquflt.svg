<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">沿墙接地干线（扁钢）上设临时接地接线柱</text>
  <!-- 墙体 -->
  <rect x="40" y="56" width="70" height="250" fill="#f0ece4" stroke="#bbb" stroke-width="1.5"/>
  <line x1="48" y1="70" x2="96" y2="86" stroke="#c9c2b4" stroke-width="1.4"/>
  <line x1="48" y1="110" x2="96" y2="126" stroke="#c9c2b4" stroke-width="1.4"/>
  <line x1="48" y1="150" x2="96" y2="166" stroke="#c9c2b4" stroke-width="1.4"/>
  <line x1="48" y1="190" x2="96" y2="206" stroke="#c9c2b4" stroke-width="1.4"/>
  <line x1="48" y1="230" x2="96" y2="246" stroke="#c9c2b4" stroke-width="1.4"/>
  <line x1="48" y1="270" x2="96" y2="286" stroke="#c9c2b4" stroke-width="1.4"/>
  <text x="75" y="330" font-size="12" text-anchor="middle" fill="#888">变配电所墙</text>
  <!-- 接地扁钢（垂直沿墙） -->
  <rect x="122" y="60" width="14" height="226" rx="2" fill="#d8a94e" stroke="#a07818" stroke-width="1.6"/>
  <text x="160" y="74" font-size="12.5" fill="#a07818" font-weight="bold">接地干线 40×4 扁钢（沿墙明敷）</text>
  <!-- 接线柱1 + 临时接地线 -->
  <circle cx="129" cy="130" r="8" fill="#e8e0cc" stroke="#a07818" stroke-width="2"/>
  <line x1="137" y1="130" x2="250" y2="130" stroke="#6a8f00" stroke-width="2.6"/>
  <rect x="240" y="108" width="14" height="44" rx="3" fill="#f4f4f4" stroke="#888" stroke-width="1.6"/>
  <line x1="254" y1="130" x2="300" y2="130" stroke="#6a8f00" stroke-width="2.6"/>
  <path d="M 300 130 L 316 118 M 300 130 L 316 142" stroke="#6a8f00" stroke-width="2.6"/>
  <text x="272" y="104" font-size="11" fill="#6a8f00" font-weight="bold">临时接地线（携带型）</text>
  <text x="129" y="102" font-size="11" text-anchor="middle" fill="#7a5c00" font-weight="bold">接线柱①</text>
  <!-- 接线柱2 -->
  <circle cx="129" cy="240" r="8" fill="#e8e0cc" stroke="#a07818" stroke-width="2"/>
  <line x1="137" y1="240" x2="250" y2="240" stroke="#6a8f00" stroke-width="2.6" stroke-dasharray="7 4"/>
  <rect x="240" y="218" width="14" height="44" rx="3" fill="#f4f4f4" stroke="#888" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="196" y="262" font-size="11" fill="#888">检修中待挂接</text>
  <text x="129" y="272" font-size="11" text-anchor="middle" fill="#7a5c00" font-weight="bold">接线柱②</text>
  <!-- 挂接场景说明 -->
  <rect x="360" y="120" width="260" height="130" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="490" y="146" font-size="13" text-anchor="middle" fill="#555" font-weight="bold">检修挂接临时接地线（保安线）</text>
  <line x1="400" y1="170" x2="580" y2="170" stroke="#ddd" stroke-width="1"/>
  <text x="378" y="196" font-size="12" fill="#333">· 挂接对象：待检修设备导电体</text>
  <text x="378" y="218" font-size="12" fill="#333">· 作用：防突然来电 / 泄放感应电</text>
  <text x="378" y="240" font-size="12" fill="#333">· 接线柱让「挂接地」快而可靠</text>
  <!-- 要点 -->
  <rect x="40" y="300" width="580" height="52" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="321" font-size="12.5" fill="#7a5c00">沿墙敷设的接地扁钢应在适当位置设临时接地接线柱——检修需要挂临时接地线时，</text>
  <text x="56" y="341" font-size="12.5" fill="#7a5c00">就近可得可靠的接地连接点（该做法正确，是变配电所的标配要求）。</text>
  <text x="20" y="372" font-size="12" fill="#888">记忆点：扁钢沿墙走，间距设柱留握手；检修先接地，突然来电不可怕。</text>
</svg>
