<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr65" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="330" y="30" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">设备金属外壳与零线连接的接零示意</text>

  <!-- 供电线路 -->
  <line x1="90" y1="80" x2="570" y2="80" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="90" y1="130" x2="570" y2="130" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="90" cy="80" r="3.5" fill="#1a1a1a"/>
  <circle cx="90" cy="130" r="3.5" fill="#1a1a1a"/>
  <text x="94" y="68" font-size="14" fill="#1a1a1a">L（相线）</text>
  <text x="94" y="122" font-size="14" fill="#1a1a1a">N（零线）</text>

  <!-- 工作回路引线：L 经开关到设备 -->
  <line x1="285" y1="80" x2="285" y2="158" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="285" y1="182" x2="285" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="285" cy="158" r="3" fill="#1a1a1a"/>
  <circle cx="285" cy="182" r="3" fill="#1a1a1a"/>
  <line x1="285" y1="158" x2="299" y2="182" stroke="#1a1a1a" stroke-width="2"/>
  <text x="308" y="174" font-size="14" fill="#1a1a1a">开关</text>

  <!-- 右引线接零线（工作回路） -->
  <line x1="375" y1="230" x2="375" y2="130" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 设备 -->
  <rect x="260" y="230" width="140" height="85" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="330" cy="272" r="24" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="330" y="279" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>

  <!-- 外壳接零线 -->
  <line x1="260" y1="272" x2="170" y2="272" stroke="#1a1a1a" stroke-width="3.5"/>
  <line x1="170" y1="272" x2="170" y2="134" stroke="#1a1a1a" stroke-width="3.5"/>
  <circle cx="170" cy="130" r="4.5" fill="#1a1a1a"/>
  <line x1="216" y1="252" x2="188" y2="252" stroke="#333333" stroke-width="2" marker-end="url(#arr65)"/>
  <text x="60" y="242" font-size="14" fill="#1a1a1a">外壳接零线</text>
  <text x="60" y="262" font-size="14" fill="#333333">（保护连接）</text>

  <!-- 接零定义说明 -->
  <rect x="90" y="340" width="480" height="44" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="330" y="362" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">金属外壳与供电线路中的零线连接的措施称为：接零</text>
  <text x="330" y="380" font-size="13" fill="#333333" text-anchor="middle">连接对象是零线，不是大地</text>
</svg>
