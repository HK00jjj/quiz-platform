<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">触发电路的基本要求——功率、脉宽、同步、移相四项</text>
  <!-- 四项要求 -->
  <rect x="52" y="52" width="128" height="30" rx="15" fill="#eef4ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="116" y="72" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">① 足够触发功率</text>
  <rect x="212" y="52" width="128" height="30" rx="15" fill="#eef4ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="276" y="72" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">② 足够脉冲宽度</text>
  <rect x="372" y="52" width="128" height="30" rx="15" fill="#eef4ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="436" y="72" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">③ 与主电路同步</text>
  <rect x="532" y="52" width="106" height="30" rx="15" fill="#eef4ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="585" y="72" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">④ 一定移相范围</text>
  <line x1="116" y1="82" x2="116" y2="112" stroke="#2F5FD0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="276" y1="82" x2="256" y2="112" stroke="#2F5FD0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="436" y1="82" x2="396" y2="112" stroke="#2F5FD0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="585" y1="82" x2="560" y2="112" stroke="#2F5FD0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- 组成框图 -->
  <rect x="60" y="112" width="112" height="56" rx="8" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="116" y="136" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c5c1c">同步环节</text>
  <text x="116" y="154" font-size="10.5" text-anchor="middle" fill="#1c5c1c">与电源过零对齐</text>
  <line x1="172" y1="140" x2="198" y2="140" stroke="#333" stroke-width="2"/>
  <path d="M198,134 L210,140 L198,146 Z" fill="#333"/>
  <rect x="210" y="112" width="112" height="56" rx="8" fill="#eef4ff" stroke="#2F5FD0" stroke-width="2"/>
  <text x="266" y="136" font-size="12" text-anchor="middle" font-weight="bold" fill="#2F5FD0">移相环节</text>
  <text x="266" y="154" font-size="10.5" text-anchor="middle" fill="#2F5FD0">改变触发时刻 α</text>
  <line x1="322" y1="140" x2="348" y2="140" stroke="#333" stroke-width="2"/>
  <path d="M348,134 L360,140 L348,146 Z" fill="#333"/>
  <rect x="360" y="112" width="112" height="56" rx="8" fill="#eef4ff" stroke="#2F5FD0" stroke-width="2"/>
  <text x="416" y="136" font-size="12" text-anchor="middle" font-weight="bold" fill="#2F5FD0">脉冲形成</text>
  <text x="416" y="154" font-size="10.5" text-anchor="middle" fill="#2F5FD0">功率放大整形</text>
  <line x1="472" y1="140" x2="498" y2="140" stroke="#c33" stroke-width="2.5"/>
  <path d="M498,133 L512,140 L498,147 Z" fill="#c33"/>
  <rect x="512" y="112" width="126" height="56" rx="8" fill="#fff5f5" stroke="#c33" stroke-width="2"/>
  <text x="575" y="136" font-size="12" text-anchor="middle" font-weight="bold" fill="#c33">晶闸管 VT</text>
  <text x="575" y="154" font-size="10.5" text-anchor="middle" fill="#c33">门极触发导通</text>
  <!-- 主电路示意 -->
  <circle cx="80" cy="242" r="16" fill="#eef4ff" stroke="#2F5FD0" stroke-width="2"/>
  <text x="80" y="247" font-size="11" text-anchor="middle" fill="#2F5FD0">~u₂</text>
  <line x1="96" y1="242" x2="148" y2="242" stroke="#333" stroke-width="2"/>
  <path d="M148,230 L148,254 L170,242 Z" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="170" y1="230" x2="170" y2="254" stroke="#222" stroke-width="2.5"/>
  <line x1="160" y1="250" x2="160" y2="262" stroke="#c33" stroke-width="1.6"/>
  <text x="176" y="238" font-size="11" fill="#222" font-weight="bold">VT</text>
  <line x1="170" y1="242" x2="240" y2="242" stroke="#333" stroke-width="2"/>
  <rect x="240" y="226" width="60" height="32" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="270" y="247" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">R_L</text>
  <line x1="300" y1="242" x2="330" y2="242" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="242" x2="330" y2="284" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="284" x2="80" y2="284" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="284" x2="80" y2="258" stroke="#333" stroke-width="2"/>
  <line x1="416" y1="168" x2="416" y2="214" stroke="#c33" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="416" y1="214" x2="160" y2="214" stroke="#c33" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="160" y1="214" x2="160" y2="262" stroke="#c33" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="250" y="209" font-size="11" fill="#c33">触发脉冲 u_G 送门极</text>
  <!-- 要点 -->
  <rect x="40" y="268" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="288" font-size="12.5" fill="#7a5c00">四项基本要求：触发功率足够、脉冲宽度足够、与主电路同步、具备一定移相范围；另要求可靠、简单、经济。</text>
  <text x="20" y="334" font-size="12" fill="#888">触发电路既可由分立元器件组成，也可由集成电路组成——并非必须集成。</text>
</svg>
