<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">单相全波可控整流（带中心抽头：输出为半波两倍、脉动更小）</text>
  <!-- 变压器二次：a / o / b 三端 -->
  <rect x="70" y="130" width="100" height="100" rx="8" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="120" y="158" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c5c1c">整流变压器</text>
  <text x="120" y="180" font-size="11" text-anchor="middle" fill="#1c5c1c">二次带中心抽头</text>
  <text x="120" y="202" font-size="11" text-anchor="middle" fill="#1c5c1c">u₂ab</text>
  <circle cx="170" cy="112" r="4" fill="#1c5c1c"/>
  <circle cx="170" cy="180" r="4.5" fill="#c33"/>
  <circle cx="170" cy="248" r="4" fill="#1c5c1c"/>
  <text x="178" y="108" font-size="11" fill="#555">a</text>
  <text x="178" y="176" font-size="11" fill="#c33">o（中心抽头）</text>
  <text x="178" y="252" font-size="11" fill="#555">b</text>
  <!-- VT1 上支路 -->
  <line x1="170" y1="112" x2="255" y2="112" stroke="#333" stroke-width="2"/>
  <path d="M255,98 L255,126 L277,112 Z" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="277" y1="98" x2="277" y2="126" stroke="#222" stroke-width="2.5"/>
  <line x1="267" y1="120" x2="267" y2="138" stroke="#c33" stroke-width="1.6"/>
  <text x="232" y="94" font-size="12" fill="#222" font-weight="bold">VT1</text>
  <text x="244" y="152" font-size="10.5" fill="#c33">u_G1</text>
  <line x1="277" y1="112" x2="430" y2="112" stroke="#333" stroke-width="2"/>
  <line x1="430" y1="112" x2="430" y2="172" stroke="#333" stroke-width="2"/>
  <!-- VT2 下支路 -->
  <line x1="170" y1="248" x2="255" y2="248" stroke="#333" stroke-width="2"/>
  <path d="M255,234 L255,262 L277,248 Z" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="277" y1="234" x2="277" y2="262" stroke="#222" stroke-width="2.5"/>
  <line x1="267" y1="256" x2="267" y2="274" stroke="#c33" stroke-width="1.6"/>
  <text x="232" y="238" font-size="12" fill="#222" font-weight="bold">VT2</text>
  <text x="244" y="228" font-size="10.5" fill="#c33">u_G2</text>
  <line x1="277" y1="248" x2="430" y2="248" stroke="#333" stroke-width="2"/>
  <line x1="430" y1="248" x2="430" y2="188" stroke="#333" stroke-width="2"/>
  <!-- 公共点与负载 -->
  <circle cx="430" cy="180" r="4" fill="#333"/>
  <line x1="430" y1="180" x2="470" y2="180" stroke="#333" stroke-width="2"/>
  <rect x="470" y="164" width="70" height="32" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="505" y="185" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">R_L</text>
  <line x1="540" y1="180" x2="580" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="580" y1="180" x2="580" y2="262" stroke="#333" stroke-width="2"/>
  <line x1="580" y1="262" x2="50" y2="262" stroke="#c33" stroke-width="2"/>
  <line x1="50" y1="262" x2="50" y2="180" stroke="#c33" stroke-width="2"/>
  <line x1="50" y1="180" x2="170" y2="180" stroke="#c33" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="316" y="256" font-size="11" fill="#c33">回流接中心抽头 o</text>
  <!-- 要点 -->
  <rect x="40" y="282" width="580" height="40" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="307" font-size="12.5" fill="#7a5c00">全波＝两个半波轮流导通：平均电压为半波两倍（α=0 时 0.9U₂）、脉动更小；每管反向峰值 2√2U₂。</text>
  <text x="20" y="334" font-size="12" fill="#888">VT1、VT2 触发互差 180°：改变 α 同步调节两管，输出极性不变、幅值加倍。</text>
</svg>
