<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18.5" font-weight="bold" fill="#222">一般设计法设计控制电路的四条原则</text>
  <rect x="34" y="52" width="286" height="120" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="177" y="76" font-size="13" text-anchor="middle" fill="#2F5FD0" font-weight="bold">① 最大限度满足工艺要求</text>
  <text x="52" y="100" font-size="12" fill="#333">· 生产机械的工艺过程与动作程序</text>
  <text x="52" y="120" font-size="12" fill="#333">· 这是设计的出发点与验收依据</text>
  <text x="52" y="142" font-size="12" fill="#333">· 其余原则都建立在满足工艺之上</text>

  <rect x="344" y="52" width="286" height="120" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="487" y="76" font-size="13" text-anchor="middle" fill="#7a5c00" font-weight="bold">② 简单、经济</text>
  <text x="362" y="100" font-size="12" fill="#333">· 尽量选用标准/常用典型环节</text>
  <text x="362" y="120" font-size="12" fill="#333">· 缩短连接线、减少电器与触头数量</text>
  <text x="362" y="142" font-size="12" fill="#333">· 非必要不通电（能断电即断电）</text>

  <rect x="34" y="180" width="286" height="120" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="177" y="204" font-size="13" text-anchor="middle" fill="#c33" font-weight="bold">③ 完善的保护环节</text>
  <text x="52" y="228" font-size="12" fill="#333">· 过载（热继电器）</text>
  <text x="52" y="248" font-size="12" fill="#333">· 短路（熔断器/断路器）</text>
  <text x="52" y="270" font-size="12" fill="#333">· 过流、过电压、欠电压、失电压</text>

  <rect x="344" y="180" width="286" height="120" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="487" y="204" font-size="13" text-anchor="middle" fill="#2a7a2a" font-weight="bold">④ 操作、维修方便</text>
  <text x="362" y="228" font-size="12" fill="#333">· 操作位置与器件布置便于触及</text>
  <text x="362" y="248" font-size="12" fill="#333">· 留有检修空间与测点</text>
  <text x="362" y="270" font-size="12" fill="#333">· 标号/图区齐全，便于查线</text>
  <rect x="30" y="310" width="600" height="42" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="332" font-size="12.3" fill="#7a5c00">题干「满足生产要求前提下力求简单经济 + 完善过载/短路/过流等保护」与源文两条原则完全对应 → 判正确。</text>
</svg>