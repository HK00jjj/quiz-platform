<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">三相异步电动机铭牌识读</text>
  <!-- 铭牌 -->
  <rect x="60" y="60" width="300" height="220" rx="6" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <line x1="60" y1="96" x2="360" y2="96" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="86" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">三相异步电动机</text>
  <g font-size="13" fill="#333">
    <text x="84" y="126">型号 Y132M-4</text>
    <text x="240" y="126">频率 50Hz</text>
    <text x="84" y="156">额定功率 7.5 kW</text>
    <text x="240" y="156">接法 △</text>
    <text x="84" y="186">额定电压 380V</text>
    <text x="240" y="186">绝缘等级 B</text>
    <text x="84" y="216">额定电流 15.4 A</text>
    <text x="240" y="216">防护 IP44</text>
    <text x="84" y="246">额定转速 1440 r/min</text>
    <text x="240" y="246">工作制 S1</text>
  </g>
  <!-- 右：读法 -->
  <rect x="390" y="60" width="240" height="220" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="406" y="88" font-size="12.5" font-weight="bold" fill="#7a5c00">关键读数：</text>
  <text x="406" y="112" font-size="12" fill="#7a5c00">· 极数在型号尾标（-4 = 4 极，</text>
  <text x="406" y="132" font-size="12" fill="#7a5c00">  极对数 p = 2）；</text>
  <text x="406" y="156" font-size="12" fill="#7a5c00">· 同步转速 n₀ = 60f / p</text>
  <text x="406" y="176" font-size="12" fill="#7a5c00">  = 60×50/2 = 1500 r/min；</text>
  <text x="406" y="200" font-size="12" fill="#7a5c00">· 转差率 s = (n₀−n) / n₀，</text>
  <text x="406" y="220" font-size="12" fill="#7a5c00">  用额定转速代入；</text>
  <text x="406" y="244" font-size="12" fill="#7a5c00">· 接法/电压/电流三者的</text>
  <text x="406" y="264" font-size="12" fill="#7a5c00">  对应关系不可拆开看。</text>
  <text x="20" y="312" font-size="12" fill="#888">要点：铭牌是调试的第一手参数表——同步转速、转差率、起动方式（Y/Δ）与保护整定都从这里取值。</text>
</svg>
