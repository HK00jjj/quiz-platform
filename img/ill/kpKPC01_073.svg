<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr73" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="330" y="30" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">电阻的混联电路（先并联后串联）</text>

  <!-- 电池 -->
  <line x1="120" y1="90" x2="120" y2="135" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="98" y1="135" x2="142" y2="135" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="108" y1="150" x2="132" y2="150" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="120" y1="150" x2="120" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <text x="80" y="132" font-size="15" fill="#1a1a1a">+</text>
  <text x="80" y="156" font-size="15" fill="#1a1a1a">E</text>

  <!-- 顶线与串联电阻 R1、R2 -->
  <line x1="120" y1="90" x2="560" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="160" y="76" width="60" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="470" y="76" width="60" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="190" y="68" font-size="14" fill="#1a1a1a" text-anchor="middle">R1=5Ω</text>
  <text x="500" y="68" font-size="14" fill="#1a1a1a" text-anchor="middle">R2=7Ω</text>

  <!-- 电流方向 -->
  <line x1="132" y1="90" x2="152" y2="90" stroke="#333333" stroke-width="2" marker-end="url(#arr73)"/>

  <!-- 并联部分：节点A、R3（主线）、R4（下支路）、节点B -->
  <circle cx="280" cy="90" r="4.5" fill="#1a1a1a"/>
  <circle cx="430" cy="90" r="4.5" fill="#1a1a1a"/>
  <rect x="310" y="76" width="60" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="340" y="68" font-size="14" fill="#1a1a1a" text-anchor="middle">R3=6Ω</text>
  <line x1="280" y1="90" x2="280" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="190" x2="310" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="310" y="176" width="60" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="370" y1="190" x2="430" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="430" y1="190" x2="430" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <text x="340" y="224" font-size="14" fill="#1a1a1a" text-anchor="middle">R4=12Ω</text>

  <!-- 并联部分虚线框与标注 -->
  <rect x="272" y="56" width="166" height="152" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="355" y="50" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">先并</text>
  <text x="452" y="136" font-size="14" fill="#1a1a1a">并联部分</text>
  <text x="452" y="158" font-size="14" font-weight="bold" fill="#1a1a1a">R0 = 4Ω</text>
  <line x1="448" y1="146" x2="440" y2="142" stroke="#333333" stroke-width="1.5" marker-end="url(#arr73)"/>

  <!-- 右边线与底线 -->
  <line x1="560" y1="90" x2="560" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="310" x2="560" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="540" y1="310" x2="510" y2="310" stroke="#333333" stroke-width="2" marker-end="url(#arr73)"/>
  <text x="522" y="296" font-size="15" fill="#1a1a1a">I</text>

  <!-- 计算步骤 -->
  <rect x="90" y="330" width="480" height="56" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="330" y="352" font-size="14" fill="#1a1a1a" text-anchor="middle">先并：1/R0 = 1/6 + 1/12，R0 = 6×12/(6+12) = 4Ω</text>
  <text x="330" y="376" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">后串：R = R1 + R2 + R0 = 5 + 7 + 4 = 16Ω</text>
</svg>
