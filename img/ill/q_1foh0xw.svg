<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">单相桥式全控整流——必须成对触发（VT1+VT4 ／ VT2+VT3）</text>
  <!-- 桥臂连线 -->
  <line x1="140" y1="150" x2="340" y2="70" stroke="#333" stroke-width="2"/>
  <line x1="530" y1="150" x2="340" y2="70" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="150" x2="340" y2="230" stroke="#333" stroke-width="2"/>
  <line x1="340" y1="230" x2="530" y2="150" stroke="#333" stroke-width="2"/>
  <circle cx="140" cy="150" r="4" fill="#333"/>
  <circle cx="530" cy="150" r="4" fill="#333"/>
  <circle cx="340" cy="70" r="4" fill="#333"/>
  <circle cx="340" cy="230" r="4" fill="#333"/>
  <text x="118" y="170" font-size="12" fill="#555">a</text>
  <text x="540" y="170" font-size="12" fill="#555">b</text>
  <!-- VT1: a→T 红 -->
  <g transform="translate(240,110) rotate(-21.8)">
    <path d="M-14,-13 L-14,13 L16,0 Z" fill="#fdeeee" stroke="#c33" stroke-width="2"/>
    <line x1="16" y1="-13" x2="16" y2="13" stroke="#c33" stroke-width="2.5"/>
    <line x1="2" y1="8" x2="2" y2="26" stroke="#c33" stroke-width="1.6"/>
  </g>
  <text x="196" y="86" font-size="12" fill="#c33" font-weight="bold">VT1</text>
  <!-- VT2: b→T 蓝 -->
  <g transform="translate(435,110) rotate(-157.1)">
    <path d="M-14,-13 L-14,13 L16,0 Z" fill="#eef3ff" stroke="#2F5FD0" stroke-width="2"/>
    <line x1="16" y1="-13" x2="16" y2="13" stroke="#2F5FD0" stroke-width="2.5"/>
    <line x1="2" y1="8" x2="2" y2="26" stroke="#2F5FD0" stroke-width="1.6"/>
  </g>
  <text x="452" y="86" font-size="12" fill="#2F5FD0" font-weight="bold">VT2</text>
  <!-- VT3: a→B 蓝 -->
  <g transform="translate(240,190) rotate(21.8)">
    <path d="M-14,-13 L-14,13 L16,0 Z" fill="#eef3ff" stroke="#2F5FD0" stroke-width="2"/>
    <line x1="16" y1="-13" x2="16" y2="13" stroke="#2F5FD0" stroke-width="2.5"/>
    <line x1="2" y1="8" x2="2" y2="26" stroke="#2F5FD0" stroke-width="1.6"/>
  </g>
  <text x="196" y="232" font-size="12" fill="#2F5FD0" font-weight="bold">VT3</text>
  <!-- VT4: B→b 红 -->
  <g transform="translate(435,190) rotate(-22.9)">
    <path d="M-14,-13 L-14,13 L16,0 Z" fill="#fdeeee" stroke="#c33" stroke-width="2"/>
    <line x1="16" y1="-13" x2="16" y2="13" stroke="#c33" stroke-width="2.5"/>
    <line x1="2" y1="8" x2="2" y2="26" stroke="#c33" stroke-width="1.6"/>
  </g>
  <text x="452" y="232" font-size="12" fill="#c33" font-weight="bold">VT4</text>
  <!-- 负载 -->
  <line x1="340" y1="70" x2="460" y2="70" stroke="#333" stroke-width="2"/>
  <line x1="460" y1="70" x2="460" y2="104" stroke="#333" stroke-width="2"/>
  <rect x="440" y="104" width="40" height="92" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="460" y="146" font-size="12" text-anchor="middle" fill="#222">负载</text>
  <text x="460" y="166" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">R_L</text>
  <line x1="460" y1="196" x2="460" y2="230" stroke="#333" stroke-width="2"/>
  <line x1="460" y1="230" x2="340" y2="230" stroke="#333" stroke-width="2"/>
  <!-- u2 电源 -->
  <line x1="140" y1="150" x2="100" y2="150" stroke="#333" stroke-width="2"/>
  <circle cx="80" cy="150" r="20" fill="#eef4ff" stroke="#2F5FD0" stroke-width="2"/>
  <text x="80" y="156" font-size="13" text-anchor="middle" fill="#2F5FD0" font-weight="bold">~u₂</text>
  <line x1="80" y1="170" x2="80" y2="290" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="290" x2="530" y2="290" stroke="#333" stroke-width="2"/>
  <line x1="530" y1="290" x2="530" y2="150" stroke="#333" stroke-width="2"/>
  <!-- 对例 -->
  <rect x="40" y="44" width="10" height="10" fill="#c33"/>
  <text x="56" y="53" font-size="11.5" fill="#c33">红：正半周导通对 VT1+VT4（须同时触发）</text>
  <rect x="40" y="60" width="10" height="10" fill="#2F5FD0"/>
  <text x="56" y="69" font-size="11.5" fill="#2F5FD0">蓝：负半周导通对 VT2+VT3（须同时触发）</text>
  <!-- 要点 -->
  <rect x="40" y="312" width="580" height="44" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="332" font-size="12.5" fill="#7a5c00">四管两对桥臂：只有同一对两管同时加触发脉冲才构成回路，单给一只管无法导通；α=0 时 Uo=0.9U₂。</text>
  <text x="20" y="372" font-size="12" fill="#888">正半周 a→VT1→R_L→VT4→b；负半周 b→VT2→R_L→VT3→a，负载电流方向不变。</text>
</svg>
