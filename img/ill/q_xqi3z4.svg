<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="340" fill="#ffffff"/>
  <text x="330" y="28" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">图1-15 白炽灯接电源回路（求电功率、电阻与电功）</text>

  <line x1="120" y1="130" x2="520" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="130" x2="120" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="520" y1="130" x2="520" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="260" x2="280" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="260" x2="520" y2="260" stroke="#333" stroke-width="2"/>

  <!-- 电源 220V -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="280" y1="242" x2="280" y2="278"/>
    <line x1="300" y1="250" x2="300" y2="270"/>
  </g>
  <line x1="280" y1="260" x2="300" y2="260" stroke="#333" stroke-width="2"/>
  <text x="290" y="302" font-size="14" text-anchor="middle" fill="#1a1a1a">U=220V（电源电动势 E）</text>

  <!-- 白炽灯（圆内 X） -->
  <circle cx="240" cy="130" r="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="222" y1="112" x2="258" y2="148" stroke="#333" stroke-width="1.8"/>
  <line x1="258" y1="112" x2="222" y2="148" stroke="#333" stroke-width="1.8"/>
  <text x="240" y="88" font-size="14" text-anchor="middle" fill="#1a1a1a">白炽灯 EL</text>

  <!-- 电流箭头 -->
  <path d="M 400 105 l 16 0 m -7 -5 l 7 5 l -7 5" stroke="#1a5fb4" stroke-width="2" fill="none"/>
  <text x="428" y="110" font-size="14" fill="#1a5fb4">I=0.5A</text>

  <text x="330" y="326" font-size="14" fill="#666" text-anchor="middle">灯两端电压 220V，流过电流 0.5A → P=UI=110W，R=U/I=440Ω，W=UIt=1100J</text>
</svg>
