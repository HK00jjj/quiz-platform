<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">变频器干扰 PLC 的抑制：隔离 / 屏蔽 / 滤波（正解 A、B、C）</text>
  <rect x="46" y="46" width="120" height="46" rx="6" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="70" y="75" font-size="12.5" fill="#c33" font-weight="bold">变频器（干扰源）</text>
  <rect x="290" y="46" width="120" height="46" rx="6" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="326" y="75" font-size="12.5" fill="#2F5FD0" font-weight="bold">同柜 PLC（受扰）</text>
  <path d="M166 62 H 290" stroke="#888" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M166 78 H 290" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="180" y="58" font-size="11" fill="#666">传导（沿导线走）</text>
  <text x="180" y="94" font-size="11" fill="#666">辐射（电磁场耦合）</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#888"/></marker></defs>
  <rect x="46" y="112" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="132" font-size="12.3" fill="#2a7a2a">✓A 隔离：动力电缆与信号电缆分槽敷设并保持间距——切断耦合路径</text>
  <rect x="46" y="148" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="168" font-size="12.3" fill="#2a7a2a">✓B 屏蔽：输出侧屏蔽电缆，屏蔽层规范有效接地——给共模电流泄放通道</text>
  <rect x="46" y="184" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="204" font-size="12.3" fill="#2a7a2a">✓C 滤波：输入侧加装进线电抗器与 EMC 滤波器——把干扰挡在源头</text>
  <rect x="46" y="220" width="568" height="30" rx="5" fill="#fdecec" stroke="#c33" stroke-width="1.3"/>
  <text x="58" y="240" font-size="12.3" fill="#c33">✗D 屏蔽层两端悬空：悬空无法泄放共模电流，屏蔽等于失效</text>
  <rect x="46" y="256" width="568" height="30" rx="5" fill="#fdecec" stroke="#c33" stroke-width="1.3"/>
  <text x="58" y="276" font-size="12.3" fill="#c33">✗E 把 PLC 模拟量公共端与变频器输出端相连——反而引入干扰</text>
  <rect x="30" y="294" width="600" height="82" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="316" font-size="12.3" fill="#7a5c00">干扰传播只有两条路径：传导与辐射。抑制手段对应三类——隔离、屏蔽、滤波，按现场情况组合使用。</text>
  <text x="46" y="337" font-size="12.3" fill="#7a5c00">记忆点：分槽（隔离）＋ 屏蔽层单端接地（屏蔽）＋ 进线电抗器/EMC 滤波器（滤波）。</text>
</svg>