<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">伺服编码器电缆连接与敷设要求</text>
  <!-- 伺服电机 -->
  <rect x="40" y="90" width="170" height="110" rx="14" fill="#fdf0f0" stroke="#c33" stroke-width="2.5"/>
  <text x="125" y="120" font-size="14" text-anchor="middle" font-weight="bold" fill="#922">伺服电机</text>
  <text x="125" y="145" font-size="12" text-anchor="middle" fill="#922">编码器后置</text>
  <rect x="185" y="120" width="26" height="52" rx="4" fill="#fff" stroke="#c33" stroke-width="2"/>
  <text x="198" y="192" font-size="11" text-anchor="middle" fill="#922">编码器</text>
  <!-- 编码器电缆 -->
  <path d="M 211 146 C 280 146 280 146 340 146" fill="none" stroke="#2a7a2a" stroke-width="4"/>
  <text x="276" y="136" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c5c1c">编码器电缆（屏蔽双绞）</text>
  <!-- 驱动器 -->
  <rect x="340" y="80" width="180" height="150" rx="10" fill="#eef2fb" stroke="#36c" stroke-width="2.5"/>
  <text x="430" y="106" font-size="14" text-anchor="middle" font-weight="bold" fill="#234">伺服驱动器</text>
  <text x="356" y="132" font-size="12">CN2 编码器接口</text>
  <text x="356" y="152" font-size="12">CN1 控制/脉冲</text>
  <text x="356" y="172" font-size="12">L1/L2/L3 电源</text>
  <text x="356" y="192" font-size="12">U/V/W 电机线</text>
  <circle cx="348" cy="127" r="4" fill="#2a7a2a"/>
  <!-- 敷设要求框 -->
  <rect x="40" y="230" width="590" height="86" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="254" font-size="12.5" font-weight="bold" fill="#7a5c00">敷设要求：</text>
  <text x="56" y="274" font-size="12" fill="#7a5c00">① 与动力电缆（U/V/W、变频）分槽或间隔 ≥30cm 布放，交叉时垂直交叉；</text>
  <text x="56" y="294" font-size="12" fill="#7a5c00">② 屏蔽层 360° 夹接至驱动器侧接地排（电机侧就近接地）；③ 中间不得接续、不得与动力线共用插头。</text>
  <text x="20" y="338" font-size="12" fill="#888">要点：编码器反馈线是毫伏级信号，抗干扰与屏蔽接地直接决定位置反馈是否抖动/报警。</text>
</svg>
