<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="430" fill="#ffffff"/>
  <text x="20" y="30" font-size="18.5" font-weight="bold" fill="#222">C620-1 车床：M1 由 KM 控制，M2 由 QS2 控制且受 M1 联锁</text>
  <rect x="30" y="48" width="380" height="260" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="220" y="70" font-size="13" text-anchor="middle" fill="#555" font-weight="bold">主电路</text>
  <line x1="52" y1="96" x2="392" y2="96" stroke="#333" stroke-width="1.8"/>
  <line x1="52" y1="126" x2="392" y2="126" stroke="#333" stroke-width="1.8"/>
  <line x1="52" y1="156" x2="392" y2="156" stroke="#333" stroke-width="1.8"/>
  <text x="40" y="100" font-size="11" fill="#555">L1</text>
  <text x="40" y="130" font-size="11" fill="#555">L2</text>
  <text x="40" y="160" font-size="11" fill="#555">L3</text>
  <rect x="70" y="88" width="34" height="76" rx="4" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="87" y="132" font-size="11" text-anchor="middle" fill="#333">QS1</text>
  <rect x="130" y="88" width="34" height="76" rx="4" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="147" y="132" font-size="11" text-anchor="middle" fill="#333">FU</text>
  <rect x="196" y="88" width="40" height="76" rx="4" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.8"/>
  <text x="216" y="132" font-size="11" text-anchor="middle" fill="#2F5FD0" font-weight="bold">KM</text>
  <rect x="262" y="88" width="40" height="76" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.8"/>
  <text x="282" y="132" font-size="11" text-anchor="middle" fill="#7a5c00" font-weight="bold">FR</text>
  <circle cx="330" cy="96" r="15" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="330" y="100" font-size="10.5" text-anchor="middle" fill="#333">M1</text>
  <text x="330" y="128" font-size="10" text-anchor="middle" fill="#555">主轴</text>
  <!-- M2 分支：取自主触头下口（三相同一取电点） -->
  <line x1="236" y1="96" x2="236" y2="196" stroke="#2a7a2a" stroke-width="2"/>
  <line x1="236" y1="196" x2="330" y2="196" stroke="#2a7a2a" stroke-width="2"/>
  <rect x="252" y="180" width="34" height="32" rx="4" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="269" y="200" font-size="10.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">QS2</text>
  <circle cx="330" cy="212" r="15" fill="#fff" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="330" y="216" font-size="10.5" text-anchor="middle" fill="#2a7a2a">M2</text>
  <text x="330" y="244" font-size="10" text-anchor="middle" fill="#2a7a2a">冷却泵</text>
  <line x1="330" y1="227" x2="330" y2="252" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="52" y="286" font-size="11.5" fill="#2a7a2a">M2 支路取电点：KM 主触头下口（KM 不吸合 → M2 无电）</text>
  <text x="52" y="302" font-size="11" fill="#666">通路自检：QS2 串在 M2 支路中；KM 主触头在 M2 取电点之前</text>

  <rect x="426" y="48" width="204" height="260" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="528" y="72" font-size="12.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ 正解 A</text>
  <text x="442" y="98" font-size="12" fill="#333">M1：SB2 起动 / SB1 停止</text>
  <text x="442" y="118" font-size="12" fill="#333">经接触器 KM 控制</text>
  <text x="442" y="142" font-size="12" fill="#333">M2：转换开关 QS2 控制</text>
  <text x="442" y="166" font-size="12" fill="#333">联锁：M1 运转后 M2 才能</text>
  <text x="442" y="184" font-size="12" fill="#333">起动供冷却液</text>
  <line x1="442" y1="198" x2="614" y2="198" stroke="#cfe3cf" stroke-width="1"/>
  <text x="442" y="220" font-size="11.8" fill="#c33">✗ B 认为两电机相互独立</text>
  <text x="442" y="240" font-size="11.8" fill="#c33">✗ C 把 QS2 误作 KM</text>
  <text x="442" y="260" font-size="11.8" fill="#c33">✗ D 主轴停后泵仍可转</text>
  <text x="442" y="284" font-size="11.5" fill="#666">后三项均违背 M1→M2 联锁</text>
  <rect x="30" y="320" width="600" height="88" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="342" font-size="12.3" fill="#7a5c00">记忆：C620-1「主轴 KM 起停、冷却泵 QS2 通断、泵受主轴联锁」——主轴不转，冷却泵无电，不会单独供液。</text>
  <text x="46" y="363" font-size="12.3" fill="#7a5c00">误诊根因：把两台电机的控制方式记成各自独立，或把转换开关 QS2 记成接触器 KM。</text>
  <text x="46" y="384" font-size="12.3" fill="#7a5c00">联锁实现：M2 支路电源取自 KM 主触头出线端，KM 不吸合则 M2 回路无电。</text>
</svg>