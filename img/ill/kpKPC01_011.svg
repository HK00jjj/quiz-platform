<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#ffffff"/>

  <!-- 顶部说明 -->
  <text x="320" y="52" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">标注接地符号处，电位规定为 0V</text>
  <text x="320" y="80" font-size="14" text-anchor="middle" fill="#444444">可直接作为零电位基准点使用</text>

  <!-- 电路回路 -->
  <line x1="160" y1="105" x2="250" y2="105" stroke="#333333" stroke-width="2"/>
  <circle cx="250" cy="105" r="4" fill="#333333"/>
  <line x1="254" y1="105" x2="306" y2="105" stroke="#333333" stroke-width="2"/>
  <circle cx="310" cy="105" r="4" fill="#333333"/>
  <line x1="314" y1="105" x2="480" y2="105" stroke="#333333" stroke-width="2"/>
  <line x1="480" y1="105" x2="480" y2="144" stroke="#333333" stroke-width="2"/>
  <circle cx="480" cy="170" r="26" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="462" y1="152" x2="498" y2="188" stroke="#333333" stroke-width="2"/>
  <line x1="498" y1="152" x2="462" y2="188" stroke="#333333" stroke-width="2"/>
  <line x1="480" y1="196" x2="480" y2="300" stroke="#333333" stroke-width="2"/>
  <line x1="480" y1="300" x2="160" y2="300" stroke="#333333" stroke-width="2"/>
  <line x1="160" y1="300" x2="160" y2="200" stroke="#333333" stroke-width="2"/>
  <line x1="160" y1="185" x2="160" y2="105" stroke="#333333" stroke-width="2"/>

  <!-- 电池符号 -->
  <line x1="140" y1="185" x2="180" y2="185" stroke="#333333" stroke-width="2.5"/>
  <line x1="150" y1="200" x2="170" y2="200" stroke="#333333" stroke-width="2.5"/>
  <text x="132" y="180" font-size="14" fill="#333333">＋</text>
  <text x="132" y="216" font-size="14" fill="#333333">−</text>
  <text x="112" y="197" font-size="16" font-style="italic" font-weight="bold" fill="#111111">E</text>

  <!-- 电流箭头 -->
  <polygon points="190,100 220,100 220,96 234,105 220,114 220,110 190,110" fill="#333333" transform="translate(0,-5)"/>
  <text x="210" y="88" font-size="15" font-style="italic" font-weight="bold" text-anchor="middle" fill="#111111">I</text>

  <!-- 接地符号（三横一竖） -->
  <circle cx="320" cy="300" r="4" fill="#333333"/>
  <line x1="320" y1="304" x2="320" y2="326" stroke="#333333" stroke-width="2"/>
  <line x1="302" y1="326" x2="338" y2="326" stroke="#333333" stroke-width="2"/>
  <line x1="308" y1="332" x2="332" y2="332" stroke="#333333" stroke-width="2"/>
  <line x1="314" y1="338" x2="326" y2="338" stroke="#333333" stroke-width="2"/>

  <!-- 接地标注 -->
  <text x="225" y="332" font-size="14" fill="#444444">接地符号</text>
  <line x1="278" y1="327" x2="298" y2="325" stroke="#888888" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="352" y="340" font-size="22" font-weight="bold" fill="#111111">0V</text>
  <text x="352" y="364" font-size="14" fill="#444444">零电位基准点</text>
</svg>
