<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="380" fill="#ffffff"/>
  <text x="330" y="28" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">图1-28 三相交流电压波形（UU、Uv、Uw 互差 120°）</text>

  <line x1="70" y1="200" x2="600" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="330" stroke="#333" stroke-width="2"/>
  <text x="612" y="206" font-size="14" fill="#333">ωt</text>
  <text x="66" y="66" font-size="13" fill="#333">u</text>

  <!-- UU 相：相位 0 -->
  <path d="M 90 200 C 120 100, 180 100, 210 200 C 240 300, 300 300, 330 200 C 360 100, 420 100, 450 200 C 480 300, 540 300, 570 200"
        fill="none" stroke="#c01c28" stroke-width="2.4"/>
  <!-- Uv 相：滞后 120°（右移 80px） -->
  <path d="M 90 140 C 120 240, 180 240, 210 140 C 240 40, 300 40, 330 140 C 360 240, 420 240, 450 140 C 480 40, 540 40, 570 140"
        fill="none" stroke="#1a5fb4" stroke-width="2.4" opacity="0.9"/>
  <!-- Uw 相：滞后 240°（右移 160px） -->
  <path d="M 90 260 C 120 160, 180 160, 210 260 C 240 360, 300 360, 330 260 C 360 160, 420 160, 450 260 C 480 360, 540 360, 570 260"
        fill="none" stroke="#2a7a2a" stroke-width="2.4" opacity="0.9"/>

  <!-- A / B / C 三点：三相互差 120°，各取性质相同点 -->
  <circle cx="150" cy="112" r="5" fill="#c01c28"/><text x="140" y="100" font-size="15" fill="#c01c28" font-weight="bold">A</text>
  <circle cx="230" cy="152" r="5" fill="#1a5fb4"/><text x="238" y="146" font-size="15" fill="#1a5fb4" font-weight="bold">B</text>
  <circle cx="310" cy="272" r="5" fill="#2a7a2a"/><text x="318" y="290" font-size="15" fill="#2a7a2a" font-weight="bold">C</text>

  <!-- 相位差弧线 -->
  <path d="M 230 330 A 60 60 0 0 1 310 330" fill="none" stroke="#666" stroke-width="1.6"/>
  <text x="270" y="352" font-size="14" fill="#666" text-anchor="middle">相邻两点相差 120°</text>

  <!-- 图例 -->
  <g font-size="14">
    <line x1="70" y1="366" x2="100" y2="366" stroke="#c01c28" stroke-width="3"/><text x="106" y="371" fill="#c01c28">UU</text>
    <line x1="160" y1="366" x2="190" y2="366" stroke="#1a5fb4" stroke-width="3"/><text x="196" y="371" fill="#1a5fb4">Uv</text>
    <line x1="250" y1="366" x2="280" y2="366" stroke="#2a7a2a" stroke-width="3"/><text x="286" y="371" fill="#2a7a2a">Uw</text>
  </g>
  <text x="430" y="371" font-size="13" fill="#666">三相对称：360° 三等分，互差 120°</text>
</svg>
