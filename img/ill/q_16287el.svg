<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="412" fill="#ffffff"/>
  <text x="20" y="30" font-size="17.5" fill="#222" font-weight="bold">PWM：周期不变，调占空比改变等效电压</text>
  <rect x="34" y="48" width="592" height="62" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="50" y="70" font-size="12.6" fill="#333">占空比 D = 高电平时间 ÷ 开关周期　｜　等效电压 U₀ = 电源电压 × D</text>
  <text x="50" y="92" font-size="11.5" fill="#777">开关管只有通、断两个状态，靠时间比例“凑”出中间电压</text>

  <rect x="34" y="124" width="592" height="90" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.8"/>
  <text x="50" y="144" font-size="12.5" fill="#2F5FD0" font-weight="bold">周期恒为 4 格，只改高电平格数</text>
  <text x="50" y="168" font-size="12.3" fill="#333">D = 25%</text>
  <rect x="200" y="157" width="24" height="13" fill="#2F5FD0"/>
  <rect x="230" y="157" width="24" height="13" fill="#dbe6f7"/>
  <rect x="260" y="157" width="24" height="13" fill="#dbe6f7"/>
  <rect x="290" y="157" width="24" height="13" fill="#dbe6f7"/>
  <rect x="320" y="157" width="24" height="13" fill="#2F5FD0"/>
  <rect x="350" y="157" width="24" height="13" fill="#dbe6f7"/>
  <rect x="380" y="157" width="24" height="13" fill="#dbe6f7"/>
  <rect x="410" y="157" width="24" height="13" fill="#dbe6f7"/>
  <rect x="440" y="157" width="24" height="13" fill="#2F5FD0"/>
  <rect x="470" y="157" width="24" height="13" fill="#dbe6f7"/>
  <rect x="500" y="157" width="24" height="13" fill="#dbe6f7"/>
  <rect x="530" y="157" width="24" height="13" fill="#dbe6f7"/>
  <text x="618" y="168" font-size="12" fill="#2F5FD0" text-anchor="end">等效电压低</text>
  <text x="50" y="186" font-size="12.3" fill="#333">D = 50%</text>
  <rect x="200" y="175" width="24" height="13" fill="#2F5FD0"/>
  <rect x="230" y="175" width="24" height="13" fill="#2F5FD0"/>
  <rect x="260" y="175" width="24" height="13" fill="#dbe6f7"/>
  <rect x="290" y="175" width="24" height="13" fill="#dbe6f7"/>
  <rect x="320" y="175" width="24" height="13" fill="#2F5FD0"/>
  <rect x="350" y="175" width="24" height="13" fill="#2F5FD0"/>
  <rect x="380" y="175" width="24" height="13" fill="#dbe6f7"/>
  <rect x="410" y="175" width="24" height="13" fill="#dbe6f7"/>
  <rect x="440" y="175" width="24" height="13" fill="#2F5FD0"/>
  <rect x="470" y="175" width="24" height="13" fill="#2F5FD0"/>
  <rect x="500" y="175" width="24" height="13" fill="#dbe6f7"/>
  <rect x="530" y="175" width="24" height="13" fill="#dbe6f7"/>
  <text x="618" y="186" font-size="12" fill="#2F5FD0" text-anchor="end">等效电压中</text>
  <text x="50" y="204" font-size="12.3" fill="#333">D = 75%</text>
  <rect x="200" y="193" width="24" height="13" fill="#2F5FD0"/>
  <rect x="230" y="193" width="24" height="13" fill="#2F5FD0"/>
  <rect x="260" y="193" width="24" height="13" fill="#2F5FD0"/>
  <rect x="290" y="193" width="24" height="13" fill="#dbe6f7"/>
  <rect x="320" y="193" width="24" height="13" fill="#2F5FD0"/>
  <rect x="350" y="193" width="24" height="13" fill="#2F5FD0"/>
  <rect x="380" y="193" width="24" height="13" fill="#2F5FD0"/>
  <rect x="410" y="193" width="24" height="13" fill="#dbe6f7"/>
  <rect x="440" y="193" width="24" height="13" fill="#2F5FD0"/>
  <rect x="470" y="193" width="24" height="13" fill="#2F5FD0"/>
  <rect x="500" y="193" width="24" height="13" fill="#2F5FD0"/>
  <rect x="530" y="193" width="24" height="13" fill="#dbe6f7"/>
  <text x="618" y="204" font-size="12" fill="#2F5FD0" text-anchor="end">等效电压高</text>

  <rect x="34" y="220" width="286" height="132" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="177" y="244" font-size="13" fill="#2a7a2a" font-weight="bold" text-anchor="middle">改变的是哪一个</text>
  <text x="50" y="268" font-size="12.3" fill="#333">✓ 改变：高电平持续时间（脉宽）</text>
  <text x="50" y="290" font-size="12.3" fill="#333">✓ 不变：开关周期（载波频率）</text>
  <text x="50" y="312" font-size="12.3" fill="#333">结果：等效（平均）电压连续可调</text>
  <text x="50" y="334" font-size="11.5" fill="#777">周期固定是调制的前提</text>

  <rect x="334" y="220" width="292" height="132" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="480" y="244" font-size="13" fill="#c33" font-weight="bold" text-anchor="middle">常见错法</text>
  <text x="350" y="268" font-size="12.3" fill="#333">把“调频”当 PWM：改的是周期</text>
  <text x="350" y="290" font-size="12.3" fill="#333">把占空比写成低电平占比</text>
  <text x="350" y="312" font-size="12.3" fill="#333">认为开关管输出中间电平</text>
  <text x="350" y="334" font-size="11.5" fill="#777">开关管只有通断，平均值靠负载惯性</text>
  <rect x="30" y="364" width="600" height="46" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="386" font-size="12.3" fill="#7a5c00">记忆：周期不变、调脉宽；占空比越大等效电压越高。等效电压 = 电源电压 × 占空比。</text>
</svg>