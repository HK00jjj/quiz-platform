<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">端子松动 → 接触电阻增大 → 合闸闪弧</text>
  <!-- 正常端子 -->
  <rect x="40" y="70" width="270" height="150" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="175" y="96" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c5c1c">正常压接端子</text>
  <rect x="70" y="130" width="70" height="34" rx="4" fill="#c0c0c0" stroke="#333" stroke-width="1.5"/>
  <rect x="180" y="130" width="70" height="34" rx="4" fill="#c0c0c0" stroke="#333" stroke-width="1.5"/>
  <circle cx="160" cy="147" r="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="160" y="176" font-size="11" text-anchor="middle" fill="#1c5c1c">螺栓压紧 · 接触面贴合</text>
  <text x="175" y="200" font-size="11.5" text-anchor="middle" fill="#1c5c1c">接触电阻小 · 满载温升正常</text>
  <!-- 松动端子 -->
  <rect x="350" y="70" width="270" height="150" rx="10" fill="#fdf0f0" stroke="#c33" stroke-width="2"/>
  <text x="485" y="96" font-size="13" text-anchor="middle" font-weight="bold" fill="#922">松动的端子</text>
  <rect x="380" y="126" width="70" height="34" rx="4" fill="#c0c0c0" stroke="#333" stroke-width="1.5"/>
  <rect x="490" y="134" width="70" height="34" rx="4" fill="#c0c0c0" stroke="#333" stroke-width="1.5" transform="rotate(-3 525 151)"/>
  <circle cx="470" cy="143" r="8" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="3 2"/>
  <path d="M 452 143 L 462 143" stroke="#c33" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="485" y="182" font-size="11.5" text-anchor="middle" fill="#922">间隙产生附加接触电阻（气隙微弧放电）</text>
  <text x="485" y="204" font-size="11.5" text-anchor="middle" fill="#922">长期近满载 → 持续过热 → 氧化加剧恶性循环</text>
  <!-- 闪弧示意 -->
  <path d="M 480 208 L 472 220 L 480 222 L 470 236" fill="none" stroke="#e8a020" stroke-width="3" stroke-linecap="round"/>
  <path d="M 492 206 L 486 218 L 494 221 L 486 234" fill="none" stroke="#e8a020" stroke-width="2" stroke-linecap="round"/>
  <text x="640" y="228" font-size="12" text-anchor="end" fill="#b8860b">合闸涌流冲击 → 气隙击穿闪弧爆响</text>
  <text x="20" y="262" font-size="12.5" fill="#333">机理链：松动 → 有效接触面减小 → 接触电阻↑ → I²R 发热加剧 → 接触面氧化碳化 →</text>
  <text x="20" y="282" font-size="12.5" fill="#333">合闸瞬间大电流冲击点燃电弧。预防靠运行巡检（红外测温）+ 停电紧固与压接工艺。</text>
  <text x="20" y="318" font-size="12" fill="#888">要点：闪弧爆响多与「虚接」有关而非设备本身损坏；先查端子压接与紧固痕迹，再查回路元件。</text>
</svg>
