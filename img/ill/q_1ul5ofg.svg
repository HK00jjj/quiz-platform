<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="28" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">图1-13 串联电路求 B 点电压（对地电压）</text>

  <!-- 外框回路 -->
  <line x1="80" y1="330" x2="580" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="330" x2="80" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="580" y1="330" x2="580" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="120" x2="180" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="470" y1="120" x2="580" y2="120" stroke="#333" stroke-width="2"/>

  <!-- 电源 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="180" y1="96" x2="180" y2="144"/>
    <line x1="200" y1="104" x2="200" y2="136"/>
  </g>
  <line x1="180" y1="120" x2="200" y2="120" stroke="#333" stroke-width="2"/>
  <text x="190" y="82" font-size="14" text-anchor="middle" fill="#1a1a1a">E=12V</text>
  <text x="172" y="86" font-size="13" fill="#c01c28">+</text>
  <text x="206" y="86" font-size="13" fill="#1a5fb4">−</text>

  <!-- 电阻 R1 (A->B) -->
  <rect x="240" y="110" width="70" height="20" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="120" x2="240" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="120" x2="380" y2="120" stroke="#333" stroke-width="2"/>
  <text x="275" y="102" font-size="14" text-anchor="middle" fill="#1a1a1a">R1=2Ω</text>

  <!-- 电阻 R2 (B->C) -->
  <rect x="380" y="110" width="90" height="20" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="425" y="102" font-size="14" text-anchor="middle" fill="#1a1a1a">R2=7Ω</text>
  <line x1="470" y1="120" x2="510" y2="120" stroke="#333" stroke-width="2"/>

  <!-- R3 竖段 右侧 (C->D) -->
  <rect x="570" y="180" width="20" height="80" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <line x1="580" y1="120" x2="580" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="580" y1="260" x2="580" y2="330" stroke="#333" stroke-width="2"/>
  <text x="610" y="212" font-size="14" fill="#1a1a1a">R3=3Ω</text>

  <!-- 节点 A / B / C / D -->
  <circle cx="200" cy="120" r="4" fill="#1a1a1a"/><text x="196" y="106" font-size="14" fill="#1a1a1a">A</text>
  <circle cx="340" cy="120" r="4" fill="#c01c28"/><text x="332" y="106" font-size="15" fill="#c01c28" font-weight="bold">B</text>
  <circle cx="510" cy="120" r="4" fill="#1a1a1a"/><text x="506" y="106" font-size="14" fill="#1a1a1a">C</text>
  <circle cx="580" cy="330" r="4" fill="#1a1a1a"/><text x="592" y="340" font-size="14" fill="#1a1a1a">D</text>

  <!-- 电流方向箭头 -->
  <path d="M 355 155 l 14 0 m -6 -5 l 6 5 l -6 5" stroke="#1a5fb4" stroke-width="2" fill="none"/>
  <text x="378" y="160" font-size="14" fill="#1a5fb4">I=1A</text>

  <!-- 接地符号在 D 点（与答案 C=10V 一致：UB=UR2+UR3） -->
  <g stroke="#1a1a1a" stroke-width="2.2">
    <line x1="560" y1="336" x2="600" y2="336"/>
    <line x1="568" y1="346" x2="592" y2="346"/>
    <line x1="576" y1="356" x2="584" y2="356"/>
  </g>
  <text x="612" y="360" font-size="14" fill="#c01c28" font-weight="bold">接地 0V</text>

  <text x="330" y="382" font-size="14" fill="#666" text-anchor="middle">串联：A→R1→B→R2→C→R3→D，D 点接地；UB = B 点对地电压</text>
</svg>
