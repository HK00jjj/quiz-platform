<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="17.5" fill="#222" font-weight="bold">禁止强行送电：票未终结、人未撤离、接地未拆</text>
  <rect x="34" y="48" width="292" height="196" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="180" y="72" font-size="13" fill="#c33" font-weight="bold" text-anchor="middle">禁止合闸（ABC）</text>
  <text x="50" y="96" font-size="12.3" fill="#333">A 检修工作票尚未终结</text>
  <text x="50" y="114" font-size="12.3" fill="#333">　 工作人员尚未撤离现场</text>
  <text x="50" y="138" font-size="12.3" fill="#333">B 接地线等安全措施未全部拆除</text>
  <text x="50" y="162" font-size="12.3" fill="#333">C 断路器跳闸后未查明原因</text>
  <text x="50" y="180" font-size="12.3" fill="#333">　 且未消除故障</text>
  <text x="50" y="206" font-size="12" fill="#c33">接地线是防误送电的最后屏障</text>
  <text x="50" y="228" font-size="11.5" fill="#777">三者齐备才允许恢复带电</text>

  <rect x="340" y="48" width="286" height="196" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="483" y="72" font-size="13" fill="#2a7a2a" font-weight="bold" text-anchor="middle">允许送电（DE 不选）</text>
  <text x="356" y="96" font-size="12.3" fill="#333">D 送电前绝缘试验合格</text>
  <text x="356" y="114" font-size="12.3" fill="#333">　 → 这是送电的前置条件，非禁止项</text>
  <text x="356" y="140" font-size="12.3" fill="#333">E 已按规定得到值班负责人许可</text>
  <text x="356" y="158" font-size="12.3" fill="#333">　 → 有许可命令是合规前提</text>
  <text x="356" y="184" font-size="12" fill="#2a7a2a">记忆：禁止项围绕「人机措施未了」</text>
  <text x="356" y="206" font-size="11.5" fill="#777">D/E 是「应当做到」，不是「禁止」</text>
  <text x="356" y="228" font-size="11.5" fill="#777">题干问禁止，别把条件项选进去</text>

  <rect x="34" y="258" width="592" height="60" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.8"/>
  <text x="50" y="280" font-size="12.3" fill="#7a5c00">倒闸操作三查：工作票已终结、人员已撤离、接地线已拆除并登记</text>
  <text x="50" y="300" font-size="11.5" fill="#777">接地线装设与拆除均须按规程办理并记录，缺记录视为未拆除</text>
  <rect x="30" y="328" width="600" height="58" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="350" font-size="12.3" fill="#7a5c00">记忆：票、人、地线三件事了结才送电；绝缘合格与许可命令是必备条件而非禁止情形。</text>
  <text x="46" y="371" font-size="12.3" fill="#7a5c00">误诊提醒：把「送电前置条件」误当「禁止送电情形」是多选丢分点。</text>
</svg>