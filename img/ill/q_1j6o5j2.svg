<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">伺服驱动器 STO 安全转矩取消（双通道）</text>
  <!-- 安全回路 -->
  <rect x="40" y="90" width="170" height="110" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2.5"/>
  <text x="125" y="118" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c5c1c">安全回路</text>
  <text x="125" y="142" font-size="12" text-anchor="middle" fill="#1c5c1c">急停按钮 / 安全门锁</text>
  <text x="125" y="162" font-size="12" text-anchor="middle" fill="#1c5c1c">安全继电器输出</text>
  <text x="125" y="186" font-size="11" text-anchor="middle" fill="#555">双通道（冗余）触点</text>
  <!-- 双通道线 -->
  <line x1="210" y1="130" x2="360" y2="120" stroke="#c33" stroke-width="3"/>
  <line x1="210" y1="160" x2="360" y2="150" stroke="#c33" stroke-width="3"/>
  <text x="280" y="112" font-size="12" fill="#c33">通道 1</text>
  <text x="280" y="176" font-size="12" fill="#c33">通道 2</text>
  <!-- 驱动器 -->
  <rect x="360" y="80" width="190" height="150" rx="10" fill="#eef2fb" stroke="#36c" stroke-width="2.5"/>
  <text x="455" y="106" font-size="14" text-anchor="middle" font-weight="bold" fill="#234">伺服驱动器</text>
  <text x="376" y="132" font-size="12">STO+ / STO-（通道1）</text>
  <text x="376" y="152" font-size="12">STO2+ / STO2-（通道2）</text>
  <text x="376" y="176" font-size="12">CN1 / 编码器 / U V W</text>
  <text x="376" y="204" font-size="11" fill="#555">两通道同时断开 → 立即</text>
  <text x="376" y="220" font-size="11" fill="#555">封锁功率级输出</text>
  <!-- 作用框 -->
  <rect x="40" y="228" width="590" height="82" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="252" font-size="12.5" font-weight="bold" fill="#7a5c00">STO 作用：</text>
  <text x="56" y="272" font-size="12" fill="#7a5c00">切断的是「转矩输出」（功率级封锁），不是断电——驱动器控制部分仍带电；</text>
  <text x="56" y="292" font-size="12" fill="#7a5c00">电机失转矩自由滑停（非受控制动），垂直轴须另配机械抱闸防坠落。</text>
  <text x="20" y="338" font-size="12" fill="#888">要点：STO 属功能安全（通常 SIL3/PL e）；急停接入 STO 时驱动器不报警停机，恢复须复位后才能再使能。</text>
</svg>
