<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">同一 S/S 公共端混接 NPN 与 PNP 传感器的回路冲突</text>
  <!-- 左：NPN 传感器支路 -->
  <rect x="50" y="70" width="130" height="60" rx="8" fill="#eef2fb" stroke="#36c" stroke-width="2"/>
  <text x="115" y="95" font-size="13" text-anchor="middle">NPN 传感器</text>
  <text x="115" y="115" font-size="11" text-anchor="middle" fill="#555">导通时输出拉到 0V</text>
  <line x1="115" y1="130" x2="115" y2="200" stroke="#222" stroke-width="3"/>
  <circle cx="115" cy="208" r="7" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="129" y="213" font-size="12">X0</text>
  <!-- 中：PLC 输入组 -->
  <rect x="90" y="200" width="220" height="90" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2.5"/>
  <text x="200" y="226" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c5c1c">PLC 输入组（同一公共端）</text>
  <circle cx="115" cy="252" r="6" fill="#fff" stroke="#333"/><text x="129" y="257" font-size="11">X0</text>
  <circle cx="255" cy="252" r="6" fill="#fff" stroke="#333"/><text x="269" y="257" font-size="11">X1</text>
  <circle cx="185" cy="276" r="6" fill="#fff" stroke="#333"/>
  <text x="200" y="281" font-size="12" font-weight="bold" fill="#c33">S/S 公共端</text>
  <!-- 右：PNP 传感器支路 -->
  <rect x="420" y="70" width="130" height="60" rx="8" fill="#fdf0f0" stroke="#c33" stroke-width="2"/>
  <text x="485" y="95" font-size="13" text-anchor="middle">PNP 传感器</text>
  <text x="485" y="115" font-size="11" text-anchor="middle" fill="#555">导通时输出 +24V</text>
  <line x1="485" y1="130" x2="485" y2="180" stroke="#222" stroke-width="3"/>
  <line x1="485" y1="180" x2="255" y2="180" stroke="#222" stroke-width="3"/>
  <line x1="255" y1="180" x2="255" y2="200" stroke="#222" stroke-width="3"/>
  <circle cx="255" cy="208" r="7" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="240" y="213" font-size="12" text-anchor="end">X1</text>
  <!-- 冲突标注 -->
  <rect x="370" y="200" width="250" height="96" rx="8" fill="#fdf0f0" stroke="#c33" stroke-width="1.5"/>
  <text x="382" y="224" font-size="12" font-weight="bold" fill="#922">冲突所在：</text>
  <text x="382" y="244" font-size="11.5" fill="#922">S/S 只能接一个极性。接 L+ → NPN 能通；</text>
  <text x="382" y="262" font-size="11.5" fill="#922">接 0V → PNP 能通；二者不可同时成立，</text>
  <text x="382" y="280" font-size="11.5" fill="#922">混接必有一类传感器永远无法导通回路。</text>
  <text x="20" y="322" font-size="12" fill="#888">要点：同一公共端组内传感器输出极性必须一致；混用时须分组配独立 S/S 或加继电器转换极性。</text>
</svg>
