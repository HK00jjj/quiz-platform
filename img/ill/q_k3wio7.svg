<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">梯形图与电气控制图一一对应（并非凭空设计）</text>
  <!-- 左：继电器原理图 -->
  <text x="165" y="60" font-size="14" text-anchor="middle" fill="#2F5FD0" font-weight="bold">继电器-接触器控制原理图</text>
  <rect x="30" y="72" width="270" height="210" rx="8" fill="#f4f7ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <line x1="60" y1="96" x2="60" y2="262" stroke="#c33" stroke-width="2.4"/>
  <text x="52" y="92" font-size="10.5" fill="#c33" font-weight="bold">L</text>
  <line x1="270" y1="96" x2="270" y2="262" stroke="#2F5FD0" stroke-width="2.4"/>
  <text x="276" y="92" font-size="10.5" fill="#2F5FD0" font-weight="bold">N</text>
  <line x1="60" y1="130" x2="90" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="122" x2="90" y2="138" stroke="#333" stroke-width="2.2"/>
  <line x1="104" y1="122" x2="104" y2="138" stroke="#333" stroke-width="2.2"/>
  <line x1="104" y1="130" x2="140" y2="130" stroke="#333" stroke-width="2"/>
  <text x="97" y="116" font-size="10.5" text-anchor="middle" fill="#555">FR 常闭</text>
  <line x1="140" y1="130" x2="170" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="170" y1="122" x2="170" y2="138" stroke="#333" stroke-width="2.2"/>
  <line x1="184" y1="122" x2="184" y2="138" stroke="#333" stroke-width="2.2"/>
  <line x1="184" y1="130" x2="222" y2="130" stroke="#333" stroke-width="2"/>
  <text x="177" y="116" font-size="10.5" text-anchor="middle" fill="#555">SB1 起动</text>
  <rect x="222" y="114" width="42" height="32" rx="5" fill="#fff8ec" stroke="#b8860b" stroke-width="1.8"/>
  <text x="243" y="135" font-size="12" text-anchor="middle" fill="#7a5c00" font-weight="bold">KM</text>
  <line x1="264" y1="130" x2="270" y2="130" stroke="#333" stroke-width="2"/>
  <!-- 自锁支路 -->
  <line x1="170" y1="130" x2="170" y2="106" stroke="#c33" stroke-width="1.8"/>
  <line x1="170" y1="106" x2="206" y2="106" stroke="#c33" stroke-width="1.8"/>
  <line x1="206" y1="98" x2="206" y2="114" stroke="#c33" stroke-width="2"/>
  <line x1="220" y1="98" x2="220" y2="114" stroke="#c33" stroke-width="2"/>
  <line x1="220" y1="106" x2="222" y2="106" stroke="#c33" stroke-width="1.8"/>
  <text x="196" y="92" font-size="10.5" text-anchor="middle" fill="#c33">KM 常开自锁</text>
  <text x="165" y="270" font-size="11.5" text-anchor="middle" fill="#555">按钮/触点 → 线圈，靠导线接通</text>
  <!-- 右：梯形图 -->
  <text x="495" y="60" font-size="14" text-anchor="middle" fill="#2a7a2a" font-weight="bold">PLC 梯形图</text>
  <rect x="360" y="72" width="270" height="210" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.5"/>
  <line x1="385" y1="150" x2="605" y2="150" stroke="#333" stroke-width="2.4"/>
  <!-- X0 与 Y0 并联（对应 SB1 与自锁） -->
  <line x1="385" y1="150" x2="420" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="420" y1="142" x2="420" y2="158" stroke="#333" stroke-width="2.2"/>
  <line x1="434" y1="142" x2="434" y2="158" stroke="#333" stroke-width="2.2"/>
  <line x1="434" y1="150" x2="470" y2="150" stroke="#333" stroke-width="2"/>
  <rect x="452" y="120" width="1" height="1" fill="#fff"/>
  <line x1="420" y1="150" x2="420" y2="126" stroke="#2a7a2a" stroke-width="1.8"/>
  <line x1="420" y1="126" x2="452" y2="126" stroke="#2a7a2a" stroke-width="1.8"/>
  <line x1="452" y1="118" x2="452" y2="134" stroke="#2a7a2a" stroke-width="2"/>
  <line x1="466" y1="118" x2="466" y2="134" stroke="#2a7a2a" stroke-width="2"/>
  <line x1="466" y1="126" x2="470" y2="126" stroke="#2a7a2a" stroke-width="1.8"/>
  <line x1="470" y1="126" x2="470" y2="150" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="427" y="112" font-size="10.5" text-anchor="middle" fill="#555">X0 起动</text>
  <text x="445" y="168" font-size="10.5" text-anchor="middle" fill="#2a7a2a">Y0 自锁（对应 KM 辅助触点）</text>
  <!-- X1 常闭 -->
  <line x1="470" y1="150" x2="520" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="520" y1="142" x2="520" y2="158" stroke="#333" stroke-width="2.2"/>
  <line x1="534" y1="142" x2="534" y2="158" stroke="#333" stroke-width="2.2"/>
  <line x1="520" y1="139" x2="534" y2="161" stroke="#333" stroke-width="1.6"/>
  <line x1="534" y1="150" x2="556" y2="150" stroke="#333" stroke-width="2"/>
  <text x="527" y="134" font-size="10.5" text-anchor="middle" fill="#555">X1 常闭（FR）</text>
  <ellipse cx="580" cy="150" rx="24" ry="14" fill="#fff" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="580" y="154" font-size="11.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">Y0</text>
  <text x="495" y="196" font-size="11.5" text-anchor="middle" fill="#555">软件「触点—线圈」逻辑连通</text>
  <!-- 对应箭头 -->
  <text x="330" y="112" font-size="16" text-anchor="middle" fill="#b8860b" font-weight="bold">⇄</text>
  <text x="330" y="150" font-size="16" text-anchor="middle" fill="#b8860b" font-weight="bold">⇄</text>
  <text x="330" y="188" font-size="16" text-anchor="middle" fill="#b8860b" font-weight="bold">⇄</text>
  <!-- 对应关系说明 -->
  <rect x="30" y="298" width="600" height="108" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="318" font-size="12.5" fill="#7a5c00">对应关系：SB1 起动按钮 → 输入继电器 X0；FR 热继电器触点 → 输入 X1；</text>
  <text x="46" y="338" font-size="12.5" fill="#7a5c00">KM 线圈 → 输出继电器 Y0；KM 常开辅助触点（自锁）→ Y0 的常开触点。</text>
  <text x="46" y="360" font-size="12.5" fill="#2a7a2a" font-weight="bold">梯形图由电气控制图演变而来，触点/线圈与继电器电路一一对应——</text>
  <text x="46" y="380" font-size="12.5" fill="#c33" font-weight="bold">「凭空设计、与传统电气控制图毫无对应关系」的说法是错误的。</text>
</svg>
