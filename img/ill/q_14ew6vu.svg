<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">PLC 正反转：不可直接互换输出，必须先停再反向</text>
  <!-- ✗ 错误：直接互换 -->
  <text x="20" y="60" font-size="14" fill="#c33" font-weight="bold">✗ 错误：正转运行中直接把 Y0/Y1 互换（不先停）</text>
  <rect x="30" y="72" width="600" height="130" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <!-- 梯形图：X0 直接驱动 Y1，X1 直接驱动 Y0（无停止、无互锁） -->
  <line x1="60" y1="106" x2="600" y2="106" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="106" x2="110" y2="106" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="98" x2="110" y2="114" stroke="#c33" stroke-width="2.2"/>
  <line x1="124" y1="98" x2="124" y2="114" stroke="#c33" stroke-width="2.2"/>
  <line x1="124" y1="106" x2="200" y2="106" stroke="#333" stroke-width="2"/>
  <rect x="200" y="92" width="56" height="28" rx="4" fill="#fff" stroke="#c33" stroke-width="1.6"/>
  <text x="228" y="111" font-size="11.5" text-anchor="middle" fill="#c33">Y0 正转</text>
  <line x1="60" y1="166" x2="600" y2="166" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="166" x2="110" y2="166" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="158" x2="110" y2="174" stroke="#c33" stroke-width="2.2"/>
  <line x1="124" y1="158" x2="124" y2="174" stroke="#c33" stroke-width="2.2"/>
  <line x1="124" y1="166" x2="200" y2="166" stroke="#333" stroke-width="2"/>
  <rect x="200" y="152" width="56" height="28" rx="4" fill="#fff" stroke="#c33" stroke-width="1.6"/>
  <text x="228" y="171" font-size="11.5" text-anchor="middle" fill="#c33">Y1 反转</text>
  <text x="290" y="112" font-size="11.5" fill="#c33">← 正转运行中直接置位 Y1（Y0 未断）</text>
  <text x="290" y="172" font-size="11.5" fill="#c33">← 两个输出同时为 ON</text>
  <rect x="380" y="182" width="238" height="14" rx="3" fill="#c33"/>
  <text x="499" y="193" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="bold">两接触器同时吸合 = 主电路相间短路 ⚡</text>
  <!-- ✓ 正确 -->
  <text x="20" y="232" font-size="14" fill="#2a7a2a" font-weight="bold">✓ 正确：先按停止（或自动加入「先断后通」延时），并串入互锁触点</text>
  <rect x="30" y="244" width="600" height="120" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <!-- 正转梯级：串 Y1 常闭互锁 -->
  <line x1="60" y1="278" x2="600" y2="278" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="278" x2="96" y2="278" stroke="#333" stroke-width="2"/>
  <line x1="96" y1="270" x2="96" y2="286" stroke="#333" stroke-width="2.2"/>
  <line x1="110" y1="270" x2="110" y2="286" stroke="#333" stroke-width="2.2"/>
  <line x1="96" y1="267" x2="110" y2="289" stroke="#333" stroke-width="1.6"/>
  <line x1="110" y1="278" x2="150" y2="278" stroke="#333" stroke-width="2"/>
  <text x="103" y="262" font-size="10" text-anchor="middle" fill="#555">Y1 常闭互锁</text>
  <line x1="150" y1="278" x2="186" y2="278" stroke="#333" stroke-width="2"/>
  <line x1="186" y1="270" x2="186" y2="286" stroke="#333" stroke-width="2.2"/>
  <line x1="200" y1="270" x2="200" y2="286" stroke="#333" stroke-width="2.2"/>
  <line x1="200" y1="278" x2="250" y2="278" stroke="#333" stroke-width="2"/>
  <text x="193" y="262" font-size="10" text-anchor="middle" fill="#555">X0 正转起动</text>
  <rect x="250" y="264" width="56" height="28" rx="4" fill="#fff" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="278" y="283" font-size="11.5" text-anchor="middle" fill="#2a7a2a">Y0</text>
  <text x="330" y="283" font-size="11.5" fill="#2a7a2a">（Y1 未动作时才允许正转）</text>
  <!-- 反转梯级 -->
  <line x1="60" y1="336" x2="600" y2="336" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="336" x2="96" y2="336" stroke="#333" stroke-width="2"/>
  <line x1="96" y1="328" x2="96" y2="344" stroke="#333" stroke-width="2.2"/>
  <line x1="110" y1="328" x2="110" y2="344" stroke="#333" stroke-width="2.2"/>
  <line x1="96" y1="325" x2="110" y2="347" stroke="#333" stroke-width="1.6"/>
  <line x1="110" y1="336" x2="150" y2="336" stroke="#333" stroke-width="2"/>
  <text x="103" y="320" font-size="10" text-anchor="middle" fill="#555">Y0 常闭互锁</text>
  <line x1="150" y1="336" x2="186" y2="336" stroke="#333" stroke-width="2"/>
  <line x1="186" y1="328" x2="186" y2="344" stroke="#333" stroke-width="2.2"/>
  <line x1="200" y1="328" x2="200" y2="344" stroke="#333" stroke-width="2.2"/>
  <line x1="200" y1="336" x2="250" y2="336" stroke="#333" stroke-width="2"/>
  <text x="193" y="320" font-size="10" text-anchor="middle" fill="#555">X1 反转起动</text>
  <rect x="250" y="322" width="56" height="28" rx="4" fill="#fff" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="278" y="341" font-size="11.5" text-anchor="middle" fill="#2a7a2a">Y1</text>
  <text x="330" y="341" font-size="11.5" fill="#2a7a2a">（Y0 释放后才允许反转，配合先停）</text>
  <!-- 要点 -->
  <rect x="30" y="374" width="600" height="40" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="399" font-size="12.5" fill="#7a5c00">要点：正反转切换必须「先停后反」——直接互换输出继电器等于让两只接触器同时吸合，必然相间短路。</text>
</svg>
