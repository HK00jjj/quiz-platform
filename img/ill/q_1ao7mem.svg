<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="430" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">接线图 vs 原理图：同一元件 KM 的两种画法</text>
  <!-- 左：接线图 -->
  <text x="165" y="62" font-size="14" text-anchor="middle" fill="#2a7a2a" font-weight="bold">接线图（敷线图）</text>
  <rect x="40" y="76" width="250" height="220" rx="8" fill="#fbf9f2" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="165" y="98" font-size="12" text-anchor="middle" fill="#7a5c00">接触器 KM —— 各部件画在一起</text>
  <!-- 主触头（上，实际位置） -->
  <line x1="70" y1="122" x2="96" y2="122" stroke="#333" stroke-width="2"/>
  <line x1="96" y1="114" x2="96" y2="130" stroke="#333" stroke-width="2.4"/>
  <line x1="108" y1="114" x2="108" y2="130" stroke="#333" stroke-width="2.4"/>
  <line x1="108" y1="122" x2="134" y2="122" stroke="#333" stroke-width="2"/>
  <text x="102" y="108" font-size="10" text-anchor="middle" fill="#555">主触头</text>
  <!-- 线圈（中，实际位置） -->
  <rect x="96" y="176" width="44" height="30" rx="5" fill="#fff8ec" stroke="#b8860b" stroke-width="2"/>
  <text x="118" y="196" font-size="12" text-anchor="middle" fill="#7a5c00" font-weight="bold">KM</text>
  <text x="118" y="168" font-size="10" text-anchor="middle" fill="#555">线圈</text>
  <!-- 辅助触头（下，实际位置） -->
  <line x1="82" y1="248" x2="104" y2="248" stroke="#333" stroke-width="2"/>
  <line x1="104" y1="240" x2="104" y2="256" stroke="#333" stroke-width="2.2"/>
  <line x1="116" y1="240" x2="116" y2="256" stroke="#333" stroke-width="2.2"/>
  <line x1="116" y1="248" x2="138" y2="248" stroke="#333" stroke-width="2"/>
  <text x="110" y="234" font-size="10" text-anchor="middle" fill="#555">辅助触头</text>
  <!-- 端子点 -->
  <circle cx="70" cy="122" r="2.6" fill="#2F5FD0"/><circle cx="134" cy="122" r="2.6" fill="#2F5FD0"/>
  <circle cx="96" cy="191" r="2.6" fill="#2F5FD0"/><circle cx="140" cy="191" r="2.6" fill="#2F5FD0"/>
  <circle cx="82" cy="248" r="2.6" fill="#2F5FD0"/><circle cx="138" cy="248" r="2.6" fill="#2F5FD0"/>
  <text x="165" y="322" font-size="12" text-anchor="middle" fill="#555">按元件实际布置绘制，接线端逐点可查</text>
  <text x="165" y="340" font-size="12" text-anchor="middle" fill="#2a7a2a" font-weight="bold">便于实际安装与检修 ✓</text>
  <!-- 右：原理图 -->
  <text x="495" y="62" font-size="14" text-anchor="middle" fill="#2F5FD0" font-weight="bold">原理图（展开图）</text>
  <!-- 主电路区 -->
  <text x="440" y="90" font-size="11" fill="#888">主电路</text>
  <line x1="420" y1="118" x2="420" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="414" y1="120" x2="414" y2="134" stroke="#333" stroke-width="2.2"/>
  <line x1="426" y1="120" x2="426" y2="134" stroke="#333" stroke-width="2.2"/>
  <line x1="426" y1="127" x2="452" y2="127" stroke="#333" stroke-width="2"/>
  <circle cx="470" cy="127" r="13" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="470" y="131" font-size="10.5" text-anchor="middle" fill="#333">M</text>
  <text x="420" y="112" font-size="9.5" text-anchor="middle" fill="#555">KM 主触头</text>
  <!-- 控制电路区 -->
  <text x="530" y="90" font-size="11" fill="#888">控制电路（另一条竖列）</text>
  <line x1="530" y1="120" x2="530" y2="180" stroke="#333" stroke-width="2"/>
  <rect x="518" y="130" width="24" height="22" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="530" y="146" font-size="10" text-anchor="middle" fill="#7a5c00">KM</text>
  <text x="530" y="114" font-size="9.5" text-anchor="middle" fill="#555">线圈</text>
  <!-- 虚线对应关系 -->
  <line x1="118" y1="191" x2="518" y2="141" stroke="#b8860b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="108" y1="122" x2="414" y2="127" stroke="#b8860b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="110" y1="248" x2="490" y2="158" stroke="#b8860b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="495" y="212" font-size="12" text-anchor="middle" fill="#555">按电流通路展开：同一元件的三部分</text>
  <text x="495" y="230" font-size="12" text-anchor="middle" fill="#555">分散画在相关回路中（虚线示同一元件）</text>
  <text x="495" y="250" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">便于阅读分析、查故障逻辑</text>
  <!-- 要点 -->
  <rect x="40" y="356" width="580" height="52" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="377" font-size="12.5" fill="#7a5c00">接线图＝按实际位置·元件聚拢·服务于安装检修；原理图＝按电流展开·服务于分析。</text>
  <text x="56" y="397" font-size="12.5" fill="#7a5c00">记忆点：接线图「物以类聚」，原理图「电流分家」——两种图各司其职。</text>
</svg>
