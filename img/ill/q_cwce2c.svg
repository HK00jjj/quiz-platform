<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">移相控制：改变触发时刻 α → 改变导通 → 改变输出电压</text>
  <!-- 坐标轴 -->
  <line x1="90" y1="210" x2="630" y2="210" stroke="#888" stroke-width="1.5"/>
  <path d="M630,210 L620,205 L620,215 Z" fill="#888"/>
  <line x1="90" y1="210" x2="90" y2="75" stroke="#888" stroke-width="1.5"/>
  <path d="M90,75 L85,85 L95,85 Z" fill="#888"/>
  <text x="612" y="232" font-size="12" fill="#888">ωt</text>
  <text x="70" y="86" font-size="12" fill="#888">u</text>
  <text x="80" y="228" font-size="11" fill="#888">0</text>
  <!-- u2 正半周（虚线），负半周 VT 关断 -->
  <path d="M90,210 Q155,40 220,210" stroke="#bbb" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>
  <path d="M350,210 Q415,40 480,210" stroke="#bbb" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>
  <line x1="220" y1="210" x2="350" y2="210" stroke="#bbb" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="480" y1="210" x2="610" y2="210" stroke="#bbb" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="140" y="120" font-size="11" fill="#999">u₂ 正半周（虚线）</text>
  <text x="238" y="200" font-size="10.5" fill="#999">负半周：VT 承受反向电压关断，u₀=0</text>
  <!-- 导通区（红，从 α 开始） -->
  <path d="M129,139 Q155,40 220,210 L220,210 L129,139 Z" fill="#c33" opacity="0.10"/>
  <path d="M129,139 Q155,40 220,210" stroke="#c33" stroke-width="2.4" fill="none"/>
  <line x1="220" y1="210" x2="350" y2="210" stroke="#c33" stroke-width="2.4"/>
  <path d="M389,139 Q415,40 480,210" stroke="#c33" stroke-width="2.4" fill="none"/>
  <line x1="480" y1="210" x2="610" y2="210" stroke="#c33" stroke-width="2.4"/>
  <text x="160" y="80" font-size="11" fill="#c33">u₀（实线）：α 之后导通</text>
  <!-- 触发脉冲 -->
  <line x1="130" y1="210" x2="130" y2="150" stroke="#c33" stroke-width="2.5"/>
  <path d="M125,155 L130,146 L135,155 Z" fill="#c33"/>
  <line x1="390" y1="210" x2="390" y2="150" stroke="#c33" stroke-width="2.5"/>
  <path d="M385,155 L390,146 L395,155 Z" fill="#c33"/>
  <text x="112" y="140" font-size="11" fill="#c33" font-weight="bold">u_G（α 处触发）</text>
  <!-- α 标注 -->
  <line x1="90" y1="248" x2="130" y2="248" stroke="#2F5FD0" stroke-width="1.5"/>
  <path d="M90,248 L97,244 L97,252 Z" fill="#2F5FD0"/>
  <path d="M130,248 L123,244 L123,252 Z" fill="#2F5FD0"/>
  <text x="100" y="265" font-size="12" fill="#2F5FD0" font-weight="bold">α</text>
  <!-- 要点 -->
  <rect x="40" y="268" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="288" font-size="12.5" fill="#7a5c00">改变触发脉冲出现的时刻（控制角 α）→ 改变晶闸管的导通角 θ → 改变输出直流平均电压 Uo。</text>
  <text x="20" y="334" font-size="12" fill="#888">这一「调触发时刻调电压」的方式就是移相控制——一切晶闸管可控整流的共同工作原理。</text>
</svg>
