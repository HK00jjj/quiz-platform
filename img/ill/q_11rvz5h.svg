<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="340" fill="#ffffff"/>
  <text x="330" y="28" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">图1-16 电阻串联电路（R1、R2 头尾相连）</text>

  <line x1="100" y1="120" x2="560" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="120" x2="100" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="560" y1="120" x2="560" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="260" x2="280" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="260" x2="560" y2="260" stroke="#333" stroke-width="2"/>

  <!-- 电源 -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="280" y1="242" x2="280" y2="278"/>
    <line x1="300" y1="250" x2="300" y2="270"/>
  </g>
  <line x1="280" y1="260" x2="300" y2="260" stroke="#333" stroke-width="2"/>
  <text x="290" y="300" font-size="14" text-anchor="middle" fill="#1a1a1a">E=6V</text>
  <text x="272" y="238" font-size="13" fill="#c01c28">+</text>
  <text x="306" y="238" font-size="13" fill="#1a5fb4">−</text>

  <!-- R1 -->
  <rect x="200" y="110" width="110" height="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="255" y="102" font-size="14" text-anchor="middle" fill="#1a1a1a">R1=5Ω</text>

  <!-- R2 -->
  <rect x="360" y="110" width="110" height="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="415" y="102" font-size="14" text-anchor="middle" fill="#1a1a1a">R2=7Ω</text>

  <!-- 电流箭头 -->
  <path d="M 200 155 l 16 0 m -7 -5 l 7 5 l -7 5" stroke="#1a5fb4" stroke-width="2" fill="none"/>
  <text x="228" y="160" font-size="14" fill="#1a5fb4">I=0.5A</text>

  <text x="330" y="326" font-size="14" fill="#666" text-anchor="middle">R=R1+R2=12Ω，I=E/R=0.5A；分压与阻值成正比：UR1=2.5V、UR2=3.5V</text>
</svg>
