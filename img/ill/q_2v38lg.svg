<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">配电柜出厂检验与联调前复核：全项执行、逐项留记录（正解 A、C、D、E）</text>
  <rect x="46" y="48" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="68" font-size="12.3" fill="#2a7a2a">1　✓A 外观与接线正确性检查</text>
  <rect x="46" y="84" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="104" font-size="12.3" fill="#2a7a2a">2　✓C 用 500V 兆欧表测相间及对地绝缘电阻</text>
  <rect x="46" y="120" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="140" font-size="12.3" fill="#2a7a2a">3　✓E 通电功能试验与保护动作试验</text>
  <rect x="46" y="156" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="176" font-size="12.3" fill="#2a7a2a">4　✓D 出具检验记录并贴合格证（记录是交付证据）</text>
  <rect x="46" y="192" width="568" height="30" rx="5" fill="#fdecec" stroke="#c33" stroke-width="1.3"/>
  <text x="58" y="212" font-size="12.3" fill="#c33">✗B 万用表高阻档替代兆欧表：电池激发不出绝缘缺陷的泄漏电流，读数虚高</text>
  <rect x="30" y="234" width="600" height="96" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="256" font-size="12.3" fill="#7a5c00">出厂检验的性质是「按标准全项执行、逐项留记录」——不是抽一个点看看，而是用完整清单证明每项达标。</text>
  <text x="46" y="277" font-size="12.3" fill="#7a5c00">误诊一：把万用表高阻档当成绝缘测试手段（选 B 错）——低压测量激发不出泄漏电流。</text>
  <text x="46" y="298" font-size="12.3" fill="#7a5c00">误诊二：把全项检验做成抽查、不留记录——无记录即无交付证据（把「测过了」当成「检验完成」）。</text>
</svg>