<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">低压电机绕组对地绝缘：500V 兆欧表，一般不低于 0.5MΩ（正解 B）</text>
  <rect x="46" y="48" width="568" height="30" rx="5" fill="#fff8ec" stroke="#b8860b" stroke-width="1.3"/>
  <text x="58" y="68" font-size="12.3" fill="#7a5c00">低压电机绕组对地：≥ 0.5 MΩ 判合格（新绕组应远高于此值）</text>
  <rect x="46" y="84" width="568" height="30" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="104" font-size="12.3" fill="#555">配电柜出厂检验：按 GB 7251.1 不低于 1 MΩ（不是同一口径）</text>
  <rect x="46" y="120" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="140" font-size="12.3" fill="#2a7a2a">测量纪律：测前断电验电；测后对绕组放电，防止残余电荷伤人</text>
  <rect x="46" y="162" width="568" height="52" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.4"/>
  <text x="58" y="182" font-size="12.3" fill="#c33">✗A 认为要 50MΩ 以上：把门槛抬高两个数量级——拿新绕组实测值当及格线，</text>
  <text x="58" y="202" font-size="12.3" fill="#c33">会把合格电机误判为不合格。</text>
  <rect x="30" y="224" width="600" height="78" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="246" font-size="12.3" fill="#7a5c00">合格判据按设备类别分档，不能互相套用；也不是「越大约好」，而是按口径判。</text>
  <text x="46" y="267" font-size="12.3" fill="#7a5c00">混淆点：把「新绕组实测值」当成「及格线」——新绕组高是正常，不代表低于它就不合格。</text>
</svg>