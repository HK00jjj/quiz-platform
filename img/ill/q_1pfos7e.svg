<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">成束敷设必须重新修正载流量——不得沿用单层敷设的系数</text>
  <!-- 单层敷设 -->
  <rect x="30" y="52" width="286" height="150" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="173" y="76" font-size="13.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">① 单层敷设（散热好）</text>
  <!-- 桥架截面示意 -->
  <rect x="70" y="94" width="206" height="56" rx="4" fill="#f0ece4" stroke="#999" stroke-width="1.6"/>
  <circle cx="100" cy="122" r="11" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="132" cy="122" r="11" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="164" cy="122" r="11" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="196" cy="122" r="11" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <circle cx="228" cy="122" r="11" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="173" y="172" font-size="12" text-anchor="middle" fill="#333">电缆彼此有间距、热量易散出</text>
  <text x="173" y="192" font-size="12" text-anchor="middle" fill="#2a7a2a" font-weight="bold">修正系数较大 → 载流量按单层工况取</text>
  <!-- 成束敷设 -->
  <rect x="344" y="52" width="286" height="150" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="487" y="76" font-size="13.5" text-anchor="middle" fill="#c33" font-weight="bold">② 无间距成束敷设（根数多、散热差）</text>
  <rect x="384" y="94" width="206" height="56" rx="4" fill="#f0ece4" stroke="#999" stroke-width="1.6"/>
  <circle cx="406" cy="106" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="432" cy="106" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="458" cy="106" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="484" cy="106" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="510" cy="106" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="536" cy="106" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="562" cy="106" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="406" cy="130" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="432" cy="130" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="458" cy="130" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="484" cy="130" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="510" cy="130" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="536" cy="130" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <circle cx="562" cy="130" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="487" y="172" font-size="12" text-anchor="middle" fill="#333">相互紧贴、热量叠加、散热困难</text>
  <text x="487" y="192" font-size="12" text-anchor="middle" fill="#c33" font-weight="bold">修正系数更小 → 必须按成束工况重取</text>
  <!-- 修正关系 -->
  <rect x="30" y="216" width="600" height="76" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="240" font-size="13" fill="#7a5c00" font-weight="bold">修正关系：I_允许 = K × I_基准</text>
  <text x="46" y="262" font-size="12.5" fill="#7a5c00">K 随敷设方式、环境温度、并列根数递减：单层 → 多层并列 → 成束敷设，K 逐级减小。</text>
  <text x="46" y="284" font-size="12.5" fill="#7a5c00">根数越多、间距越小，K 越小；用错工况的 K 会让电缆长期过载、绝缘老化甚至起火。</text>
  <!-- 结论 -->
  <rect x="30" y="304" width="600" height="80" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="46" y="326" font-size="12.5" fill="#2a7a2a" font-weight="bold">✓ 题干说法正确：多回路/多根多芯电缆无间距成束敷设且根数较多时，应按成束敷设工况修正载流量。</text>
  <text x="46" y="348" font-size="12.5" fill="#2a7a2a">不得直接沿用单层敷设条件下的降低系数——敷设方式变了，散热条件就变了，系数必须跟着变。</text>
  <text x="46" y="372" font-size="12" fill="#888">工程做法：查设计手册/规范中的成束敷设校正表，并计入环境温度修正，逐项相乘。</text>
</svg>
