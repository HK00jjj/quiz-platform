<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">指示灯 1s 闪烁：两种梯形图思路</text>
  <!-- 思路一：双定时器振荡 -->
  <rect x="40" y="60" width="580" height="130" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="60" y="86" font-size="13" font-weight="bold" fill="#1c5c1c">思路一 · 双定时器自激振荡</text>
  <!-- 母线 -->
  <line x1="70" y1="100" x2="70" y2="178" stroke="#333" stroke-width="2.5"/>
  <line x1="590" y1="100" x2="590" y2="178" stroke="#333" stroke-width="2.5"/>
  <!-- 行1：Y0 常闭 串 T1常闭 → Y0 线圈... 简化为梯级示意 -->
  <line x1="70" y1="116" x2="120" y2="116" stroke="#333" stroke-width="2"/>
  <path d="M 120 106 L 120 126 M 120 106 L 136 116 M 120 126 L 136 116" stroke="#333" stroke-width="2" fill="none"/>
  <text x="100" y="98" font-size="11" fill="#333">T1 常闭</text>
  <line x1="136" y1="116" x2="180" y2="116" stroke="#333" stroke-width="2"/>
  <rect x="180" y="104" width="64" height="24" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="212" y="121" font-size="12" text-anchor="middle">Y0</text>
  <line x1="244" y1="116" x2="590" y2="116" stroke="#333" stroke-width="2"/>
  <text x="300" y="121" font-size="11" fill="#555">→ 灯 Y0 得电；Y0 得电同时 T0 开始计时 1s</text>
  <!-- 行2 -->
  <line x1="70" y1="152" x2="120" y2="152" stroke="#333" stroke-width="2"/>
  <path d="M 120 142 L 120 162 M 120 142 L 136 152 M 120 162 L 136 152" stroke="#333" stroke-width="2" fill="none"/>
  <text x="100" y="134" font-size="11" fill="#333">Y0 常开</text>
  <line x1="136" y1="152" x2="180" y2="152" stroke="#333" stroke-width="2"/>
  <rect x="180" y="140" width="64" height="24" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="212" y="157" font-size="12" text-anchor="middle">T0 K10</text>
  <line x1="244" y1="152" x2="590" y2="152" stroke="#333" stroke-width="2"/>
  <text x="300" y="157" font-size="11" fill="#555">T0 到 1s → T1 计时 1s 后断开回路，Y0 失电循环</text>
  <text x="60" y="182" font-size="11" fill="#888">亮 1s（T0）→ 灭 1s（T1）周期振荡；改 K 值即改占空与周期</text>
  <!-- 思路二：时钟脉冲 -->
  <rect x="40" y="206" width="580" height="110" rx="10" fill="#eef2fb" stroke="#36c" stroke-width="2"/>
  <text x="60" y="232" font-size="13" font-weight="bold" fill="#234">思路二 · 系统时钟位直接驱动</text>
  <line x1="70" y1="248" x2="70" y2="304" stroke="#333" stroke-width="2.5"/>
  <line x1="590" y1="248" x2="590" y2="304" stroke="#333" stroke-width="2.5"/>
  <line x1="70" y1="264" x2="140" y2="264" stroke="#333" stroke-width="2"/>
  <rect x="140" y="252" width="130" height="24" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="205" y="269" font-size="12" text-anchor="middle">SM0.5 / M8013</text>
  <line x1="270" y1="264" x2="590" y2="264" stroke="#333" stroke-width="2"/>
  <text x="320" y="269" font-size="11" fill="#555">0.5s 周期时钟位（ON 0.5s / OFF 0.5s）</text>
  <text x="60" y="300" font-size="11.5" fill="#234">时钟位常开触点直接接 Y0 线圈：0.5s 亮 0.5s 灭（1s 周期）；两思路口径不同，按「亮1秒」要求核对周期</text>
  <text x="20" y="344" font-size="12" fill="#888">要点：继电器输出机械寿命有限，高频闪烁负载优先选晶体管输出型 PLC。</text>
</svg>
