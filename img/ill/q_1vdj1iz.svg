<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">交流控制电路：两只电器线圈严禁串联连接</text>
  <!-- ✗ 串联 -->
  <text x="165" y="62" font-size="14" text-anchor="middle" fill="#c33" font-weight="bold">✗ 串联（错误）</text>
  <rect x="50" y="76" width="230" height="90" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.5"/>
  <line x1="70" y1="110" x2="70" y2="146" stroke="#c33" stroke-width="2.2"/>
  <line x1="70" y1="110" x2="100" y2="110" stroke="#333" stroke-width="2"/>
  <rect x="100" y="96" width="72" height="28" rx="4" fill="#fff" stroke="#c33" stroke-width="1.8"/>
  <text x="136" y="115" font-size="12" text-anchor="middle" fill="#c33" font-weight="bold">KM1 线圈</text>
  <line x1="172" y1="110" x2="190" y2="110" stroke="#333" stroke-width="2"/>
  <rect x="190" y="96" width="72" height="28" rx="4" fill="#fff" stroke="#c33" stroke-width="1.8"/>
  <text x="226" y="115" font-size="12" text-anchor="middle" fill="#c33" font-weight="bold">KM2 线圈</text>
  <line x1="262" y1="110" x2="280" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="110" x2="280" y2="146" stroke="#c33" stroke-width="2.2"/>
  <text x="165" y="152" font-size="11.5" text-anchor="middle" fill="#c33">两线圈分压——动作电压不足或吸合顺序不可控</text>
  <!-- ✓ 并联 -->
  <text x="495" y="62" font-size="14" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ 并联（正确）</text>
  <rect x="380" y="76" width="230" height="90" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.5"/>
  <line x1="400" y1="110" x2="400" y2="146" stroke="#2a7a2a" stroke-width="2.2"/>
  <line x1="400" y1="110" x2="450" y2="110" stroke="#333" stroke-width="2"/>
  <rect x="450" y="96" width="72" height="28" rx="4" fill="#fff" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="486" y="115" font-size="12" text-anchor="middle" fill="#2a7a2a" font-weight="bold">KM1 线圈</text>
  <line x1="400" y1="146" x2="450" y2="146" stroke="#333" stroke-width="2"/>
  <rect x="450" y="132" width="72" height="28" rx="4" fill="#fff" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="486" y="151" font-size="12" text-anchor="middle" fill="#2a7a2a" font-weight="bold">KM2 线圈</text>
  <line x1="522" y1="146" x2="580" y2="146" stroke="#333" stroke-width="2"/>
  <line x1="580" y1="110" x2="580" y2="160" stroke="#2a7a2a" stroke-width="2.2"/>
  <line x1="450" y1="146" x2="450" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="580" y1="110" x2="610" y2="110" stroke="#333" stroke-width="2"/>
  <text x="495" y="180" font-size="11.5" text-anchor="middle" fill="#2a7a2a">并联：各自获得额定电压，独立可靠动作 ✓</text>
  <!-- 要点 -->
  <rect x="30" y="184" width="600" height="108" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="206" font-size="12.5" fill="#7a5c00">交流接触器/继电器线圈的吸合电压是按额定电压设计的。两线圈串联后：</text>
  <text x="46" y="228" font-size="12.5" fill="#7a5c00">· 阻抗分压 → 每个线圈得到的电压低于额定值 → 可能不吸合或吸合不牢；</text>
  <text x="46" y="250" font-size="12.5" fill="#7a5c00">· 即使能吸合，先吸合的线圈阻抗增大 → 电压重新分配 → 另一个更无法吸合。</text>
  <text x="46" y="272" font-size="12.5" fill="#2a7a2a" font-weight="bold">结论：交流控制电路中两只电器线圈应并联连接，不得串联。</text>
  <!-- 直流例外 -->
  <rect x="30" y="302" width="600" height="52" rx="8" fill="#f4f7ff" stroke="#2F5FD0" stroke-width="1.4"/>
  <text x="46" y="322" font-size="12" fill="#555">注：直流控制电路中，两线圈串联有时可行（各分一半电压）——但交流电路因阻抗分压</text>
  <text x="46" y="344" font-size="12" fill="#555">不稳定，严禁串联。本题考点即交流电路串联线圈的不可靠性。</text>
</svg>
