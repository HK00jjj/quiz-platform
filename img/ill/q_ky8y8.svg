<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">接地电阻实测：保护接地 ≤4Ω，防雷接地 ≤10Ω（两值不可互换）</text>
  <rect x="30" y="46" width="290" height="150" rx="10" fill="#fafafa" stroke="#aaa" stroke-width="1.4"/>
  <text x="44" y="68" font-size="12.5" fill="#555">测试布置（打辅助接地极）</text>
  <circle cx="80" cy="120" r="9" fill="#2F5FD0"/><text x="72" y="125" font-size="11" fill="#fff">E</text>
  <circle cx="180" cy="120" r="9" fill="#2a7a2a"/><text x="172" y="125" font-size="11" fill="#fff">P</text>
  <circle cx="280" cy="120" r="9" fill="#b8860b"/><text x="272" y="125" font-size="11" fill="#fff">C</text>
  <line x1="80" y1="120" x2="280" y2="120" stroke="#888" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="60" y="150" font-size="10.5" fill="#666">被测接地极 E</text>
  <text x="150" y="150" font-size="10.5" fill="#666">电位极 P</text>
  <text x="248" y="150" font-size="10.5" fill="#666">电流极 C</text>
  <text x="44" y="176" font-size="11" fill="#777">E—P—C 依次布置，由测试仪读出接地电阻值</text>
  <rect x="336" y="46" width="294" height="150" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.4"/>
  <text x="350" y="70" font-size="12.5" font-weight="bold" fill="#7a5c00">限值对照（一般要求）</text>
  <text x="350" y="100" font-size="12.3" fill="#333">保护接地　≤ 4 Ω　→ 漏电时外壳对地电压越低越安全</text>
  <text x="350" y="128" font-size="12.3" fill="#333">防雷接地　≤ 10 Ω　→ 重点在雷电流泄放通道畅通</text>
  <text x="350" y="156" font-size="12" fill="#c33">两值不能互换：保护接地做成 10Ω，故障时外壳电压偏高</text>
  <text x="350" y="180" font-size="12" fill="#555">实测超标须整改（补打接地极、降阻剂）后复测</text>
  <rect x="30" y="206" width="600" height="78" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="228" font-size="12.3" fill="#7a5c00">记忆点：保护 4、防雷 10。常见错法一是两值记互换（保护填 10、防雷填 4）；二是只记数字不记目的。</text>
  <text x="46" y="249" font-size="12.3" fill="#7a5c00">保护接地的目的是压低外壳对地电压，防雷接地的目的是泄放雷电流、防反击——目的不同，限值自然不同。</text>
</svg>