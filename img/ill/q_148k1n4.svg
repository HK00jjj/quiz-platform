<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">桥架 / 母线槽的跨接等电位联结</text>
  <!-- 桥架两段 -->
  <path d="M 60 120 L 250 120 L 250 160 L 60 160 Z" fill="#e8e8e8" stroke="#333" stroke-width="2.5"/>
  <path d="M 300 120 L 490 120 L 490 160 L 300 160 Z" fill="#e8e8e8" stroke="#333" stroke-width="2.5"/>
  <text x="155" y="144" font-size="12" text-anchor="middle" fill="#333">电缆桥架 段A</text>
  <text x="395" y="144" font-size="12" text-anchor="middle" fill="#333">电缆桥架 段B</text>
  <!-- 断缝与跨接线 -->
  <path d="M 254 130 C 268 138 282 142 296 130" fill="none" stroke="#ffd400" stroke-width="5"/>
  <path d="M 254 152 C 268 144 282 140 296 152" fill="none" stroke="#2e8b2e" stroke-width="5"/>
  <text x="275" y="186" font-size="12" text-anchor="middle" font-weight="bold" fill="#8a6d00">跨接接地线（BVR ≥4mm²）</text>
  <text x="275" y="204" font-size="11" text-anchor="middle" fill="#555">两端镀锌垫圈/爪形垫圈压紧，去漆见金属</text>
  <!-- 接地干线 -->
  <line x1="60" y1="240" x2="590" y2="240" stroke="#2e8b2e" stroke-width="5"/>
  <text x="60" y="262" font-size="12" fill="#2e8b2e">PE 干线 / 接地母排</text>
  <line x1="155" y1="160" x2="155" y2="240" stroke="#2e8b2e" stroke-width="3"/>
  <line x1="395" y1="160" x2="395" y2="240" stroke="#2e8b2e" stroke-width="3"/>
  <line x1="575" y1="160" x2="575" y2="240" stroke="#2e8b2e" stroke-width="0"/>
  <!-- 母线槽 -->
  <rect x="520" y="120" width="80" height="40" rx="6" fill="#dfe8f8" stroke="#36c" stroke-width="2"/>
  <text x="560" y="144" font-size="11" text-anchor="middle" fill="#234">母线槽</text>
  <text x="20" y="292" font-size="12.5" fill="#333">金属桥架/母线槽连接处有漆层、镀层与垫片间隔——「金属接触」≠「电气连续」；</text>
  <text x="20" y="312" font-size="12.5" fill="#333">每段之间、每节之间做跨接，整体两端可靠接入 PE，全长电气连续才是保护前提。</text>
  <text x="20" y="338" font-size="12" fill="#888">要点：跨接兼具故障电流通路与等电位（防感应电位差打火）双重作用，验收必查过渡电阻。</text>
</svg>
