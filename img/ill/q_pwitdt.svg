<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="18.5" font-weight="bold" fill="#222">梯形图编程前六项准备：地址分配不可省（题干说法错误）</text>
  <rect x="34" y="52" width="286" height="54" rx="8" fill="#fafafa" stroke="#aaa" stroke-width="1.4"/>
  <text x="52" y="72" font-size="12.5" fill="#333">① 熟悉 PLC 指令系统</text>
  <text x="52" y="92" font-size="12.5" fill="#333">② 读说明书，弄清地址分配</text>
  <rect x="344" y="52" width="286" height="54" rx="8" fill="#fafafa" stroke="#aaa" stroke-width="1.4"/>
  <text x="362" y="72" font-size="12.5" fill="#333">③ 了解硬件接线情况</text>
  <text x="362" y="92" font-size="12.5" fill="#333">⑥ 清楚控制原理与得失电条件</text>

  <rect x="34" y="116" width="286" height="56" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="52" y="136" font-size="12.5" fill="#c33" font-weight="bold">④ 为输入/输出设备分配地址 ★</text>
  <text x="52" y="158" font-size="11.8" fill="#333">X/I 输入点、Y/O/Q 输出点须先落位</text>
  <rect x="344" y="116" width="286" height="56" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="362" y="136" font-size="12.5" fill="#c33" font-weight="bold">⑤ 为中间量分配地址 ★</text>
  <text x="362" y="158" font-size="11.8" fill="#333">内部继电器 M、定时器 T、计数器 C…</text>

  <rect x="34" y="184" width="596" height="76" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="52" y="206" font-size="12.5" fill="#c33" font-weight="bold">✗ 题干说法：「可不必分配地址，直接按控制要求写梯级」</text>
  <text x="52" y="228" font-size="12" fill="#7a5c00">与源文第 ④、⑤ 项直接矛盾：不分配地址，程序里的软元件无法对应到物理 I/O 点，</text>
  <text x="52" y="248" font-size="12" fill="#7a5c00">梯形图写得再对也无法下载运行 → 该说法错误。</text>
  <rect x="30" y="272" width="600" height="100" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="294" font-size="12.3" fill="#7a5c00">判据：题干否定「分配地址」这一必备准备 → 判错误（不是省事问题，是程序无法对应物理点）。</text>
  <text x="46" y="315" font-size="12.3" fill="#7a5c00">六项准备速记：指令 → 说明书 → 硬件接线 → 分配 I/O 地址 → 分配中间量地址 → 控制原理与得失电条件。</text>
  <text x="46" y="336" font-size="12.3" fill="#7a5c00">易错点：把「分配地址」当成可省略的形式工作。实际它是软件软元件与硬件端子之间的唯一映射。</text>
</svg>