<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L8,4 L0,7.5 z" fill="#333333"/>
    </marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0.5 L0,4 L8,7.5 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="25" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">市电有效值与最大瞬时值波形</text>

  <line x1="80" y1="340" x2="80" y2="68" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="80" y1="240" x2="634" y2="240" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="50" y="78" font-size="14" fill="#1a1a1a">u/V</text>
  <text x="618" y="262" font-size="14" fill="#1a1a1a">t</text>
  <text x="70" y="258" font-size="13" fill="#1a1a1a">0</text>

  <path d="M80,240 C125.83,67.5 171.67,67.5 217.5,240 C263.33,412.5 309.17,412.5 355,240 C400.83,67.5 446.67,67.5 492.5,240" fill="none" stroke="#333333" stroke-width="2.2"/>

  <line x1="80" y1="125" x2="415" y2="125" stroke="#888888" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="80" y1="159" x2="415" y2="159" stroke="#888888" stroke-width="1.3" stroke-dasharray="6 4"/>
  <circle cx="148.75" cy="125" r="4" fill="#333333"/>
  <rect x="420" y="112" width="192" height="26" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="516" y="130" font-size="14" fill="#1a1a1a" text-anchor="middle">Um ≈ 311V（最大瞬时值）</text>
  <rect x="420" y="146" width="192" height="26" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="516" y="164" font-size="14" fill="#1a1a1a" text-anchor="middle">U = 220V（有效值）</text>
  <line x1="95" y1="125" x2="95" y2="159" stroke="#555555" stroke-width="1.2" marker-start="url(#ah2)" marker-end="url(#ah)"/>
  <text x="104" y="147" font-size="13" fill="#555555">√2倍</text>

  <text x="245" y="262" font-size="13" fill="#888888" text-anchor="middle">工频 50Hz（T = 0.02s）</text>

  <text x="330" y="385" font-size="15" fill="#8b1a1a" text-anchor="middle">日常所说市电 220V 指的是有效值，不是最大瞬时值（峰值约 311V）</text>
</svg>
