<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="25" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">星形连接供电方式：四线构成（三相四线制）</text>

  <circle cx="110" cy="205" r="75" fill="none" stroke="#333333" stroke-width="2"/>
  <line x1="110" y1="205" x2="136.9" y2="135" stroke="#333333" stroke-width="1.8"/>
  <line x1="110" y1="205" x2="180.7" y2="180" stroke="#333333" stroke-width="1.8"/>
  <line x1="110" y1="205" x2="180.7" y2="230" stroke="#333333" stroke-width="1.8"/>
  <line x1="110" y1="205" x2="136.9" y2="275" stroke="#333333" stroke-width="1.8"/>
  <circle cx="110" cy="205" r="3.5" fill="#333333"/>
  <circle cx="136.9" cy="135" r="2.5" fill="#333333"/>
  <circle cx="180.7" cy="180" r="2.5" fill="#333333"/>
  <circle cx="180.7" cy="230" r="2.5" fill="#333333"/>
  <circle cx="136.9" cy="275" r="2.5" fill="#333333"/>
  <text x="110" y="302" font-size="14" fill="#1a1a1a" text-anchor="middle">发电机（三组线圈）</text>

  <line x1="136.9" y1="135" x2="544" y2="135" stroke="#222222" stroke-width="2"/>
  <line x1="180.7" y1="180" x2="544" y2="180" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="180.7" y1="230" x2="544" y2="230" stroke="#c01c28" stroke-width="2"/>
  <line x1="136.9" y1="275" x2="620" y2="275" stroke="#333333" stroke-width="2.5"/>

  <text x="330" y="127" font-size="14" fill="#222222" text-anchor="middle">U 相线</text>
  <text x="330" y="172" font-size="14" fill="#1a5fb4" text-anchor="middle">V 相线</text>
  <text x="330" y="222" font-size="14" fill="#c01c28" text-anchor="middle">W 相线</text>
  <text x="330" y="267" font-size="14" fill="#333333" text-anchor="middle">N 中性线</text>

  <circle cx="560" cy="135" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="548.7" y1="123.7" x2="571.3" y2="146.3" stroke="#333333" stroke-width="1.6"/>
  <line x1="571.3" y1="123.7" x2="548.7" y2="146.3" stroke="#333333" stroke-width="1.6"/>
  <circle cx="560" cy="180" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="548.7" y1="168.7" x2="571.3" y2="191.3" stroke="#333333" stroke-width="1.6"/>
  <line x1="571.3" y1="168.7" x2="548.7" y2="191.3" stroke="#333333" stroke-width="1.6"/>
  <circle cx="560" cy="230" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="548.7" y1="218.7" x2="571.3" y2="241.3" stroke="#333333" stroke-width="1.6"/>
  <line x1="571.3" y1="218.7" x2="548.7" y2="241.3" stroke="#333333" stroke-width="1.6"/>
  <text x="560" y="312" font-size="14" fill="#1a1a1a" text-anchor="middle">三相负载</text>

  <line x1="576" y1="135" x2="620" y2="135" stroke="#333333" stroke-width="2"/>
  <line x1="576" y1="180" x2="620" y2="180" stroke="#333333" stroke-width="2"/>
  <line x1="576" y1="230" x2="620" y2="230" stroke="#333333" stroke-width="2"/>
  <line x1="620" y1="135" x2="620" y2="275" stroke="#333333" stroke-width="2.5"/>

  <text x="330" y="345" font-size="15" fill="#1a1a1a" text-anchor="middle">四根导线 = 三根相线（U、V、W）＋ 一根中性线 N</text>
  <text x="330" y="368" font-size="14" fill="#666666" text-anchor="middle">地线不在四线之列 —— 故又称三相四线制</text>
</svg>
