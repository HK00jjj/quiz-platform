<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#ffffff"/>

  <!-- 左侧：电路图中的电阻符号 -->
  <line x1="50" y1="170" x2="130" y2="170" stroke="#333333" stroke-width="2"/>
  <rect x="130" y="152" width="70" height="36" fill="#ffffff" stroke="#333333" stroke-width="2.5"/>
  <line x1="200" y1="170" x2="270" y2="170" stroke="#333333" stroke-width="2"/>
  <text x="165" y="140" font-size="20" font-style="italic" font-weight="bold" text-anchor="middle" fill="#111111">R</text>
  <polygon points="70,165 100,165 100,161 114,170 100,179 100,175 70,175" fill="#333333"/>
  <text x="90" y="152" font-size="15" font-style="italic" font-weight="bold" text-anchor="middle" fill="#111111">I</text>
  <text x="160" y="232" font-size="14" text-anchor="middle" fill="#444444">电路图中的电阻符号</text>
  <text x="160" y="256" font-size="14" text-anchor="middle" fill="#444444">（空心矩形）</text>

  <!-- 右侧：表示规定信息框 -->
  <rect x="320" y="70" width="310" height="210" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="475" y="102" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">电阻的表示规定</text>
  <line x1="335" y1="120" x2="615" y2="120" stroke="#999999" stroke-width="1"/>
  <text x="475" y="155" font-size="16" text-anchor="middle" fill="#111111">字母符号：<tspan font-weight="bold">R</tspan></text>
  <text x="475" y="190" font-size="16" text-anchor="middle" fill="#111111">单位名称：欧姆（简称欧）</text>
  <text x="475" y="225" font-size="16" text-anchor="middle" fill="#111111">单位符号：<tspan font-weight="bold">Ω</tspan></text>
  <text x="475" y="260" font-size="16" text-anchor="middle" fill="#111111">标注示例：R = 10 Ω</text>

  <!-- 底部：物理量对照 -->
  <rect x="40" y="315" width="175" height="48" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="127" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">电流</text>
  <text x="127" y="355" font-size="14" text-anchor="middle" fill="#444444">I，单位 A</text>

  <rect x="243" y="315" width="175" height="48" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="330" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">电压</text>
  <text x="330" y="355" font-size="14" text-anchor="middle" fill="#444444">U，单位 V</text>

  <rect x="446" y="315" width="175" height="48" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2.5"/>
  <text x="533" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">电阻</text>
  <text x="533" y="355" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">R，单位 Ω</text>
</svg>
