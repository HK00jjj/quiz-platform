<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18.5" font-weight="bold" fill="#222">电动机每次起动前的检查项目（不仅限于首次）</text>
  <rect x="34" y="52" width="286" height="86" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="177" y="76" font-size="13" text-anchor="middle" fill="#2F5FD0" font-weight="bold">① 电源电压</text>
  <text x="52" y="100" font-size="12" fill="#333">· 电压是否正常</text>
  <text x="52" y="120" font-size="12" fill="#333">· 是否过高或过低</text>
  <rect x="344" y="52" width="286" height="86" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="487" y="76" font-size="13" text-anchor="middle" fill="#2F5FD0" font-weight="bold">② 三相平衡</text>
  <text x="362" y="100" font-size="12" fill="#333">· 三相电压是否平衡</text>
  <text x="362" y="120" font-size="12" fill="#333">· 缺相/严重不平衡禁止起动</text>

  <rect x="34" y="146" width="286" height="86" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="177" y="170" font-size="13" text-anchor="middle" fill="#2F5FD0" font-weight="bold">③ 线路接线</text>
  <text x="52" y="194" font-size="12" fill="#333">· 接线是否可靠（端子无松动）</text>
  <text x="52" y="214" font-size="12" fill="#333">· 接地/接零是否完好</text>
  <rect x="344" y="146" width="286" height="86" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="487" y="170" font-size="13" text-anchor="middle" fill="#2F5FD0" font-weight="bold">④ 熔体</text>
  <text x="362" y="194" font-size="12" fill="#333">· 熔断器熔体有无损坏</text>
  <text x="362" y="214" font-size="12" fill="#333">· 规格是否与电机匹配</text>

  <rect x="34" y="240" width="596" height="42" rx="8" fill="#fafafa" stroke="#aaa" stroke-width="1.3"/>
  <text x="52" y="258" font-size="12" fill="#555">扩展项：联轴器/传动带状态、转动是否灵活、周围有无杂物、润滑与冷却是否正常</text>
  <text x="52" y="276" font-size="12" fill="#555">题干涵盖「电压 + 三相平衡 + 接线可靠 + 熔体完好」四项要点 → 说法正确</text>
  <rect x="30" y="292" width="600" height="56" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="314" font-size="12.3" fill="#7a5c00">易错点一：以为只在首次投运检查，忽视「每次起动前」；易错点二：以为电压高低无所谓。</text>
  <text x="46" y="335" font-size="12.3" fill="#7a5c00">判据：题干四项与源文检查项完全对应，判正确。</text>
</svg>