<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="17.5" fill="#222" font-weight="bold">电功率：P = W / t = U I，单位瓦特（W）</text>
  <rect x="34" y="48" width="592" height="96" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.8"/>
  <text x="50" y="74" font-size="12.5" fill="#2F5FD0" font-weight="bold">定义 → 推演</text>
  <text x="50" y="96" font-size="13" fill="#333">电流做功 W = U I t</text>
  <text x="50" y="118" font-size="13" fill="#333">功率 P = W / t = U I</text>
  <text x="50" y="140" font-size="11.5" fill="#777">第一空填「电功率」，第二空填「P=UI」</text>

  <rect x="34" y="158" width="286" height="152" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="177" y="182" font-size="13" fill="#555" font-weight="bold" text-anchor="middle">各量含义与单位</text>
  <text x="50" y="206" font-size="12.3" fill="#333">P 功率：瓦特 W（J/s）</text>
  <text x="50" y="228" font-size="12.3" fill="#333">U 电压：伏特 V</text>
  <text x="50" y="250" font-size="12.3" fill="#333">I 电流：安培 A</text>
  <text x="50" y="272" font-size="12.3" fill="#333">t 时间：秒 s</text>
  <text x="50" y="294" font-size="11.5" fill="#777">描述做功快慢，不是做功多少</text>

  <rect x="334" y="158" width="292" height="152" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.8"/>
  <text x="480" y="182" font-size="13" fill="#7a5c00" font-weight="bold" text-anchor="middle">纯电阻下的变形</text>
  <text x="350" y="206" font-size="12.6" fill="#333">由 U = I R 代入：</text>
  <text x="350" y="230" font-size="13" fill="#333">P = I² R　或　P = U² / R</text>
  <text x="350" y="256" font-size="12" fill="#7a5c00">仅适用于纯电阻负载</text>
  <text x="350" y="278" font-size="11.5" fill="#777">电机等含电抗负载不能这样代</text>
  <text x="350" y="298" font-size="11.5" fill="#777">第一性公式始终是 P = UI</text>
  <rect x="30" y="322" width="600" height="54" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="344" font-size="12.3" fill="#7a5c00">记忆：P = W/t = UI；纯电阻才有 P = I²R = U²/R。</text>
  <text x="46" y="365" font-size="12.3" fill="#7a5c00">误诊提醒：把变形公式用到感性负载上，是把「欧姆定律适用范围」弄错了。</text>
</svg>