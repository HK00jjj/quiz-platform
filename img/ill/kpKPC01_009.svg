<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>

  <!-- 中央分隔虚线 -->
  <line x1="330" y1="55" x2="330" y2="290" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- 左栏：阻碍作用小 -->
  <text x="160" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">阻碍作用小</text>
  <line x1="50" y1="160" x2="120" y2="160" stroke="#333333" stroke-width="2"/>
  <rect x="120" y="146" width="75" height="28" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="195" y1="160" x2="235" y2="160" stroke="#333333" stroke-width="2"/>
  <circle cx="257" cy="160" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="245" y1="148" x2="269" y2="172" stroke="#333333" stroke-width="2"/>
  <line x1="269" y1="148" x2="245" y2="172" stroke="#333333" stroke-width="2"/>
  <polygon points="58,152 98,152 98,146 118,160 98,174 98,168 58,168" fill="#333333"/>
  <text x="82" y="140" font-size="15" font-style="italic" font-weight="bold" text-anchor="middle" fill="#111111">I</text>
  <text x="257" y="205" font-size="14" text-anchor="middle" fill="#444444">灯亮</text>
  <text x="160" y="248" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">电阻小</text>
  <text x="160" y="275" font-size="14" text-anchor="middle" fill="#444444">对电流阻碍小，电流大</text>

  <!-- 右栏：阻碍作用大 -->
  <text x="495" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">阻碍作用大</text>
  <line x1="390" y1="160" x2="455" y2="160" stroke="#333333" stroke-width="2"/>
  <rect x="455" y="140" width="100" height="40" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="555" y1="160" x2="570" y2="160" stroke="#333333" stroke-width="2"/>
  <circle cx="592" cy="160" r="22" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="580" y1="148" x2="604" y2="172" stroke="#333333" stroke-width="2"/>
  <line x1="604" y1="148" x2="580" y2="172" stroke="#333333" stroke-width="2"/>
  <polygon points="398,156 428,156 428,153 442,160 428,167 428,164 398,164" fill="#333333"/>
  <text x="418" y="140" font-size="15" font-style="italic" font-weight="bold" text-anchor="middle" fill="#111111">I</text>
  <text x="592" y="205" font-size="14" text-anchor="middle" fill="#444444">灯暗</text>
  <text x="495" y="248" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">电阻大</text>
  <text x="495" y="275" font-size="14" text-anchor="middle" fill="#444444">对电流阻碍大，电流小</text>

  <!-- 底部结论 -->
  <text x="330" y="328" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">阻碍作用与电阻同大同小、一一对应</text>
  <text x="330" y="356" font-size="14" text-anchor="middle" fill="#444444">阻碍越小，电阻越小，导电越容易</text>
</svg>
