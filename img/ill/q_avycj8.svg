<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="340" fill="#ffffff"/>
  <text x="330" y="28" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">图1-22 正弦交流电波形（周期 T=0.02s，f=1/T=50Hz）</text>

  <line x1="80" y1="180" x2="600" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="70" x2="100" y2="290" stroke="#333" stroke-width="2"/>
  <text x="612" y="186" font-size="14" fill="#333">t</text>
  <text x="76" y="66" font-size="13" fill="#333">u</text>

  <!-- 一个完整周期：x 150 -> 450 -->
  <path d="M 100 180 C 137 80, 213 80, 250 180 C 287 280, 363 280, 400 180 C 437 80, 513 80, 550 180"
        fill="none" stroke="#c01c28" stroke-width="2.5"/>

  <!-- 周期标注 -->
  <g stroke="#1a5fb4" stroke-width="1.6" fill="none">
    <line x1="250" y1="180" x2="250" y2="300"/>
    <line x1="400" y1="180" x2="400" y2="300"/>
    <line x1="250" y1="288" x2="400" y2="288"/>
  </g>
  <path d="M 256 284 l -8 4 l 8 4" fill="#1a5fb4"/>
  <path d="M 394 284 l 8 4 l -8 4" fill="#1a5fb4"/>
  <text x="325" y="284" font-size="14" text-anchor="middle" fill="#1a5fb4">T = 0.02s</text>

  <text x="250" y="196" font-size="13" text-anchor="middle" fill="#333">T</text>
  <text x="400" y="196" font-size="13" text-anchor="middle" fill="#333">2T</text>
  <text x="125" y="115" font-size="13" fill="#c01c28">正向最大值</text>
  <text x="500" y="230" font-size="13" fill="#666">每隔 0.02s 重复一次</text>

  <text x="330" y="326" font-size="14" fill="#666" text-anchor="middle">频率与周期互为倒数：f = 1/T = 1 ÷ 0.02s = 50Hz，即 1s 内重复变化 50 次</text>
</svg>
