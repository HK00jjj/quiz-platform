<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="28" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">磁铁插入、静止、拔出三种工况与指针偏转对照</text>

  <!-- 栏分隔虚线 -->
  <line x1="220" y1="50" x2="220" y2="358" stroke="#888" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="440" y1="50" x2="440" y2="358" stroke="#888" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- ===== 栏① 插入 ===== -->
  <text x="110" y="70" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">① 插入过程</text>
  <rect x="30" y="147" width="70" height="16" fill="#eeeeee" stroke="#222" stroke-width="2"/>
  <rect x="78" y="147" width="22" height="16" fill="#3a3a3a" stroke="#222" stroke-width="2"/>
  <line x1="52" y1="134" x2="82" y2="134" stroke="#222" stroke-width="2.5"/>
  <polygon points="92,134 79,129 79,139" fill="#222"/>
  <text x="66" y="124" font-size="13" fill="#222" text-anchor="middle">插入</text>
  <!-- 线圈 -->
  <rect x="77" y="128" width="66" height="7" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
  <rect x="77" y="178" width="66" height="7" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
  <g stroke="#222" stroke-width="2" fill="none">
    <path d="M82,182 a9,12 0 0 1 18,0"/>
    <path d="M100,182 a9,12 0 0 1 18,0"/>
    <path d="M118,182 a9,12 0 0 1 18,0"/>
  </g>
  <!-- 表盘：指针偏右 -->
  <circle cx="110" cy="265" r="30" fill="#ffffff" stroke="#222" stroke-width="2.2"/>
  <text x="110" y="248" font-size="11" fill="#222" text-anchor="middle">0</text>
  <line x1="110" y1="270" x2="127" y2="246" stroke="#8a4a12" stroke-width="2.5"/>
  <circle cx="110" cy="270" r="3" fill="#222"/>
  <text x="110" y="306" font-size="13" font-weight="bold" fill="#8a4a12" text-anchor="middle">偏转</text>
  <!-- 接线 -->
  <polyline points="82,185 82,228 92,246" fill="none" stroke="#222" stroke-width="1.6"/>
  <polyline points="138,185 138,228 128,246" fill="none" stroke="#222" stroke-width="1.6"/>
  <!-- 结论框 -->
  <rect x="28" y="318" width="164" height="44" rx="6" fill="#f4f9f4" stroke="#1a5c2e" stroke-width="1.5"/>
  <text x="110" y="336" font-size="13" fill="#1a5c2e" text-anchor="middle">磁通量增大（ΔΦ≠0）</text>
  <text x="110" y="354" font-size="13" font-weight="bold" fill="#1a5c2e" text-anchor="middle">产生感应电流，指针偏转</text>

  <!-- ===== 栏② 静止 ===== -->
  <text x="330" y="70" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">② 静止在线圈中</text>
  <rect x="288" y="147" width="70" height="16" fill="#eeeeee" stroke="#222" stroke-width="2"/>
  <rect x="336" y="147" width="22" height="16" fill="#3a3a3a" stroke="#222" stroke-width="2"/>
  <text x="330" y="128" font-size="13" fill="#555" text-anchor="middle">保持不动</text>
  <!-- 线圈 -->
  <rect x="297" y="128" width="66" height="7" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
  <rect x="297" y="178" width="66" height="7" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
  <g stroke="#222" stroke-width="2" fill="none">
    <path d="M302,182 a9,12 0 0 1 18,0"/>
    <path d="M320,182 a9,12 0 0 1 18,0"/>
    <path d="M338,182 a9,12 0 0 1 18,0"/>
  </g>
  <!-- 表盘：指针回零 -->
  <circle cx="330" cy="265" r="30" fill="#ffffff" stroke="#222" stroke-width="2.2"/>
  <text x="330" y="248" font-size="11" fill="#222" text-anchor="middle">0</text>
  <line x1="330" y1="270" x2="330" y2="242" stroke="#555" stroke-width="2.5"/>
  <circle cx="330" cy="270" r="3" fill="#222"/>
  <text x="330" y="306" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">不偏转</text>
  <polyline points="302,185 302,228 312,246" fill="none" stroke="#222" stroke-width="1.6"/>
  <polyline points="358,185 358,228 348,246" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="248" y="318" width="164" height="44" rx="6" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="330" y="336" font-size="13" fill="#444" text-anchor="middle">磁通量不变（ΔΦ=0）</text>
  <text x="330" y="354" font-size="13" font-weight="bold" fill="#444" text-anchor="middle">无感应电流，指针回零</text>

  <!-- ===== 栏③ 拔出 ===== -->
  <text x="550" y="70" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">③ 拔出过程</text>
  <rect x="470" y="147" width="70" height="16" fill="#eeeeee" stroke="#222" stroke-width="2"/>
  <rect x="518" y="147" width="22" height="16" fill="#3a3a3a" stroke="#222" stroke-width="2"/>
  <line x1="522" y1="134" x2="492" y2="134" stroke="#222" stroke-width="2.5"/>
  <polygon points="482,134 495,129 495,139" fill="#222"/>
  <text x="502" y="124" font-size="13" fill="#222" text-anchor="middle">拔出</text>
  <!-- 线圈 -->
  <rect x="517" y="128" width="66" height="7" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
  <rect x="517" y="178" width="66" height="7" fill="#ffffff" stroke="#222" stroke-width="1.8"/>
  <g stroke="#222" stroke-width="2" fill="none">
    <path d="M522,182 a9,12 0 0 1 18,0"/>
    <path d="M540,182 a9,12 0 0 1 18,0"/>
    <path d="M558,182 a9,12 0 0 1 18,0"/>
  </g>
  <!-- 表盘：指针偏左 -->
  <circle cx="550" cy="265" r="30" fill="#ffffff" stroke="#222" stroke-width="2.2"/>
  <text x="550" y="248" font-size="11" fill="#222" text-anchor="middle">0</text>
  <line x1="550" y1="270" x2="533" y2="246" stroke="#8a4a12" stroke-width="2.5"/>
  <circle cx="550" cy="270" r="3" fill="#222"/>
  <text x="550" y="306" font-size="13" font-weight="bold" fill="#8a4a12" text-anchor="middle">反向偏转</text>
  <polyline points="522,185 522,228 532,246" fill="none" stroke="#222" stroke-width="1.6"/>
  <polyline points="578,185 578,228 568,246" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="468" y="318" width="164" height="44" rx="6" fill="#f4f9f4" stroke="#1a5c2e" stroke-width="1.5"/>
  <text x="550" y="336" font-size="13" fill="#1a5c2e" text-anchor="middle">磁通量减小（ΔΦ≠0）</text>
  <text x="550" y="354" font-size="13" font-weight="bold" fill="#1a5c2e" text-anchor="middle">感应电流反向，指针反向偏转</text>

  <line x1="40" y1="372" x2="620" y2="372" stroke="#bbb" stroke-width="1"/>
  <text x="330" y="392" font-size="14" fill="#333" text-anchor="middle">插、拔皆偏转，静止不偏转；拔出与插入的磁通变化方向相反，指针摆向也相反</text>
</svg>
