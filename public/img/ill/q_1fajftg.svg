<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="17.5" fill="#222" font-weight="bold">电缆穿管四要求：无接头、挂标识、弯径 10D、管口护圈</text>
  <rect x="34" y="48" width="286" height="196" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="177" y="72" font-size="13" fill="#2a7a2a" font-weight="bold" text-anchor="middle">✓ 正确（ABCE）</text>
  <text x="50" y="96" font-size="12.3" fill="#333">A 管内不得有接头</text>
  <text x="50" y="114" font-size="12.3" fill="#333">　 接头一律放接线盒</text>
  <text x="50" y="138" font-size="12.3" fill="#333">B 两端挂回路标识牌</text>
  <text x="50" y="156" font-size="12.3" fill="#333">　 保证日后维护可追溯</text>
  <text x="50" y="180" font-size="12.3" fill="#333">C 弯曲半径 ≥ 10 倍电缆外径</text>
  <text x="50" y="198" font-size="12.3" fill="#333">　 防止弯伤绝缘与导体</text>
  <text x="50" y="222" font-size="12.3" fill="#333">E 管口加护圈防割伤绝缘</text>

  <rect x="334" y="48" width="292" height="196" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="480" y="72" font-size="13" fill="#c33" font-weight="bold" text-anchor="middle">✗ D 管内接头方便检修</text>
  <text x="350" y="96" font-size="12.3" fill="#333">管内空间受拉又受潮</text>
  <text x="350" y="118" font-size="12.3" fill="#333">接头在管内根本无法检修</text>
  <text x="350" y="140" font-size="12.3" fill="#333">拉线时会把接头拉断</text>
  <text x="350" y="166" font-size="12" fill="#c33">目的三件事：保护绝缘</text>
  <text x="350" y="184" font-size="12" fill="#c33">　　　　　　检修可达</text>
  <text x="350" y="202" font-size="12" fill="#c33">　　　　　　可追溯</text>
  <text x="350" y="226" font-size="11.5" fill="#777">D 与「检修可达」直接冲突</text>

  <rect x="34" y="258" width="592" height="58" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.8"/>
  <text x="50" y="280" font-size="12.3" fill="#333">穿管前：清管、去毛刺、加护口 → 穿线：不硬拽、不扭结 → 穿后：两端挂牌</text>
  <text x="50" y="300" font-size="11.5" fill="#777">护圈与弯径都是为了同一件事：不让绝缘在穿线过程中受损</text>
  <rect x="30" y="328" width="600" height="58" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="350" font-size="12.3" fill="#7a5c00">记忆：无接头、挂标识、弯径 10D、管口护圈——四要素都能回到「保护绝缘、检修可达、可追溯」。</text>
  <text x="46" y="371" font-size="12.3" fill="#7a5c00">误诊提醒：认为「管内接头方便日后检修」是把不可达误当可达。</text>
</svg>