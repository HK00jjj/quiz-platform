<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">多地控制——起动常开「并联」、停止常闭「串联」</text>
  <!-- 母线 -->
  <line x1="70" y1="60" x2="70" y2="240" stroke="#c33" stroke-width="2.5"/>
  <text x="52" y="56" font-size="12" fill="#c33" font-weight="bold">L1</text>
  <line x1="590" y1="60" x2="590" y2="240" stroke="#2F5FD0" stroke-width="2.5"/>
  <text x="596" y="56" font-size="12" fill="#2F5FD0" font-weight="bold">N</text>
  <!-- 停止串联段 -->
  <line x1="70" y1="140" x2="112" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="112" y1="126" x2="112" y2="154" stroke="#2a7a2a" stroke-width="2.5"/>
  <line x1="126" y1="126" x2="126" y2="154" stroke="#2a7a2a" stroke-width="2.5"/>
  <line x1="104" y1="160" x2="134" y2="118" stroke="#2a7a2a" stroke-width="1.5"/>
  <line x1="126" y1="140" x2="192" y2="140" stroke="#333" stroke-width="2"/>
  <text x="119" y="114" font-size="11" text-anchor="middle" fill="#2a7a2a" font-weight="bold">SB₁ 常闭（甲地停）</text>
  <line x1="192" y1="126" x2="192" y2="154" stroke="#2a7a2a" stroke-width="2.5"/>
  <line x1="206" y1="126" x2="206" y2="154" stroke="#2a7a2a" stroke-width="2.5"/>
  <line x1="184" y1="160" x2="214" y2="118" stroke="#2a7a2a" stroke-width="1.5"/>
  <line x1="206" y1="140" x2="252" y2="140" stroke="#333" stroke-width="2"/>
  <text x="199" y="114" font-size="11" text-anchor="middle" fill="#2a7a2a" font-weight="bold">SB₃ 常闭（乙地停）</text>
  <circle cx="252" cy="140" r="3.5" fill="#333"/>
  <!-- 起动并联段 -->
  <line x1="252" y1="140" x2="252" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="252" y1="140" x2="252" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="252" y1="100" x2="296" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="296" y1="86" x2="296" y2="114" stroke="#333" stroke-width="2.5"/>
  <line x1="310" y1="86" x2="310" y2="114" stroke="#333" stroke-width="2.5"/>
  <line x1="310" y1="100" x2="346" y2="100" stroke="#333" stroke-width="2"/>
  <text x="303" y="78" font-size="11" text-anchor="middle" fill="#555">SB₂ 常开（甲地起）</text>
  <line x1="252" y1="180" x2="296" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="296" y1="166" x2="296" y2="194" stroke="#333" stroke-width="2.5"/>
  <line x1="310" y1="166" x2="310" y2="194" stroke="#333" stroke-width="2.5"/>
  <line x1="310" y1="180" x2="346" y2="180" stroke="#333" stroke-width="2"/>
  <text x="303" y="212" font-size="11" text-anchor="middle" fill="#555">SB₄ 常开（乙地起）</text>
  <line x1="346" y1="100" x2="346" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="346" y1="180" x2="346" y2="140" stroke="#333" stroke-width="2"/>
  <circle cx="346" cy="140" r="3.5" fill="#333"/>
  <line x1="346" y1="140" x2="456" y2="140" stroke="#333" stroke-width="2"/>
  <rect x="456" y="122" width="52" height="36" rx="6" fill="#fff8ec" stroke="#b8860b" stroke-width="2"/>
  <text x="482" y="145" font-size="12.5" text-anchor="middle" fill="#7a5c00" font-weight="bold">KM</text>
  <line x1="508" y1="140" x2="590" y2="140" stroke="#333" stroke-width="2"/>
  <!-- 要点 -->
  <rect x="40" y="222" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="242" font-size="12.5" fill="#7a5c00">多地起动按钮「常开并联」：任一处按下都能接通线圈（逻辑或）；多地停止按钮「常闭串联」。</text>
  <text x="20" y="288" font-size="12" fill="#888">任一处按下停止常闭即断开回路（逻辑与）；三地及以上同理推广。</text>
  <text x="20" y="316" font-size="12" fill="#888">记忆点：起动并常开，停止串常闭。</text>
</svg>
