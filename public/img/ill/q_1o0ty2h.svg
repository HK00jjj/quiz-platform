<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">正反转互锁——必须用「常闭」辅助触头串入对方线圈回路</text>
  <!-- 母线 -->
  <line x1="70" y1="60" x2="70" y2="240" stroke="#c33" stroke-width="2.5"/>
  <text x="52" y="56" font-size="12" fill="#c33" font-weight="bold">L1</text>
  <line x1="590" y1="60" x2="590" y2="240" stroke="#2F5FD0" stroke-width="2.5"/>
  <text x="596" y="56" font-size="12" fill="#2F5FD0" font-weight="bold">N</text>
  <!-- 支路1：KM1 -->
  <line x1="70" y1="110" x2="112" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="112" y1="96" x2="112" y2="124" stroke="#c33" stroke-width="2.5"/>
  <line x1="126" y1="96" x2="126" y2="124" stroke="#c33" stroke-width="2.5"/>
  <line x1="104" y1="130" x2="134" y2="88" stroke="#c33" stroke-width="1.8"/>
  <line x1="126" y1="110" x2="262" y2="110" stroke="#333" stroke-width="2"/>
  <text x="119" y="84" font-size="11" text-anchor="middle" fill="#c33" font-weight="bold">KM₂ 常闭（互锁）</text>
  <line x1="262" y1="96" x2="262" y2="124" stroke="#333" stroke-width="2.5"/>
  <line x1="276" y1="96" x2="276" y2="124" stroke="#333" stroke-width="2.5"/>
  <line x1="276" y1="110" x2="456" y2="110" stroke="#333" stroke-width="2"/>
  <text x="269" y="84" font-size="11" text-anchor="middle" fill="#555">SB₂（正转起动）</text>
  <rect x="456" y="92" width="52" height="36" rx="6" fill="#fff8ec" stroke="#b8860b" stroke-width="2"/>
  <text x="482" y="115" font-size="12.5" text-anchor="middle" fill="#7a5c00" font-weight="bold">KM1</text>
  <line x1="508" y1="110" x2="590" y2="110" stroke="#333" stroke-width="2"/>
  <!-- 支路2：KM2 -->
  <line x1="70" y1="200" x2="112" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="112" y1="186" x2="112" y2="214" stroke="#2F5FD0" stroke-width="2.5"/>
  <line x1="126" y1="186" x2="126" y2="214" stroke="#2F5FD0" stroke-width="2.5"/>
  <line x1="104" y1="220" x2="134" y2="178" stroke="#2F5FD0" stroke-width="1.8"/>
  <line x1="126" y1="200" x2="262" y2="200" stroke="#333" stroke-width="2"/>
  <text x="119" y="174" font-size="11" text-anchor="middle" fill="#2F5FD0" font-weight="bold">KM₁ 常闭（互锁）</text>
  <line x1="262" y1="186" x2="262" y2="214" stroke="#333" stroke-width="2.5"/>
  <line x1="276" y1="186" x2="276" y2="214" stroke="#333" stroke-width="2.5"/>
  <line x1="276" y1="200" x2="456" y2="200" stroke="#333" stroke-width="2"/>
  <text x="269" y="174" font-size="11" text-anchor="middle" fill="#555">SB₃（反转起动）</text>
  <rect x="456" y="182" width="52" height="36" rx="6" fill="#fff8ec" stroke="#b8860b" stroke-width="2"/>
  <text x="482" y="205" font-size="12.5" text-anchor="middle" fill="#7a5c00" font-weight="bold">KM2</text>
  <line x1="508" y1="200" x2="590" y2="200" stroke="#333" stroke-width="2"/>
  <!-- 要点 -->
  <rect x="40" y="222" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="242" font-size="12.5" fill="#7a5c00">互锁原理：KM1 吸合 → 其常闭触头断开 → KM2 线圈回路被切断，两只接触器不可能同时吸合。</text>
  <text x="20" y="288" font-size="12" fill="#a33">✗ 若误将 KM1「常开」串入 KM2 回路：KM1 吸合后反而为 KM2 提供通路 → 失去互锁，可能同时吸合短路！</text>
  <text x="20" y="316" font-size="12" fill="#888">记忆点：互锁用常闭，串联对方线圈回路。</text>
</svg>
