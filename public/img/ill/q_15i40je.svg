<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">正序系统的相量关系：Uab 与 Ucb 相差 60°</text>
  <!-- 相量图 -->
  <g transform="translate(240,210)">
    <!-- 参考圆 -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- 三相相电压 -->
    <line x1="0" y1="0" x2="110" y2="0" stroke="#c33" stroke-width="3"/>
    <path d="M 110 0 l -12 -5 v 10 z" fill="#c33"/>
    <text x="122" y="4" font-size="13" fill="#c33">Ua</text>
    <line x1="0" y1="0" x2="-55" y2="95.3" stroke="#c33" stroke-width="3"/>
    <path d="M -55 95.3 l 3 -13 l -11 5 z" fill="#c33"/>
    <text x="-70" y="112" font-size="13" fill="#c33">Ub</text>
    <line x1="0" y1="0" x2="-55" y2="-95.3" stroke="#c33" stroke-width="3"/>
    <path d="M -55 -95.3 l -3 13 l 11 -5 z" fill="#c33"/>
    <text x="-84" y="-98" font-size="13" fill="#c33">Uc</text>
    <!-- 线电压 Uab = Ua - Ub : 30° -->
    <line x1="0" y1="0" x2="94.2" y2="54.4" stroke="#2F5FD0" stroke-width="3.5"/>
    <path d="M 94.2 54.4 l -13 -1 l 6 -11 z" fill="#2F5FD0"/>
    <text x="106" y="62" font-size="13" font-weight="bold" fill="#2F5FD0">Uab (30°)</text>
    <!-- 线电压 Ucb = Uc - Ub : 90° -->
    <line x1="0" y1="0" x2="0" y2="-112.6" stroke="#2a7a2a" stroke-width="3.5"/>
    <path d="M 0 -112.6 l -5 12 l 10 0 z" fill="#2a7a2a"/>
    <text x="-46" y="-118" font-size="13" font-weight="bold" fill="#2a7a2a">Ucb (90°)</text>
    <!-- 60° 角标注 -->
    <path d="M 54.4 31.4 A 63 63 0 0 1 0 -63" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="30" y="-24" font-size="13" font-weight="bold" fill="#555">60°</text>
  </g>
  <!-- 右侧说明 -->
  <rect x="420" y="70" width="220" height="200" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="436" y="96" font-size="12.5" font-weight="bold" fill="#7a5c00">判据要点：</text>
  <text x="436" y="120" font-size="12" fill="#7a5c00">正序时以 Uab 为参考，</text>
  <text x="436" y="140" font-size="12" fill="#7a5c00">Ucb 恒超前 60°；</text>
  <text x="436" y="164" font-size="12" fill="#7a5c00">二次回路极性或相别接反，</text>
  <text x="436" y="184" font-size="12" fill="#7a5c00">该角度关系立刻破坏；</text>
  <text x="436" y="208" font-size="12" fill="#7a5c00">投运前用相位表实测核对，</text>
  <text x="436" y="228" font-size="12" fill="#7a5c00">不符先查相序与接线，</text>
  <text x="436" y="248" font-size="12" fill="#7a5c00">不能上来就换 PT。</text>
  <text x="20" y="344" font-size="12" fill="#888">要点：相量图是二次核相的通用语言——先算关系、再实测比对，角度异常即暴露极性/相别错误。</text>
</svg>
