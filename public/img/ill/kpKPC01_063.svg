<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr63" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="330" y="30" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">接地装置与接地电阻要求示意</text>

  <!-- 设备 -->
  <rect x="120" y="70" width="130" height="80" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="185" cy="108" r="20" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="185" y="115" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
  <text x="66" y="115" font-size="14" fill="#1a1a1a">设备</text>
  <line x1="100" y1="110" x2="116" y2="110" stroke="#333333" stroke-width="1.5" marker-end="url(#arr63)"/>

  <!-- 接地线（地面以上） -->
  <line x1="185" y1="150" x2="185" y2="296" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="185" y1="215" x2="185" y2="250" stroke="#333333" stroke-width="2.5" marker-end="url(#arr63)"/>
  <text x="200" y="232" font-size="14" fill="#1a1a1a">接地线</text>
  <text x="158" y="242" font-size="14" fill="#333333">I</text>

  <!-- 大地表面 -->
  <line x1="60" y1="280" x2="600" y2="280" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="90" y1="280" x2="80" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="150" y1="280" x2="140" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="280" x2="240" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="320" y1="280" x2="310" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="280" x2="390" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="480" y1="280" x2="470" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="560" y1="280" x2="550" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="606" y="286" font-size="14" fill="#1a1a1a">大地</text>

  <!-- 接地体（埋地金属导体） -->
  <rect x="130" y="296" width="110" height="12" fill="#1a1a1a"/>
  <line x1="258" y1="316" x2="240" y2="305" stroke="#333333" stroke-width="1.5" marker-end="url(#arr63)"/>
  <text x="262" y="322" font-size="14" fill="#1a1a1a">接地体</text>

  <!-- 泄流弧线 -->
  <path d="M 150 330 Q 185 344 220 330" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr63)"/>
  <path d="M 160 346 Q 185 356 210 346" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arr63)"/>

  <!-- 接地电阻要求框 -->
  <rect x="360" y="80" width="270" height="150" rx="8" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="495" y="112" font-size="16" fill="#1a1a1a" text-anchor="middle">接地电阻 R</text>
  <text x="495" y="160" font-size="28" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R ＜ 4Ω</text>
  <text x="495" y="196" font-size="14" fill="#333333" text-anchor="middle">按规定接地电阻通常应小于 4Ω</text>
  <text x="495" y="218" font-size="14" fill="#333333" text-anchor="middle">阻值越小，漏电电流泄放越快</text>

  <!-- 组成说明 -->
  <rect x="90" y="352" width="480" height="36" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="330" y="376" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">接地装置 = 接地线 + 接地体</text>
</svg>
