<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr67" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="330" y="30" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">接零与接地连接对象的区别示意</text>

  <!-- 中间分隔线 -->
  <line x1="330" y1="52" x2="330" y2="330" stroke="#333333" stroke-width="1.5" stroke-dasharray="7,5"/>

  <!-- 左栏：接地 -->
  <text x="165" y="66" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">接地</text>
  <rect x="110" y="110" width="110" height="70" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="165" cy="145" r="18" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="165" y="152" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
  <line x1="165" y1="180" x2="165" y2="266" stroke="#1a1a1a" stroke-width="3"/>
  <text x="176" y="230" font-size="13" fill="#333333">接地线</text>
  <line x1="165" y1="266" x2="165" y2="294" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="143" y1="274" x2="187" y2="274" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="151" y1="282" x2="179" y2="282" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="158" y1="290" x2="172" y2="290" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="50" y1="280" x2="310" y2="280" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="80" y1="280" x2="70" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="130" y1="280" x2="120" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="200" y1="280" x2="190" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="280" x2="240" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="295" y1="280" x2="285" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="58" y="316" font-size="14" font-weight="bold" fill="#1a1a1a">连接对象：大地</text>

  <!-- 右栏：接零 -->
  <text x="495" y="66" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">接零</text>
  <line x1="380" y1="100" x2="620" y2="100" stroke="#1a1a1a" stroke-width="3"/>
  <text x="386" y="88" font-size="14" fill="#1a1a1a">N（零线）</text>
  <rect x="440" y="150" width="110" height="70" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="495" cy="185" r="18" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="495" y="192" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
  <line x1="495" y1="150" x2="495" y2="104" stroke="#1a1a1a" stroke-width="3.5"/>
  <circle cx="495" cy="100" r="4.5" fill="#1a1a1a"/>
  <line x1="495" y1="130" x2="495" y2="116" stroke="#333333" stroke-width="2" marker-end="url(#arr67)"/>
  <text x="508" y="132" font-size="13" fill="#333333">外壳接零线</text>
  <text x="398" y="248" font-size="14" font-weight="bold" fill="#1a1a1a">连接对象：零线</text>

  <!-- 对比说明 -->
  <rect x="50" y="338" width="560" height="54" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="330" y="360" font-size="14" fill="#1a1a1a" text-anchor="middle">接地：外壳连大地，靠分流泄放漏电电流</text>
  <text x="330" y="382" font-size="14" fill="#1a1a1a" text-anchor="middle">接零：外壳连零线，靠短路电流使熔断器熔断</text>
</svg>
