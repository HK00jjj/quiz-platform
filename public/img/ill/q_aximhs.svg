<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">漏电保护器：电源侧 / 负载侧必须按标注接线</text>
  <!-- RCD 本体 -->
  <rect x="230" y="88" width="200" height="190" rx="12" fill="#fafafa" stroke="#333" stroke-width="2.4"/>
  <text x="330" y="114" font-size="13.5" text-anchor="middle" fill="#222" font-weight="bold">RCD（剩余电流保护器）</text>
  <!-- 零序互感器 -->
  <circle cx="330" cy="170" r="34" fill="none" stroke="#b8860b" stroke-width="3"/>
  <circle cx="330" cy="170" r="20" fill="none" stroke="#b8860b" stroke-width="1.4"/>
  <text x="330" y="226" font-size="11" text-anchor="middle" fill="#b8860b">零序电流互感器（穿四线）</text>
  <!-- 脱扣机构 -->
  <rect x="296" y="240" width="68" height="24" rx="5" fill="#fdecec" stroke="#c33" stroke-width="1.4"/>
  <text x="330" y="257" font-size="11" text-anchor="middle" fill="#c33">脱扣机构</text>
  <!-- 电源侧 -->
  <line x1="290" y1="40" x2="290" y2="88" stroke="#c33" stroke-width="2.6"/>
  <line x1="370" y1="40" x2="370" y2="88" stroke="#2F5FD0" stroke-width="2.6"/>
  <text x="238" y="62" font-size="12" text-anchor="end" fill="#c33" font-weight="bold">L</text>
  <text x="422" y="62" font-size="12" text-anchor="start" fill="#2F5FD0" font-weight="bold">N</text>
  <rect x="244" y="46" width="172" height="24" rx="12" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="330" y="63" font-size="12.5" text-anchor="middle" fill="#2F5FD0" font-weight="bold">电源侧（LINE／上端）</text>
  <!-- 负载侧 -->
  <line x1="290" y1="278" x2="290" y2="326" stroke="#c33" stroke-width="2.6"/>
  <line x1="370" y1="278" x2="370" y2="326" stroke="#2F5FD0" stroke-width="2.6"/>
  <rect x="244" y="296" width="172" height="24" rx="12" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="330" y="313" font-size="12.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">负载侧（LOAD／下端）→ 设备</text>
  <!-- 右侧说明 -->
  <rect x="470" y="88" width="170" height="150" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="555" y="112" font-size="12.5" text-anchor="middle" fill="#555" font-weight="bold">为什么不能倒接？</text>
  <text x="486" y="138" font-size="12" fill="#333">· 电子式 RCD 取样/脱扣回路</text>
  <text x="486" y="158" font-size="12" fill="#333">  按标注方向设计</text>
  <text x="486" y="182" font-size="12" fill="#c33">✗ 倒接 → 拒动或损坏本体</text>
  <text x="486" y="204" font-size="12" fill="#2a7a2a">✓ 严格「电源→电源侧，</text>
  <text x="486" y="222" font-size="12" fill="#2a7a2a">  负载→负载侧」</text>
  <!-- 要点 -->
  <rect x="40" y="332" width="580" height="40" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="357" font-size="12.5" fill="#7a5c00">外壳标有电源侧/负载侧的漏电保护器，安装时按标注区分方向接线（正确做法），不可为省事倒接。</text>
</svg>
