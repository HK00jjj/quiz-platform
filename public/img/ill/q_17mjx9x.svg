<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">时间继电器：延时触点符号（GB 标准）</text>
  <!-- 线圈符号 -->
  <rect x="40" y="70" width="130" height="100" rx="8" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="105" y="94" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c5c1c">线圈符号</text>
  <rect x="80" y="110" width="50" height="34" fill="none" stroke="#333" stroke-width="2"/>
  <text x="105" y="132" font-size="12" text-anchor="middle">KT</text>
  <line x1="105" y1="100" x2="105" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="105" y1="144" x2="105" y2="154" stroke="#333" stroke-width="2"/>
  <!-- 通电延时型 -->
  <rect x="200" y="70" width="220" height="200" rx="8" fill="#eef2fb" stroke="#36c" stroke-width="2"/>
  <text x="310" y="94" font-size="13" text-anchor="middle" font-weight="bold" fill="#234">通电延时型（得电后延时）</text>
  <!-- 延时闭合常开 -->
  <line x1="230" y1="130" x2="270" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="130" x2="340" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="270" y1="130" x2="296" y2="112" stroke="#333" stroke-width="2"/>
  <path d="M 288 138 A 14 14 0 0 1 300 126" fill="none" stroke="#2F5FD0" stroke-width="2"/>
  <text x="240" y="154" font-size="11" fill="#234">延时闭合常开</text>
  <!-- 延时断开常闭 -->
  <line x1="230" y1="200" x2="270" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="200" x2="340" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="270" y1="200" x2="296" y2="182" stroke="#333" stroke-width="2"/>
  <path d="M 288 208 A 14 14 0 0 0 300 196" fill="none" stroke="#2F5FD0" stroke-width="2"/>
  <text x="240" y="224" font-size="11" fill="#234">延时断开常闭</text>
  <text x="310" y="254" font-size="11" text-anchor="middle" fill="#555">伞弧顶向触点运动方向</text>
  <!-- 断电延时型 -->
  <rect x="440" y="70" width="190" height="200" rx="8" fill="#fdf0f0" stroke="#c33" stroke-width="2"/>
  <text x="535" y="94" font-size="13" text-anchor="middle" font-weight="bold" fill="#922">断电延时型（失电后延时复位）</text>
  <line x1="470" y1="130" x2="510" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="540" y1="130" x2="580" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="510" y1="130" x2="536" y2="148" stroke="#333" stroke-width="2"/>
  <path d="M 518 122 A 14 14 0 0 0 530 134" fill="none" stroke="#c33" stroke-width="2"/>
  <text x="480" y="154" font-size="11" fill="#922">延时断开常开</text>
  <line x1="470" y1="200" x2="510" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="540" y1="200" x2="580" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="510" y1="200" x2="536" y2="218" stroke="#333" stroke-width="2"/>
  <path d="M 518 192 A 14 14 0 0 1 530 204" fill="none" stroke="#c33" stroke-width="2"/>
  <text x="480" y="224" font-size="11" fill="#922">延时闭合常闭</text>
  <text x="20" y="306" font-size="12.5" fill="#333">记忆口诀：通电延时「得电慢半拍」，断电延时「失电慢半拍」；弧顶方向 = 延时的运动方向。</text>
  <text x="20" y="330" font-size="12" fill="#888">要点：选型先看控制逻辑需要哪种延时（顺序启动多用通电延时；断电延时常见于失电保持动作）。</text>
</svg>
