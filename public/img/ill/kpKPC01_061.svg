<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr61" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="330" y="30" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">绝缘鞋在两相触电中不起保护作用的示意</text>

  <!-- 两根相线 -->
  <line x1="120" y1="66" x2="540" y2="66" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="120" y1="112" x2="540" y2="112" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="245" cy="66" r="4" fill="#1a1a1a"/>
  <circle cx="415" cy="112" r="4" fill="#1a1a1a"/>
  <text x="120" y="56" font-size="14" fill="#1a1a1a">相线 L1</text>
  <text x="480" y="102" font-size="14" fill="#1a1a1a">相线 L2</text>

  <!-- 线电压标注 -->
  <line x1="160" y1="70" x2="160" y2="108" stroke="#333333" stroke-width="2" marker-start="url(#arr61)" marker-end="url(#arr61)"/>
  <text x="80" y="95" font-size="15" font-weight="bold" fill="#1a1a1a">U=380V</text>

  <!-- 人体 -->
  <circle cx="330" cy="162" r="15" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="330" y1="177" x2="330" y2="240" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="330" y1="190" x2="245" y2="70" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="330" y1="190" x2="415" y2="116" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="330" y1="240" x2="302" y2="296" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="330" y1="240" x2="358" y2="296" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- 电流路径箭头：L1→手→躯干→手→L2 -->
  <line x1="295" y1="138" x2="318" y2="176" stroke="#333333" stroke-width="2.5" marker-end="url(#arr61)"/>
  <line x1="330" y1="196" x2="330" y2="228" stroke="#333333" stroke-width="2.5" marker-end="url(#arr61)"/>
  <line x1="356" y1="166" x2="398" y2="124" stroke="#333333" stroke-width="2.5" marker-end="url(#arr61)"/>
  <text x="452" y="152" font-size="14" fill="#333333">电流路径：</text>
  <text x="452" y="174" font-size="14" fill="#333333">相线 L1 → 人体</text>
  <text x="452" y="196" font-size="14" fill="#333333">→ 相线 L2</text>
  <text x="452" y="222" font-size="14" fill="#333333">不经大地</text>

  <!-- 绝缘鞋与绝缘台 -->
  <rect x="288" y="296" width="26" height="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="346" y="296" width="26" height="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="258" y="312" width="144" height="16" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="416" y="326" font-size="14" fill="#1a1a1a">绝缘鞋 / 绝缘台</text>

  <!-- 至大地路径：不通 -->
  <line x1="330" y1="328" x2="330" y2="360" stroke="#333333" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="322" y1="336" x2="338" y2="352" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="338" y1="336" x2="322" y2="352" stroke="#1a1a1a" stroke-width="3"/>
  <text x="348" y="350" font-size="14" fill="#1a1a1a">此路不通</text>

  <!-- 大地 -->
  <line x1="80" y1="360" x2="580" y2="360" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="100" y1="360" x2="90" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="160" y1="360" x2="150" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="220" y1="360" x2="210" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="280" y1="360" x2="270" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="340" y1="360" x2="330" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="360" x2="390" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="460" y1="360" x2="450" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="520" y1="360" x2="510" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="586" y="366" font-size="14" fill="#1a1a1a">大地</text>

  <text x="330" y="392" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">两相触电的电流不经大地，绝缘鞋、绝缘台均不起保护作用</text>
</svg>
