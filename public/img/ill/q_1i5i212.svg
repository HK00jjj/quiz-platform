<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">FX5U 直流输入分组接线（有触点 2 线 / 无触点 PNP 3 线）</text>
  <!-- FX5U 输入区 -->
  <rect x="230" y="60" width="220" height="250" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2.5"/>
  <text x="340" y="86" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c5c1c">FX5U-32MT 输入侧</text>
  <text x="250" y="112" font-size="12" fill="#1c5c1c">第1组 X0~X7（8点）</text>
  <text x="250" y="130" font-size="11" fill="#555">S/S1 ── 独立公共端</text>
  <text x="250" y="168" font-size="12" fill="#1c5c1c">第2组 X10~X17（8点）</text>
  <text x="250" y="186" font-size="11" fill="#555">S/S2 ── 独立公共端</text>
  <text x="250" y="224" font-size="12" fill="#1c5c1c">第3组 X20~X27（8点）</text>
  <text x="250" y="242" font-size="11" fill="#555">S/S3 ── 预留备用</text>
  <text x="340" y="292" font-size="11" text-anchor="middle" fill="#888">各组公共端极性可独立配置</text>
  <!-- 第1组：有触点磁性开关（2线） -->
  <rect x="30" y="86" width="150" height="58" rx="8" fill="#eef2fb" stroke="#36c" stroke-width="2"/>
  <text x="105" y="110" font-size="12" text-anchor="middle" font-weight="bold" fill="#234">有触点磁性开关×8</text>
  <text x="105" y="128" font-size="11" text-anchor="middle" fill="#555">2 线：棕 / 蓝</text>
  <line x1="105" y1="144" x2="105" y2="164" stroke="#8b4513" stroke-width="2.5"/>
  <line x1="105" y1="164" x2="230" y2="104" stroke="#8b4513" stroke-width="2.5"/>
  <text x="132" y="176" font-size="11" fill="#8b4513">棕→X，蓝→0V？</text>
  <!-- 第1组接法标注框 -->
  <rect x="30" y="190" width="170" height="76" rx="6" fill="#fff8ec" stroke="#b8860b" stroke-width="1.2"/>
  <text x="42" y="210" font-size="11" fill="#7a5c00">有触点开关无极性；</text>
  <text x="42" y="226" font-size="11" fill="#7a5c00">S/S1 接 +24V → 源型：</text>
  <text x="42" y="242" font-size="11" fill="#7a5c00">开关串在 X 与 0V 之间，</text>
  <text x="42" y="258" font-size="11" fill="#7a5c00">导通时电流流入 X。</text>
  <!-- 第2组：无触点 PNP 3线 -->
  <rect x="480" y="86" width="150" height="58" rx="8" fill="#fdf0f0" stroke="#c33" stroke-width="2"/>
  <text x="555" y="110" font-size="12" text-anchor="middle" font-weight="bold" fill="#922">无触点磁性开关×2</text>
  <text x="555" y="128" font-size="11" text-anchor="middle" fill="#555">3 线 PNP：棕/蓝/黑</text>
  <line x1="555" y1="144" x2="555" y2="164" stroke="#222" stroke-width="2.5"/>
  <line x1="555" y1="164" x2="450" y2="160" stroke="#222" stroke-width="2.5"/>
  <text x="480" y="156" font-size="11" fill="#222">黑(OUT)→X10</text>
  <rect x="480" y="190" width="160" height="76" rx="6" fill="#fff8ec" stroke="#b8860b" stroke-width="1.2"/>
  <text x="490" y="210" font-size="11" fill="#7a5c00">PNP 导通输出 +24V；</text>
  <text x="490" y="226" font-size="11" fill="#7a5c00">S/S2 接 0V → 漏型：</text>
  <text x="490" y="242" font-size="11" fill="#7a5c00">棕→+24V、蓝→0V、</text>
  <text x="490" y="258" font-size="11" fill="#7a5c00">黑→X，电流流入 X。</text>
  <!-- 电源 -->
  <rect x="240" y="320" width="200" height="40" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="345" font-size="12" text-anchor="middle" fill="#333">DC24V 电源（+24V / 0V）</text>
  <text x="20" y="374" font-size="12" fill="#888">要点：分组=分极性；有触点走一组、PNP 走另一组；输入阻抗 4.3kΩ 时校核 2 线开关漏电流与 ON/OFF 电流阈值。</text>
</svg>
