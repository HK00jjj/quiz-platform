<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#ffffff"/>

  <!-- 电路回路 -->
  <line x1="110" y1="105" x2="305" y2="105" stroke="#333333" stroke-width="2"/>
  <line x1="305" y1="105" x2="305" y2="295" stroke="#333333" stroke-width="2"/>
  <line x1="305" y1="295" x2="110" y2="295" stroke="#333333" stroke-width="2"/>
  <line x1="110" y1="215" x2="110" y2="295" stroke="#333333" stroke-width="2"/>
  <line x1="110" y1="160" x2="110" y2="105" stroke="#333333" stroke-width="2"/>
  <line x1="110" y1="180" x2="110" y2="160" stroke="#333333" stroke-width="2"/>
  <line x1="110" y1="215" x2="110" y2="195" stroke="#333333" stroke-width="2"/>

  <!-- 电源（长短线对） -->
  <line x1="90" y1="180" x2="130" y2="180" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="195" x2="120" y2="195" stroke="#333333" stroke-width="2.5"/>
  <text x="132" y="177" font-size="14" fill="#333333">＋</text>
  <text x="132" y="214" font-size="14" fill="#333333">−</text>
  <text x="68" y="193" font-size="16" font-style="italic" font-weight="bold" fill="#111111">E</text>

  <!-- 电阻 R1（顶边）、R2（底边） -->
  <rect x="150" y="93" width="60" height="24" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="180" y="85" font-size="15" font-style="italic" text-anchor="middle" fill="#111111">R1</text>
  <rect x="150" y="283" width="60" height="24" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="155" y="330" font-size="15" font-style="italic" fill="#111111">R2</text>

  <!-- 节点 a、b -->
  <circle cx="255" cy="105" r="4" fill="#333333"/>
  <text x="255" y="93" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">a</text>
  <text x="283" y="93" font-size="15" font-style="italic" fill="#111111">Va</text>
  <circle cx="305" cy="200" r="4" fill="#333333"/>
  <text x="320" y="196" font-size="15" font-weight="bold" fill="#111111">b</text>
  <text x="320" y="222" font-size="15" font-style="italic" fill="#111111">Vb</text>

  <!-- 参考点 o 与接地符号 -->
  <circle cx="240" cy="295" r="4" fill="#333333"/>
  <text x="240" y="285" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">o</text>
  <line x1="240" y1="299" x2="240" y2="320" stroke="#333333" stroke-width="2"/>
  <line x1="226" y1="320" x2="254" y2="320" stroke="#333333" stroke-width="2"/>
  <line x1="232" y1="326" x2="248" y2="326" stroke="#333333" stroke-width="2"/>
  <line x1="236" y1="332" x2="244" y2="332" stroke="#333333" stroke-width="2"/>
  <text x="262" y="330" font-size="15" font-weight="bold" fill="#111111">0V</text>

  <!-- 电流箭头 -->
  <polygon points="130,100 160,100 160,96 174,105 160,114 160,110 130,110" fill="#333333" transform="translate(0,-5)"/>

  <!-- 右侧说明框 -->
  <rect x="390" y="75" width="245" height="225" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="512" y="107" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">电位的前提</text>
  <line x1="405" y1="125" x2="620" y2="125" stroke="#999999" stroke-width="1"/>
  <text x="512" y="155" font-size="15" text-anchor="middle" fill="#111111">① 电位是相对量</text>
  <text x="512" y="190" font-size="15" text-anchor="middle" fill="#111111">② 求电位前必须先选定</text>
  <text x="512" y="218" font-size="15" text-anchor="middle" fill="#111111">　 零电位基准点（0V）</text>
  <text x="512" y="253" font-size="15" text-anchor="middle" fill="#111111">③ 基准点不同，各点</text>
  <text x="512" y="281" font-size="15" text-anchor="middle" fill="#111111">　 电位数值随之不同</text>

  <!-- 底部结论 -->
  <text x="330" y="368" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">先选定零电位基准点，才能确定各点电位</text>
</svg>
