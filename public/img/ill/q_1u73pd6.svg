<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">通电试车顺序：先试控制电路 → 后试主电路</text>
  <!-- 流程图 -->
  <rect x="40" y="58" width="240" height="44" rx="8" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.8"/>
  <text x="160" y="86" font-size="13.5" text-anchor="middle" fill="#2F5FD0" font-weight="bold">① 空操作（控制电路）</text>
  <text x="160" y="104" font-size="11" fill="#888">不接电动机，只试接触器动作</text>
  <line x1="160" y1="102" x2="160" y2="118" stroke="#2a7a2a" stroke-width="2"/>
  <polygon points="154,116 166,116 160,126" fill="#2a7a2a"/>
  <rect x="40" y="128" width="240" height="44" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="160" y="156" font-size="13.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ 控制电路动作正常？</text>
  <text x="160" y="176" font-size="11" fill="#555">吸合/释放/自锁/互锁逻辑全检查</text>
  <line x1="160" y1="172" x2="160" y2="188" stroke="#2a7a2a" stroke-width="2"/>
  <polygon points="154,186 166,186 160,196" fill="#2a7a2a"/>
  <rect x="40" y="198" width="240" height="44" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="160" y="226" font-size="13.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">② 主电路送电 → 电动机试转</text>
  <text x="160" y="248" font-size="11" fill="#555">控制电路确认正常后再带负载</text>
  <line x1="280" y1="220" x2="330" y2="220" stroke="#2a7a2a" stroke-width="2"/>
  <polygon points="328,214 328,226 340,220" fill="#2a7a2a"/>
  <text x="350" y="226" font-size="12" fill="#2a7a2a" font-weight="bold">规范步骤 ✓</text>
  <!-- 右：为什么 -->
  <rect x="360" y="58" width="260" height="180" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="490" y="82" font-size="13" text-anchor="middle" fill="#c33" font-weight="bold">✗ 如果反过来（先试主电路）</text>
  <text x="378" y="108" font-size="12" fill="#c33">· 控制电路有故障 → 无法切除主电路</text>
  <text x="378" y="132" font-size="12" fill="#c33">· 电动机直通电源 → 失控运行</text>
  <text x="378" y="156" font-size="12" fill="#c33">· 过载/短路时保护电路不能切断</text>
  <text x="378" y="188" font-size="12" fill="#888">控制电路是主电路的「安全闸」——</text>
  <text x="378" y="210" font-size="12" fill="#888">闸没修好就开水，后果不堪设想</text>
  <!-- 要点 -->
  <rect x="30" y="252" width="600" height="90" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="274" font-size="12.5" fill="#7a5c00">规范依据：通电试车时先空操作控制电路——确认接触器吸合/释放/自锁/互锁逻辑正常后，</text>
  <text x="46" y="296" font-size="12.5" fill="#7a5c00">再接通主电路带电动机试转。这样在主电路故障时，控制电路才能安全可靠地将其切除。</text>
  <text x="46" y="318" font-size="12" fill="#7a5c00">口诀：先空后载、先控后主——闸修好再开水。</text>
  <text x="20" y="356" font-size="12" fill="#888">附加价值：控制电路先试可以「空载」发现接线错误，避免电动机误动作造成设备或人身损害。</text>
</svg>
