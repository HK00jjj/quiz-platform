<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">SET / RST 的操作元件范围：RST 还能清 D 与 V/Z</text>
  <!-- SET 卡 -->
  <rect x="40" y="62" width="270" height="150" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="175" y="90" font-size="15" text-anchor="middle" fill="#2a7a2a" font-weight="bold">SET（置位：自保持 ON）</text>
  <line x1="60" y1="104" x2="290" y2="104" stroke="#cfe3d3" stroke-width="1.4"/>
  <rect x="66" y="118" width="64" height="34" rx="6" fill="#fff" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="98" y="140" font-size="14" text-anchor="middle" fill="#2a7a2a" font-weight="bold">Y</text>
  <rect x="142" y="118" width="64" height="34" rx="6" fill="#fff" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="174" y="140" font-size="14" text-anchor="middle" fill="#2a7a2a" font-weight="bold">M</text>
  <rect x="218" y="118" width="64" height="34" rx="6" fill="#fff" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="250" y="140" font-size="14" text-anchor="middle" fill="#2a7a2a" font-weight="bold">S</text>
  <text x="175" y="176" font-size="12.5" text-anchor="middle" fill="#555">输出继电器 / 辅助继电器 / 状态继电器</text>
  <text x="175" y="198" font-size="12" text-anchor="middle" fill="#888">（置位后保持 ON，直到被 RST 复位）</text>
  <!-- RST 卡 -->
  <rect x="350" y="62" width="270" height="150" rx="10" fill="#f4f7ff" stroke="#2F5FD0" stroke-width="1.8"/>
  <text x="485" y="90" font-size="15" text-anchor="middle" fill="#2F5FD0" font-weight="bold">RST（复位 / 清零，范围更广）</text>
  <line x1="370" y1="104" x2="600" y2="104" stroke="#d6def5" stroke-width="1.4"/>
  <rect x="366" y="118" width="52" height="34" rx="6" fill="#fff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="392" y="140" font-size="14" text-anchor="middle" fill="#2F5FD0" font-weight="bold">Y</text>
  <rect x="424" y="118" width="52" height="34" rx="6" fill="#fff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="450" y="140" font-size="14" text-anchor="middle" fill="#2F5FD0" font-weight="bold">M</text>
  <rect x="482" y="118" width="52" height="34" rx="6" fill="#fff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="508" y="140" font-size="14" text-anchor="middle" fill="#2F5FD0" font-weight="bold">S</text>
  <rect x="540" y="114" width="66" height="42" rx="6" fill="#fff8ec" stroke="#b8860b" stroke-width="2.2"/>
  <text x="573" y="140" font-size="14" text-anchor="middle" fill="#7a5c00" font-weight="bold">D</text>
  <text x="560" y="176" font-size="12.5" text-anchor="middle" fill="#7a5c00" font-weight="bold">＋ V / Z（变址寄存器）</text>
  <text x="470" y="198" font-size="12" text-anchor="middle" fill="#888">D：数据寄存器——可清零其内容</text>
  <!-- 对比结论 -->
  <rect x="40" y="228" width="580" height="64" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="56" y="250" font-size="12.5" fill="#c33">题干称：「RST 的操作元件仅为 Y 和 M，不能用于清除数据寄存器 D」</text>
  <text x="56" y="274" font-size="13" fill="#c33" font-weight="bold">✗ 说法错误：源文明确 RST 操作元件含 D（还可清定时器/计数器、V/Z 内容）。</text>
  <!-- 要点 -->
  <rect x="40" y="304" width="580" height="56" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="325" font-size="12.5" fill="#7a5c00">记忆点：SET 只管「位元件」（Y/M/S）；RST 除了位元件，还能清「字元件」（D、V/Z）。</text>
  <text x="56" y="347" font-size="12.5" fill="#7a5c00">判据：看到「RST 不能清 D」→ 直接判错；看到「SET 也能清 D」→ 同样判错。</text>
</svg>
