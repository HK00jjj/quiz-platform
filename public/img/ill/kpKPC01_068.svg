<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr68" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="330" y="30" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">含接地符号的简单电路，接地处标注电位 0V</text>

  <!-- 回路：电池（左） -->
  <line x1="200" y1="110" x2="200" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="178" y1="185" x2="222" y2="185" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="190" y1="200" x2="210" y2="200" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="200" y1="200" x2="200" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <text x="164" y="180" font-size="15" fill="#1a1a1a">+</text>
  <text x="150" y="198" font-size="15" fill="#1a1a1a">E</text>

  <!-- 开关（顶） -->
  <line x1="200" y1="110" x2="300" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="302" cy="110" r="3.5" fill="#1a1a1a"/>
  <circle cx="338" cy="110" r="3.5" fill="#1a1a1a"/>
  <line x1="305" y1="110" x2="336" y2="94" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="338" y1="110" x2="460" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <text x="298" y="84" font-size="14" fill="#1a1a1a">开关 S</text>

  <!-- 电阻（右） -->
  <line x1="460" y1="110" x2="460" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="445" y="170" width="30" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="460" y1="230" x2="460" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <text x="482" y="206" font-size="15" fill="#1a1a1a">R</text>

  <!-- 底边 -->
  <line x1="200" y1="290" x2="460" y2="290" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 电流方向 -->
  <line x1="246" y1="110" x2="276" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arr68)"/>
  <text x="254" y="98" font-size="15" fill="#1a1a1a">I</text>

  <!-- 接地符号与 0V -->
  <line x1="330" y1="290" x2="330" y2="320" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="308" y1="298" x2="352" y2="298" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="316" y1="306" x2="344" y2="306" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="323" y1="314" x2="337" y2="314" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="360" y="316" font-size="19" font-weight="bold" fill="#1a1a1a">V = 0V</text>

  <!-- 说明 -->
  <rect x="100" y="338" width="460" height="50" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="330" y="358" font-size="14" fill="#1a1a1a" text-anchor="middle">凡标注接地符号之处，无论位于电路哪一处，电位一律规定为 0V</text>
  <text x="330" y="379" font-size="14" fill="#333333" text-anchor="middle">接地符号处是全电路电位比较的参考点</text>
</svg>
