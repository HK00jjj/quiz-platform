<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">单向起停控制——松手仍转靠「自锁」：KM 常开辅助触头并联 SB₂</text>
  <!-- 母线 -->
  <line x1="70" y1="60" x2="70" y2="200" stroke="#c33" stroke-width="2.5"/>
  <text x="52" y="56" font-size="12" fill="#c33" font-weight="bold">L1</text>
  <line x1="590" y1="60" x2="590" y2="200" stroke="#2F5FD0" stroke-width="2.5"/>
  <text x="596" y="56" font-size="12" fill="#2F5FD0" font-weight="bold">N</text>
  <!-- 主支路 -->
  <line x1="70" y1="130" x2="112" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="112" y1="116" x2="112" y2="144" stroke="#333" stroke-width="2.5"/>
  <line x1="126" y1="116" x2="126" y2="144" stroke="#333" stroke-width="2.5"/>
  <line x1="104" y1="150" x2="134" y2="108" stroke="#333" stroke-width="1.5"/>
  <line x1="126" y1="130" x2="192" y2="130" stroke="#333" stroke-width="2"/>
  <text x="119" y="104" font-size="11" text-anchor="middle" fill="#555">FR 常闭</text>
  <line x1="192" y1="116" x2="192" y2="144" stroke="#333" stroke-width="2.5"/>
  <line x1="206" y1="116" x2="206" y2="144" stroke="#333" stroke-width="2.5"/>
  <line x1="184" y1="150" x2="214" y2="108" stroke="#333" stroke-width="1.5"/>
  <line x1="206" y1="130" x2="248" y2="130" stroke="#333" stroke-width="2"/>
  <circle cx="248" cy="130" r="3.5" fill="#333"/>
  <text x="199" y="104" font-size="11" text-anchor="middle" fill="#555">SB₁ 常闭（停止）</text>
  <line x1="248" y1="130" x2="272" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="272" y1="116" x2="272" y2="144" stroke="#333" stroke-width="2.5"/>
  <line x1="286" y1="116" x2="286" y2="144" stroke="#333" stroke-width="2.5"/>
  <line x1="279" y1="130" x2="330" y2="130" stroke="#333" stroke-width="2"/>
  <circle cx="330" cy="130" r="3.5" fill="#333"/>
  <text x="279" y="104" font-size="11" text-anchor="middle" fill="#2a7a2a" font-weight="bold">SB₂ 常开（起动）</text>
  <line x1="330" y1="130" x2="456" y2="130" stroke="#333" stroke-width="2"/>
  <rect x="456" y="112" width="52" height="36" rx="6" fill="#fff8ec" stroke="#b8860b" stroke-width="2"/>
  <text x="482" y="135" font-size="12.5" text-anchor="middle" fill="#7a5c00" font-weight="bold">KM</text>
  <line x1="508" y1="130" x2="590" y2="130" stroke="#333" stroke-width="2"/>
  <!-- 自锁支路 -->
  <line x1="248" y1="130" x2="248" y2="76" stroke="#c33" stroke-width="2"/>
  <line x1="248" y1="76" x2="292" y2="76" stroke="#c33" stroke-width="2"/>
  <line x1="292" y1="62" x2="292" y2="90" stroke="#c33" stroke-width="2.5"/>
  <line x1="308" y1="62" x2="308" y2="90" stroke="#c33" stroke-width="2.5"/>
  <line x1="308" y1="76" x2="330" y2="76" stroke="#c33" stroke-width="2"/>
  <line x1="330" y1="76" x2="330" y2="130" stroke="#c33" stroke-width="2"/>
  <text x="300" y="52" font-size="11" text-anchor="middle" fill="#c33" font-weight="bold">KM 自锁常开触头（并联 SB₂）</text>
  <!-- 要点 -->
  <rect x="40" y="222" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="242" font-size="12.5" fill="#7a5c00">按 SB₂ → KM 吸合 → 电动机转，同时 KM 常开辅助触头闭合「自锁」；松开 SB₂ 线圈经自锁触头继续得电。</text>
  <text x="20" y="288" font-size="12" fill="#888">按 SB₁ 或 FR 过载断开 → KM 失电释放 → 停转（自锁也随之断开）。</text>
  <text x="20" y="316" font-size="12" fill="#888">记忆点：松手仍转靠自锁，辅助常开来保持。</text>
</svg>
