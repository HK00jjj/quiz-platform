<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">绘制电气原理图的规则：元件按「原始状态」画、主左控右</text>
  <!-- 正确：原始状态 -->
  <text x="20" y="62" font-size="14" fill="#2a7a2a" font-weight="bold">✓ 元件状态：按线圈未通电、手柄零位的原始状态画出（D 正确）</text>
  <rect x="30" y="74" width="600" height="88" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <!-- 常开触头（未通电）：断开 -->
  <line x1="60" y1="118" x2="112" y2="118" stroke="#333" stroke-width="2"/>
  <line x1="112" y1="110" x2="112" y2="126" stroke="#333" stroke-width="2.2"/>
  <line x1="126" y1="110" x2="126" y2="126" stroke="#333" stroke-width="2.2"/>
  <line x1="126" y1="118" x2="180" y2="118" stroke="#333" stroke-width="2"/>
  <text x="119" y="102" font-size="11" text-anchor="middle" fill="#2a7a2a">常开触头：画「断开」</text>
  <!-- 常闭触头（未通电）：闭合 -->
  <line x1="220" y1="118" x2="272" y2="118" stroke="#333" stroke-width="2"/>
  <line x1="272" y1="110" x2="272" y2="126" stroke="#333" stroke-width="2.2"/>
  <line x1="286" y1="110" x2="286" y2="126" stroke="#333" stroke-width="2.2"/>
  <line x1="272" y1="107" x2="286" y2="129" stroke="#333" stroke-width="1.6"/>
  <line x1="286" y1="118" x2="340" y2="118" stroke="#333" stroke-width="2"/>
  <text x="279" y="102" font-size="11" text-anchor="middle" fill="#2a7a2a">常闭触头：画「闭合」</text>
  <!-- 线圈未通电 -->
  <rect x="378" y="104" width="52" height="30" rx="5" fill="#fff8ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="404" y="124" font-size="12" text-anchor="middle" fill="#7a5c00" font-weight="bold">KM</text>
  <line x1="340" y1="118" x2="378" y2="118" stroke="#333" stroke-width="2"/>
  <line x1="430" y1="118" x2="600" y2="118" stroke="#333" stroke-width="2"/>
  <text x="515" y="102" font-size="11" text-anchor="middle" fill="#2a7a2a">线圈：画「未通电」状态</text>
  <text x="515" y="146" font-size="11" text-anchor="middle" fill="#555">→ 断电状态的图，一读就知道得电后哪里动作</text>
  <!-- 布局：主左控右 -->
  <text x="20" y="196" font-size="14" fill="#2a7a2a" font-weight="bold">✓ 图面布局：主电路在左、控制电路在右</text>
  <rect x="30" y="208" width="288" height="92" rx="8" fill="#f4f7ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="174" y="230" font-size="12.5" text-anchor="middle" fill="#2F5FD0" font-weight="bold">主电路（左）</text>
  <line x1="70" y1="244" x2="260" y2="244" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="236" x2="90" y2="252" stroke="#333" stroke-width="2"/>
  <line x1="104" y1="236" x2="104" y2="252" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="236" x2="180" y2="252" stroke="#333" stroke-width="2.2"/>
  <line x1="194" y1="236" x2="194" y2="252" stroke="#333" stroke-width="2.2"/>
  <circle cx="240" cy="244" r="13" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="240" y="248" font-size="10" text-anchor="middle" fill="#333">M</text>
  <text x="174" y="284" font-size="11" text-anchor="middle" fill="#555">大电流通路：电源 → 电动机</text>
  <rect x="342" y="208" width="288" height="92" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="486" y="230" font-size="12.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">控制电路（右）</text>
  <line x1="382" y1="266" x2="590" y2="266" stroke="#333" stroke-width="2"/>
  <line x1="410" y1="258" x2="410" y2="274" stroke="#333" stroke-width="2.2"/>
  <line x1="424" y1="258" x2="424" y2="274" stroke="#333" stroke-width="2.2"/>
  <rect x="470" y="252" width="50" height="28" rx="5" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="495" y="271" font-size="11.5" text-anchor="middle" fill="#7a5c00">KM</text>
  <text x="486" y="292" font-size="11" text-anchor="middle" fill="#555">小电流通路：线圈、信号、保护、联锁</text>
  <!-- 常见错项 -->
  <rect x="30" y="314" width="600" height="72" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.5"/>
  <text x="46" y="334" font-size="12.5" fill="#c33">✗ 错项：①「主电路画右、控制电路画左」——反了；</text>
  <text x="46" y="354" font-size="12.5" fill="#c33">②「同一元件各部件必须画在一起不可分开」——那是接线图的画法，原理图按功能可分开；</text>
  <text x="46" y="374" font-size="12.5" fill="#c33">③「连接线、轮廓线均用虚线」——错：连接线与轮廓线一律实线（虚线另有含义）。</text>
</svg>
