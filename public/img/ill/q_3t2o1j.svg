<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">500W 户外景观灯配电：算电流 → 选器件 → 补保护</text>
  <rect x="46" y="48" width="568" height="30" rx="5" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.3"/>
  <text x="58" y="68" font-size="12.3" fill="#2F5FD0">① 工作电流：I = 500 / 220 ≈ 2.3 A</text>
  <rect x="46" y="84" width="568" height="30" rx="5" fill="#fff8ec" stroke="#b8860b" stroke-width="1.3"/>
  <text x="58" y="104" font-size="12.3" fill="#7a5c00">② 断路器：按负载电流 1.2~1.5 倍 → 选 10A C 型（16A 偏大）</text>
  <rect x="46" y="120" width="568" height="30" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="140" font-size="12.3" fill="#555">　 导线：1.5 mm² 铜线（留余量可选 2.5 mm²）</text>
  <rect x="46" y="156" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="176" font-size="12.3" fill="#2a7a2a">③ 户外必须配 30mA 漏电保护器；留 80% 功率余量并校验压降</text>
  <rect x="46" y="198" width="568" height="52" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.4"/>
  <text x="58" y="218" font-size="12.3" fill="#c33">误区：断路器配得越大越安全？——动作电流离负载电流越远，小过流越不动作，</text>
  <text x="58" y="238" font-size="12.3" fill="#c33">过流保护反而被削弱（16A 对 2.3A 的灯具保护偏弱）。</text>
  <rect x="30" y="258" width="600" height="82" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="280" font-size="12.3" fill="#7a5c00">小功率户外回路的选型逻辑：先算电流、再按电流选器件、最后补上强制保护。</text>
  <text x="46" y="301" font-size="12.3" fill="#7a5c00">户外回路的「强制保护」指 30mA 漏电保护；同时要校验线路压降与功率余量（80%）。</text>
</svg>