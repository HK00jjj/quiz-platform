<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">「终端停机 + 人工反向」≠自动往复循环（属半自动控制）</text>
  <!-- 左：半自动（题干描述） -->
  <text x="20" y="60" font-size="14" fill="#2F5FD0" font-weight="bold">① 该电路的实际情况（半自动）</text>
  <rect x="26" y="72" width="296" height="176" rx="8" fill="#f4f7ff" stroke="#2F5FD0" stroke-width="1.5"/>
  <line x1="46" y1="96" x2="46" y2="228" stroke="#c33" stroke-width="2.2"/>
  <text x="38" y="90" font-size="10" fill="#c33" font-weight="bold">L</text>
  <line x1="300" y1="96" x2="300" y2="228" stroke="#2F5FD0" stroke-width="2.2"/>
  <text x="306" y="90" font-size="10" fill="#2F5FD0" font-weight="bold">N</text>
  <!-- 回路：FR → SB1 → SQ1 → SQ2 → KM（正转） -->
  <line x1="46" y1="128" x2="80" y2="128" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="120" x2="80" y2="136" stroke="#333" stroke-width="2.2"/>
  <line x1="94" y1="120" x2="94" y2="136" stroke="#333" stroke-width="2.2"/>
  <line x1="94" y1="128" x2="128" y2="128" stroke="#333" stroke-width="2"/>
  <text x="87" y="114" font-size="9.5" text-anchor="middle" fill="#555">FR</text>
  <line x1="128" y1="120" x2="128" y2="136" stroke="#333" stroke-width="2.2"/>
  <line x1="142" y1="120" x2="142" y2="136" stroke="#333" stroke-width="2.2"/>
  <line x1="128" y1="117" x2="142" y2="139" stroke="#333" stroke-width="1.6"/>
  <line x1="142" y1="128" x2="176" y2="128" stroke="#333" stroke-width="2"/>
  <text x="135" y="114" font-size="9.5" text-anchor="middle" fill="#555">SB1 停止</text>
  <!-- SQ1 SQ2 常闭串接 -->
  <line x1="176" y1="120" x2="176" y2="136" stroke="#2a7a2a" stroke-width="2.3"/>
  <line x1="190" y1="120" x2="190" y2="136" stroke="#2a7a2a" stroke-width="2.3"/>
  <line x1="176" y1="117" x2="190" y2="139" stroke="#2a7a2a" stroke-width="1.7"/>
  <line x1="190" y1="128" x2="222" y2="128" stroke="#333" stroke-width="2"/>
  <text x="183" y="114" font-size="9.5" text-anchor="middle" fill="#2a7a2a">SQ1</text>
  <line x1="222" y1="120" x2="222" y2="136" stroke="#2a7a2a" stroke-width="2.3"/>
  <line x1="236" y1="120" x2="236" y2="136" stroke="#2a7a2a" stroke-width="2.3"/>
  <line x1="222" y1="117" x2="236" y2="139" stroke="#2a7a2a" stroke-width="1.7"/>
  <line x1="236" y1="128" x2="262" y2="128" stroke="#333" stroke-width="2"/>
  <text x="229" y="114" font-size="9.5" text-anchor="middle" fill="#2a7a2a">SQ2</text>
  <rect x="262" y="114" width="34" height="28" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="279" y="133" font-size="10.5" text-anchor="middle" fill="#7a5c00">KM</text>
  <line x1="296" y1="128" x2="300" y2="128" stroke="#333" stroke-width="2"/>
  <text x="174" y="166" font-size="11.5" text-anchor="middle" fill="#555">到达任一终端 → SQ 动断断开 → KM 失电停机</text>
  <rect x="46" y="182" width="256" height="52" rx="6" fill="#fdecec" stroke="#c33" stroke-width="1.4"/>
  <text x="60" y="202" font-size="11.5" fill="#c33">反向起动：必须由人工另按反向按钮</text>
  <text x="60" y="222" font-size="11.5" fill="#c33" font-weight="bold">→ 每次循环都要人守着，属「半自动」</text>
  <!-- 右：自动往复循环 -->
  <text x="380" y="60" font-size="14" fill="#2a7a2a" font-weight="bold">② 真正的自动往复循环</text>
  <rect x="344" y="72" width="288" height="176" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="360" y="96" font-size="11.5" fill="#2a7a2a">· 限位开关改用复合式（一副常闭 + 一副常开）</text>
  <text x="360" y="118" font-size="11.5" fill="#2a7a2a">· 终端常闭断开本向接触器，常开去起动反向接触器</text>
  <text x="360" y="140" font-size="11.5" fill="#2a7a2a">· 反向支路带自锁 + 互锁，到位即自动换向</text>
  <text x="360" y="170" font-size="11.5" fill="#555">工作台：→ 前进 → 撞 SQ1 → 自动后退 →</text>
  <text x="360" y="190" font-size="11.5" fill="#555">撞 SQ2 → 自动前进 … 往复不停</text>
  <text x="360" y="216" font-size="11.5" fill="#2a7a2a" font-weight="bold">✓ 这才叫「自动往复循环」</text>
  <text x="360" y="236" font-size="11" fill="#888">（还需设总停按钮/超程保护）</text>
  <!-- 判定 -->
  <rect x="26" y="258" width="606" height="60" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="42" y="280" font-size="12.5" fill="#c33">题干说「每次起动后能自动反向运行、实现自动往复循环」</text>
  <text x="42" y="302" font-size="13" fill="#c33" font-weight="bold">✗ 不符合事实：仅靠终端停机 + 人工反向，只能往返半自动，不能自动往复。</text>
  <!-- 要点 -->
  <rect x="26" y="328" width="606" height="58" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="42" y="350" font-size="12.5" fill="#7a5c00">判据：看「反向是谁发起的」——人去按＝半自动；由限位开关自动去起动反向＝自动往复循环。</text>
  <text x="42" y="372" font-size="12.5" fill="#7a5c00">考点提醒：行程开关只串一对常闭，只能实现「限位保护/终端停止」，不能实现自动换向。</text>
</svg>
