<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">智能照明调试收尾：导出完整配置 + 线缆设备贴标签（说法正确）</text>
  <rect x="30" y="46" width="290" height="140" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.4"/>
  <text x="44" y="68" font-size="12.5" font-weight="bold" fill="#2a7a2a">必须导出：配置本身就是资产</text>
  <text x="44" y="94" font-size="12.3" fill="#333">· 设备地址表、分组、场景</text>
  <text x="44" y="118" font-size="12.3" fill="#333">· 联动逻辑、参数文件</text>
  <text x="44" y="142" font-size="12.3" fill="#333">· 记录软件版本</text>
  <text x="44" y="168" font-size="11" fill="#777">网关损坏：有备份半小时恢复，无备份全部重来</text>
  <rect x="336" y="46" width="294" height="140" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.4"/>
  <text x="350" y="68" font-size="12.5" font-weight="bold" fill="#7a5c00">必须挂牌：让现场可维护、可扩建</text>
  <text x="350" y="94" font-size="12.3" fill="#333">· 线缆贴去向</text>
  <text x="350" y="118" font-size="12.3" fill="#333">· 设备贴地址</text>
  <text x="350" y="142" font-size="12.3" fill="#333">· 维护与扩建才有依据</text>
  <text x="350" y="168" font-size="11" fill="#777">人员更替后，无标签则无人知道线路去向</text>
  <rect x="30" y="198" width="600" height="78" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="220" font-size="12.3" fill="#7a5c00">正解：备份与挂牌是工程收尾的强制动作，不是可选项。</text>
  <text x="46" y="241" font-size="12.3" fill="#7a5c00">误诊一：认为「调试完能跑就算完工」——把「可运行的现场」当成「已交付的项目」；</text>
  <text x="46" y="262" font-size="12.3" fill="#7a5c00">误诊二：以为备份由软件自动完成——版本、参数、联动逻辑仍需人工导出留档。</text>
</svg>