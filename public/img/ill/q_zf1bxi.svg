<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">双金属片式脱扣器：过载分断后，等 1~3 min 冷却复位再「再扣」</text>
  <!-- 左：结构剖视 -->
  <rect x="50" y="60" width="200" height="220" rx="10" fill="#fafafa" stroke="#888" stroke-width="2"/>
  <text x="150" y="84" font-size="13" text-anchor="middle" fill="#555" font-weight="bold">断路器（QF）内部</text>
  <!-- 进线导体与热元件 -->
  <line x1="70" y1="110" x2="120" y2="110" stroke="#c33" stroke-width="3"/>
  <rect x="120" y="102" width="60" height="16" rx="3" fill="#f2c9a0" stroke="#a05a2c" stroke-width="1.6"/>
  <text x="150" y="98" font-size="11" text-anchor="middle" fill="#a05a2c">热元件（加热）</text>
  <line x1="180" y1="110" x2="228" y2="110" stroke="#c33" stroke-width="3"/>
  <!-- 双金属片（两色两层，弯曲态） -->
  <path d="M 120 132 L 176 132 Q 196 132 204 148" stroke="#8a8a8a" stroke-width="7" fill="none"/>
  <path d="M 120 139 L 176 139 Q 194 139 200 152" stroke="#b5651d" stroke-width="7" fill="none"/>
  <text x="238" y="140" font-size="11" fill="#555">双金属片（两层</text>
  <text x="238" y="155" font-size="11" fill="#555">膨胀系数不同）</text>
  <!-- 脱扣钩与触头 -->
  <line x1="150" y1="176" x2="150" y2="200" stroke="#333" stroke-width="2.4"/>
  <circle cx="150" cy="176" r="4" fill="#333"/>
  <path d="M 150 200 L 138 214 L 162 214 Z" fill="#555"/>
  <text x="196" y="206" font-size="11" fill="#555">扣钩（脱扣器顶开）</text>
  <line x1="98" y1="232" x2="122" y2="232" stroke="#333" stroke-width="2.4"/>
  <line x1="128" y1="224" x2="128" y2="240" stroke="#333" stroke-width="2.4"/>
  <line x1="140" y1="224" x2="140" y2="240" stroke="#333" stroke-width="2.4"/>
  <line x1="140" y1="232" x2="202" y2="232" stroke="#333" stroke-width="2.4"/>
  <text x="150" y="262" font-size="11" text-anchor="middle" fill="#555">触头（过载时被顶开分闸）</text>
  <!-- 右：时序 -->
  <text x="360" y="88" font-size="14" font-weight="bold" fill="#2a7a2a">分断后的规范动作序列</text>
  <rect x="340" y="102" width="270" height="40" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="356" y="127" font-size="12.5" fill="#c33" font-weight="bold">过载分断（双金属片弯曲顶开锁扣）</text>
  <line x1="475" y1="142" x2="475" y2="158" stroke="#888" stroke-width="2"/>
  <polygon points="469,156 481,156 475,166" fill="#888"/>
  <rect x="340" y="168" width="270" height="40" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="356" y="193" font-size="12.5" fill="#7a5c00" font-weight="bold">等待 1~3 min：双金属片冷却复位</text>
  <line x1="475" y1="208" x2="475" y2="224" stroke="#888" stroke-width="2"/>
  <polygon points="469,222 481,222 475,232" fill="#888"/>
  <rect x="340" y="234" width="270" height="40" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="356" y="259" font-size="12.5" fill="#2a7a2a" font-weight="bold">再扣（复位手柄）→ 恢复备用 ✓</text>
  <rect x="340" y="288" width="270" height="42" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.4"/>
  <text x="356" y="306" font-size="12" fill="#c33">✗ 立即再扣：双金属片未复位，</text>
  <text x="356" y="323" font-size="12" fill="#c33">再扣不上或误合造成二次跳闸</text>
  <!-- 要点 -->
  <rect x="40" y="322" width="280" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="342" font-size="12" fill="#7a5c00">过载分断→冷却 1~3 min→再扣，</text>
  <text x="56" y="359" font-size="12" fill="#7a5c00">是规范操作（等双金属片复位）。</text>
</svg>
