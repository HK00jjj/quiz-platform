<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="17.5" fill="#222" font-weight="bold">阀岛最大同时电流：8×0.6 取 5 只 ×0.2 A = 1.0 A</text>
  <rect x="34" y="48" width="300" height="150" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="184" y="72" font-size="13" fill="#555" font-weight="bold" text-anchor="middle">（1）算法</text>
  <text x="52" y="96" font-size="12.3" fill="#333">同时动作只数 = 总数 × 同时系数</text>
  <text x="52" y="118" font-size="12.3" fill="#333">总电流 = 单只电流 × 同时动作只数</text>
  <text x="52" y="144" font-size="12" fill="#2F5FD0">8 × 0.6 = 4.8 只 → 向上取整 5 只</text>
  <text x="52" y="166" font-size="11.5" fill="#777">取整是工程习惯：按最不利并发计</text>
  <text x="52" y="186" font-size="11.5" fill="#777">系数描述并发程度，不是同时率保证</text>

  <rect x="348" y="48" width="278" height="150" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="487" y="72" font-size="13" fill="#2a7a2a" font-weight="bold" text-anchor="middle">（2）（3）计算与结论</text>
  <text x="364" y="96" font-size="13" fill="#333">I = 5 × 0.2 A = 1.0 A</text>
  <text x="364" y="118" font-size="13" fill="#333">电源额定 = 2.0 A ＞ 1.0 A</text>
  <text x="364" y="142" font-size="12.6" fill="#2a7a2a">裕量约 50%，满足要求</text>
  <text x="364" y="164" font-size="12.3" fill="#333">极端 8 只全动：8 × 0.2 = 1.6 A</text>
  <text x="364" y="186" font-size="11.5" fill="#777">1.6 A 仍小于 2 A，电源够用</text>

  <rect x="34" y="212" width="592" height="88" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="50" y="234" font-size="12.5" fill="#c33" font-weight="bold">容量够了不等于选型结束</text>
  <text x="50" y="256" font-size="12.3" fill="#333">还应校核：电源降额（高温/长期满载）、上电冲击电流</text>
  <text x="50" y="278" font-size="12.3" fill="#333">感性负载同时吸合的冲击电流可能数倍于稳态值</text>
  <text x="50" y="296" font-size="11.5" fill="#777">只算稳态电流就下结论，是电源选型最常见的漏项</text>
  <rect x="30" y="314" width="600" height="62" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="336" font-size="12.3" fill="#7a5c00">记忆：总数×系数→向上取整→乘单只电流；再与电源额定比裕量。</text>
  <text x="46" y="357" font-size="12.3" fill="#7a5c00">误诊提醒：忽略上电冲击与降额，会出现「算着够、现场跳闸」。</text>
</svg>