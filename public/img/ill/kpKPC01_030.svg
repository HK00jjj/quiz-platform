<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L8,4 L0,7.5 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="25" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">正弦交流电波形：t = 0.015s 时刻的瞬时值</text>
  <text x="330" y="52" font-size="15" fill="#1a1a1a" text-anchor="middle">T = 0.02s，Um = 10V，初相 0°，求 t = 0.015s 时的瞬时值 u</text>

  <line x1="80" y1="360" x2="80" y2="88" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="80" y1="250" x2="634" y2="250" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="48" y="98" font-size="14" fill="#1a1a1a">u/V</text>
  <text x="618" y="272" font-size="14" fill="#1a1a1a">t/s</text>
  <text x="70" y="268" font-size="13" fill="#1a1a1a">0</text>

  <path d="M80,250 C121.67,85 163.33,85 205,250 C246.67,415 288.33,415 330,250 C371.67,85 413.33,85 455,250 C496.67,415 538.33,415 580,250" fill="none" stroke="#333333" stroke-width="2.2"/>

  <line x1="80" y1="140" x2="142.5" y2="140" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="54" y="145" font-size="14" fill="#1a1a1a">10</text>
  <line x1="80" y1="360" x2="267.5" y2="360" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="46" y="365" font-size="14" fill="#1a1a1a">−10</text>

  <line x1="267.5" y1="250" x2="267.5" y2="360" stroke="#555555" stroke-width="1.3" stroke-dasharray="5 4"/>
  <circle cx="267.5" cy="360" r="4.5" fill="#8b1a1a"/>
  <text x="267.5" y="290" font-size="14" fill="#8b1a1a" text-anchor="middle">t=0.015s</text>

  <line x1="205" y1="246" x2="205" y2="254" stroke="#333333" stroke-width="1.2"/>
  <line x1="330" y1="246" x2="330" y2="254" stroke="#333333" stroke-width="1.2"/>
  <line x1="455" y1="246" x2="455" y2="254" stroke="#333333" stroke-width="1.2"/>
  <line x1="580" y1="246" x2="580" y2="254" stroke="#333333" stroke-width="1.2"/>
  <text x="205" y="272" font-size="13" fill="#1a1a1a" text-anchor="middle">0.01</text>
  <text x="330" y="272" font-size="13" fill="#1a1a1a" text-anchor="middle">0.02</text>
  <text x="455" y="272" font-size="13" fill="#1a1a1a" text-anchor="middle">0.03</text>
  <text x="580" y="272" font-size="13" fill="#1a1a1a" text-anchor="middle">0.04</text>

  <rect x="430" y="70" width="210" height="90" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
  <text x="535" y="95" font-size="14" fill="#1a1a1a" text-anchor="middle">相位 ωt = 100π × 0.015</text>
  <text x="535" y="119" font-size="14" fill="#1a1a1a" text-anchor="middle">= 1.5π</text>
  <text x="535" y="147" font-size="14" fill="#8b1a1a" text-anchor="middle">u = 10 × (−1) = −10V</text>

  <text x="330" y="388" font-size="15" fill="#1a1a1a" text-anchor="middle">t = 0.015s 时 u = −10V，电压处于反向峰值</text>
</svg>
