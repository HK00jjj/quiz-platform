<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="18.5" font-weight="bold" fill="#222">原理图图区划分与触头从属关系标记（正解 D）</text>
  <rect x="30" y="48" width="340" height="200" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="200" y="70" font-size="13" text-anchor="middle" fill="#555" font-weight="bold">图样整体布局</text>
  <rect x="52" y="88" width="296" height="26" rx="4" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="200" y="106" font-size="12" text-anchor="middle" fill="#2F5FD0">用途栏（方框）置于图面上部</text>
  <rect x="52" y="122" width="296" height="80" rx="4" fill="#fff" stroke="#888" stroke-width="1.4"/>
  <text x="200" y="164" font-size="12" text-anchor="middle" fill="#777">（原理图主体：主电路 / 控制电路）</text>
  <rect x="52" y="210" width="296" height="26" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.6"/>
  <text x="200" y="228" font-size="12" text-anchor="middle" fill="#7a5c00">图区编号：阿拉伯数字·写于图样下部方框</text>

  <rect x="386" y="48" width="244" height="200" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="508" y="72" font-size="12.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">线圈下的竖线分栏</text>
  <rect x="404" y="86" width="88" height="34" rx="4" fill="#fff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="448" y="108" font-size="11.5" text-anchor="middle" fill="#2F5FD0">KM</text>
  <line x1="424" y1="122" x2="424" y2="152" stroke="#2F5FD0" stroke-width="1.6"/>
  <line x1="472" y1="122" x2="472" y2="152" stroke="#2F5FD0" stroke-width="1.6"/>
  <line x1="404" y1="152" x2="492" y2="152" stroke="#2F5FD0" stroke-width="1.4"/>
  <text x="412" y="166" font-size="10.5" fill="#2F5FD0">主</text>
  <text x="440" y="166" font-size="10.5" fill="#2F5FD0">常开</text>
  <text x="474" y="166" font-size="10.5" fill="#2F5FD0">常闭</text>
  <text x="404" y="188" font-size="11.5" fill="#2a7a2a">接触器：两条竖线 → 左/中/右三栏</text>

  <rect x="522" y="86" width="88" height="34" rx="4" fill="#fff" stroke="#b8860b" stroke-width="1.6"/>
  <text x="566" y="108" font-size="11.5" text-anchor="middle" fill="#7a5c00">KA</text>
  <line x1="566" y1="122" x2="566" y2="152" stroke="#b8860b" stroke-width="1.6"/>
  <line x1="522" y1="152" x2="610" y2="152" stroke="#b8860b" stroke-width="1.4"/>
  <text x="534" y="166" font-size="10.5" fill="#7a5c00">常开</text>
  <text x="588" y="166" font-size="10.5" fill="#7a5c00">常闭</text>
  <text x="404" y="206" font-size="11.5" fill="#7a5c00">继电器：一条竖线 → 左右两栏</text>
  <text x="404" y="226" font-size="11.5" fill="#555">未用栏目打「×」</text>
  <text x="404" y="244" font-size="11.5" fill="#555">触头下数字 = 驱动它的线圈所在图区</text>

  <rect x="30" y="256" width="600" height="60" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.5"/>
  <text x="46" y="278" font-size="12" fill="#c33">✗ A 接触器线圈下画一条竖线（应为两条）</text>
  <text x="46" y="300" font-size="12" fill="#c33">✗ B 继电器线圈下画两条竖线（应为一条）</text>
  <rect x="30" y="324" width="600" height="76" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="346" font-size="12.3" fill="#7a5c00">正解 D：图区编号用阿拉伯数字写在图样下部方框内，用途栏以方框放在图面上部。</text>
  <text x="46" y="367" font-size="12.3" fill="#7a5c00">记忆：接触器三栏（主/常开/常闭）、继电器两栏（常开/常闭）——栏目数 = 竖线数 + 1。</text>
  <text x="46" y="388" font-size="12.3" fill="#7a5c00">从属关系：触头文字符号下的数字是「驱动它的线圈所在图区号」，不是触头自身所在图区。</text>
</svg>