<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="410" fill="#ffffff"/>
  <text x="20" y="30" font-size="18.5" font-weight="bold" fill="#222">高压柜端子排布置：强弱电分开、空端子隔开、专用接地螺栓</text>
  <line x1="40" y1="118" x2="620" y2="118" stroke="#555" stroke-width="2"/>
  <text x="40" y="60" font-size="12.5" fill="#555">端子排（同一排上从左到右的顺序即柜内实际排列）</text>
  <rect x="46" y="66" width="54" height="52" rx="4" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="73" y="98" font-size="12" text-anchor="middle" fill="#c33" font-weight="bold">1</text>
  <rect x="106" y="66" width="54" height="52" rx="4" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="133" y="98" font-size="12" text-anchor="middle" fill="#c33" font-weight="bold">2</text>
  <rect x="166" y="66" width="54" height="52" rx="4" fill="#fdecec" stroke="#c33" stroke-width="1.6"/>
  <text x="193" y="98" font-size="12" text-anchor="middle" fill="#c33" font-weight="bold">3</text>
  <rect x="226" y="66" width="34" height="52" rx="4" fill="#eeeeee" stroke="#888" stroke-width="1.6" stroke-dasharray="5 3"/>
  <line x1="232" y1="72" x2="254" y2="112" stroke="#aaa" stroke-width="1.4"/>
  <rect x="266" y="66" width="54" height="52" rx="4" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="293" y="98" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">5</text>
  <rect x="326" y="66" width="54" height="52" rx="4" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.6"/>
  <text x="353" y="98" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">6</text>
  <rect x="386" y="66" width="34" height="52" rx="4" fill="#eeeeee" stroke="#888" stroke-width="1.6" stroke-dasharray="5 3"/>
  <line x1="392" y1="72" x2="414" y2="112" stroke="#aaa" stroke-width="1.4"/>
  <rect x="426" y="66" width="66" height="52" rx="4" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="459" y="92" font-size="12" text-anchor="middle" fill="#2a7a2a" font-weight="bold">PE</text>
  <text x="459" y="109" font-size="9.5" text-anchor="middle" fill="#2a7a2a">专用接地螺栓</text>
  <text x="73" y="142" font-size="11" text-anchor="middle" fill="#c33">强电端子组</text>
  <text x="243" y="142" font-size="10" text-anchor="middle" fill="#777">空端子</text>
  <text x="323" y="142" font-size="11" text-anchor="middle" fill="#2F5FD0">弱电端子组</text>
  <text x="403" y="142" font-size="10" text-anchor="middle" fill="#777">空端子</text>
  <text x="459" y="142" font-size="10" text-anchor="middle" fill="#2a7a2a">接地</text>

  <rect x="30" y="156" width="600" height="118" rx="10" fill="#fafafa" stroke="#aaa" stroke-width="1.4"/>
  <text x="46" y="180" font-size="12.5" fill="#333">① 强、弱电端子必须分开布置（动力类与信号类互不串扰）。</text>
  <text x="46" y="202" font-size="12.5" fill="#333">② 正、负电源之间，以及带电正电源与合闸／跳闸回路之间，应有一个空端子隔开。</text>
  <text x="46" y="224" font-size="12.5" fill="#333">③ 回路电压超过 400V 时，端子排应有足够绝缘强度。</text>
  <text x="46" y="246" font-size="12.5" fill="#333">④ 潮湿环境应采用防潮端子；接线端子应与导线截面积匹配。</text>
  <text x="46" y="266" font-size="12" fill="#666">（端子排本身还应无损坏、固定牢固、绝缘良好）</text>
  <rect x="30" y="286" width="600" height="90" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="308" font-size="12.3" fill="#7a5c00">正解要点：强弱电分开布置、正负电源与合闸／跳闸回路之间空端子隔开、>400V 保证绝缘强度、潮湿环</text>
  <text x="46" y="329" font-size="12.3" fill="#7a5c00">境用防潮端子、二次回路接地设专用螺栓。</text>
  <text x="46" y="350" font-size="12.3" fill="#7a5c00">误诊提醒：认为正负电源之间不必隔开、用普通端子替代防潮端子、把截面积匹配当可选项——三处全错。</text>
</svg>