<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr62" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="330" y="30" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">电动机金属外壳经接地线与大地连接</text>

  <!-- 电源引线 -->
  <line x1="240" y1="118" x2="160" y2="118" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="148" x2="160" y2="148" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="160" cy="118" r="3.5" fill="#1a1a1a"/>
  <circle cx="160" cy="148" r="3.5" fill="#1a1a1a"/>
  <text x="76" y="126" font-size="14" fill="#1a1a1a">电源线</text>
  <text x="76" y="156" font-size="14" fill="#1a1a1a">电源线</text>

  <!-- 电动机机身（粗边框=金属外壳） -->
  <rect x="240" y="90" width="180" height="120" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="330" cy="146" r="32" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="330" y="153" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
  <text x="330" y="200" font-size="14" fill="#1a1a1a" text-anchor="middle">电动机</text>

  <!-- 金属外壳标注 -->
  <line x1="452" y1="112" x2="422" y2="104" stroke="#333333" stroke-width="1.5" marker-end="url(#arr62)"/>
  <text x="458" y="118" font-size="14" fill="#1a1a1a">金属外壳</text>

  <!-- 接地线 -->
  <line x1="330" y1="210" x2="330" y2="300" stroke="#1a1a1a" stroke-width="3"/>
  <text x="342" y="262" font-size="14" fill="#1a1a1a">接地线</text>

  <!-- 大地表面 -->
  <line x1="100" y1="310" x2="560" y2="310" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="120" y1="310" x2="110" y2="322" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="310" x2="170" y2="322" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="240" y1="310" x2="230" y2="322" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="300" y1="310" x2="290" y2="322" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="310" x2="350" y2="322" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="420" y1="310" x2="410" y2="322" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="480" y1="310" x2="470" y2="322" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="540" y1="310" x2="530" y2="322" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="566" y="316" font-size="14" fill="#1a1a1a">大地</text>

  <!-- 接地符号：三横一竖 -->
  <line x1="330" y1="310" x2="330" y2="342" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="308" y1="318" x2="352" y2="318" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="316" y1="326" x2="344" y2="326" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="323" y1="334" x2="337" y2="334" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- 定义说明 -->
  <rect x="90" y="348" width="480" height="40" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="330" y="374" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">金属外壳或支架直接与大地连接的措施称为：接地</text>
</svg>
