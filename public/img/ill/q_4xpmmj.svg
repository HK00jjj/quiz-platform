<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">PLC 驱动步进/伺服发高频脉冲：选晶体管输出（正解 A）</text>
  <rect x="46" y="48" width="568" height="30" rx="5" fill="#fff8ec" stroke="#b8860b" stroke-width="1.3"/>
  <text x="58" y="68" font-size="12.3" fill="#7a5c00">晶体管输出　无触点、微秒级响应、无机械磨损 → 高频脉冲首选</text>
  <rect x="46" y="84" width="568" height="30" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="104" font-size="12.3" fill="#555">继电器输出　机械触点，毫秒级、寿命有限 → 高频通断迅速烧蚀</text>
  <rect x="46" y="120" width="568" height="30" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="140" font-size="12.3" fill="#555">双向可控硅　交流过零关断 → 无法输出高频直流脉冲</text>
  <rect x="46" y="156" width="568" height="30" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="176" font-size="12.3" fill="#555">干接点输出　可直接串不同电压回路，但不是高频脉冲方案</text>
  <rect x="46" y="198" width="568" height="58" rx="8" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.4"/>
  <text x="58" y="218" font-size="12.3" fill="#2F5FD0">选型关键变量是「开关速度（能否跟上脉冲周期）」与「电寿命（承受多少次通断）」，</text>
  <text x="58" y="238" font-size="12.3" fill="#2F5FD0">触点容量反而是次要维度。</text>
  <rect x="30" y="264" width="600" height="76" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="286" font-size="12.3" fill="#7a5c00">正解 A：高频脉冲要求响应远小于脉冲周期，只有无触点的晶体管输出满足。</text>
  <text x="46" y="307" font-size="12.3" fill="#7a5c00">记忆点：脉冲/高速 → 晶体管；大电流慢速 → 继电器；交流频繁通断 → 可控硅。</text>
</svg>