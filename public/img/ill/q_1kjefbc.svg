<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">LED 数码管的段驱动回路与限流电阻</text>
  <!-- 共阳结构 -->
  <rect x="40" y="70" width="280" height="190" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="180" y="96" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c5c1c">共阳接法（一段的回路）</text>
  <line x1="80" y1="120" x2="80" y2="230" stroke="#c33" stroke-width="3"/>
  <text x="66" y="180" font-size="12" fill="#c33">+5V</text>
  <rect x="110" y="150" width="90" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="155" y="168" font-size="11" text-anchor="middle" fill="#333">限流电阻 R</text>
  <line x1="80" y1="163" x2="110" y2="163" stroke="#333" stroke-width="2.5"/>
  <line x1="200" y1="163" x2="240" y2="163" stroke="#333" stroke-width="2.5"/>
  <!-- LED 符号 -->
  <path d="M 240 150 L 240 176 M 240 150 L 254 163 L 240 176 Z" fill="#c33"/>
  <line x1="254" y1="147" x2="264" y2="137" stroke="#c33" stroke-width="2"/>
  <line x1="258" y1="155" x2="268" y2="145" stroke="#c33" stroke-width="2"/>
  <text x="258" y="188" font-size="11" fill="#c33">段 LED</text>
  <line x1="254" y1="163" x2="296" y2="163" stroke="#333" stroke-width="2.5"/>
  <line x1="296" y1="120" x2="296" y2="230" stroke="#333" stroke-width="3"/>
  <text x="296" y="250" font-size="11" text-anchor="middle" fill="#333">公共阳极 COM</text>
  <!-- 要点框 -->
  <rect x="360" y="90" width="270" height="150" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="376" y="116" font-size="12.5" font-weight="bold" fill="#7a5c00">为什么每段必须串限流电阻：</text>
  <text x="376" y="140" font-size="12" fill="#7a5c00">· LED 正向压降固定（约 2V），导通后电压</text>
  <text x="376" y="158" font-size="12" fill="#7a5c00">  多余部分全加在回路阻抗上；</text>
  <text x="376" y="178" font-size="12" fill="#7a5c00">· 不限流时电流只受电源与驱动管限制，</text>
  <text x="376" y="196" font-size="12" fill="#7a5c00">  远超段额定电流 → 烧段或烧驱动口；</text>
  <text x="376" y="216" font-size="12" fill="#7a5c00">· 共阴接法同理（COM 接 0V，回路方向相反）。</text>
  <text x="20" y="322" font-size="12" fill="#888">要点：LED 是电流型器件，亮度由电流决定、寿命由电流上限决定；限流电阻把段电流约束在额定范围内。</text>
</svg>
