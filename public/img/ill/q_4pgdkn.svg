<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">三相桥式半控整流——含二极管，只能整流、不能逆变</text>
  <!-- 变压器与三相进线 -->
  <rect x="40" y="100" width="80" height="130" rx="8" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="80" y="150" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c5c1c">整流</text>
  <text x="80" y="172" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c5c1c">变压器</text>
  <text x="128" y="125" font-size="12" fill="#222" font-weight="bold">U</text>
  <text x="128" y="175" font-size="12" fill="#222" font-weight="bold">V</text>
  <text x="128" y="225" font-size="12" fill="#222" font-weight="bold">W</text>
  <line x1="120" y1="120" x2="280" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="170" x2="360" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="220" x2="440" y2="220" stroke="#333" stroke-width="2"/>
  <!-- P / N 母线 -->
  <line x1="280" y1="85" x2="560" y2="85" stroke="#333" stroke-width="2"/>
  <text x="568" y="90" font-size="13" fill="#c33" font-weight="bold">P（+）</text>
  <line x1="280" y1="255" x2="560" y2="255" stroke="#333" stroke-width="2"/>
  <text x="568" y="260" font-size="13" fill="#2F5FD0" font-weight="bold">N（−）</text>
  <!-- 支路 U：VT1 上 / VD1 下 -->
  <circle cx="280" cy="120" r="3.5" fill="#333"/>
  <line x1="280" y1="120" x2="280" y2="105" stroke="#333" stroke-width="2"/>
  <path d="M268,103 L292,103 L280,85 Z" fill="#fdeeee" stroke="#c33" stroke-width="2"/>
  <line x1="268" y1="85" x2="292" y2="85" stroke="#c33" stroke-width="2.5"/>
  <line x1="292" y1="92" x2="304" y2="92" stroke="#c33" stroke-width="1.5"/>
  <text x="246" y="112" font-size="11" fill="#c33" font-weight="bold">VT1</text>
  <line x1="280" y1="120" x2="280" y2="196" stroke="#333" stroke-width="2"/>
  <path d="M268,196 L292,196 L280,214 Z" fill="#eef3ff" stroke="#2F5FD0" stroke-width="2"/>
  <line x1="268" y1="214" x2="292" y2="214" stroke="#2F5FD0" stroke-width="2.5"/>
  <text x="246" y="238" font-size="11" fill="#2F5FD0" font-weight="bold">VD1</text>
  <line x1="280" y1="214" x2="280" y2="255" stroke="#333" stroke-width="2"/>
  <!-- 支路 V：VT2 / VD2 -->
  <circle cx="360" cy="170" r="3.5" fill="#333"/>
  <line x1="360" y1="170" x2="360" y2="105" stroke="#333" stroke-width="2"/>
  <path d="M348,103 L372,103 L360,85 Z" fill="#fdeeee" stroke="#c33" stroke-width="2"/>
  <line x1="348" y1="85" x2="372" y2="85" stroke="#c33" stroke-width="2.5"/>
  <text x="326" y="112" font-size="11" fill="#c33" font-weight="bold">VT2</text>
  <line x1="360" y1="170" x2="360" y2="196" stroke="#333" stroke-width="2"/>
  <path d="M348,196 L372,196 L360,214 Z" fill="#eef3ff" stroke="#2F5FD0" stroke-width="2"/>
  <line x1="348" y1="214" x2="372" y2="214" stroke="#2F5FD0" stroke-width="2.5"/>
  <text x="326" y="238" font-size="11" fill="#2F5FD0" font-weight="bold">VD2</text>
  <line x1="360" y1="214" x2="360" y2="255" stroke="#333" stroke-width="2"/>
  <!-- 支路 W：VT3 / VD3 -->
  <circle cx="440" cy="220" r="3.5" fill="#333"/>
  <line x1="440" y1="220" x2="440" y2="105" stroke="#333" stroke-width="2"/>
  <path d="M428,103 L452,103 L440,85 Z" fill="#fdeeee" stroke="#c33" stroke-width="2"/>
  <line x1="428" y1="85" x2="452" y2="85" stroke="#c33" stroke-width="2.5"/>
  <text x="406" y="112" font-size="11" fill="#c33" font-weight="bold">VT3</text>
  <line x1="440" y1="220" x2="440" y2="196" stroke="none"/>
  <path d="M428,196 L452,196 L440,214 Z" fill="#eef3ff" stroke="#2F5FD0" stroke-width="2"/>
  <line x1="428" y1="214" x2="452" y2="214" stroke="#2F5FD0" stroke-width="2.5"/>
  <text x="406" y="238" font-size="11" fill="#2F5FD0" font-weight="bold">VD3</text>
  <line x1="440" y1="220" x2="440" y2="214" stroke="#333" stroke-width="2"/>
  <line x1="440" y1="214" x2="440" y2="255" stroke="#333" stroke-width="2"/>
  <!-- 负载 -->
  <line x1="560" y1="85" x2="560" y2="120" stroke="#333" stroke-width="2"/>
  <rect x="540" y="120" width="40" height="95" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="560" y="163" font-size="11" text-anchor="middle" fill="#222">负载</text>
  <text x="560" y="183" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">R_L</text>
  <line x1="560" y1="215" x2="560" y2="255" stroke="#333" stroke-width="2"/>
  <!-- 要点 -->
  <rect x="40" y="268" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="288" font-size="12.5" fill="#7a5c00">每相一只晶闸管＋一只二极管：二极管单向导电，电流不能反向回馈电网 → 不能逆变，仅用于整流。</text>
  <text x="20" y="334" font-size="12" fill="#888">移相范围 0°～180°、最大导通角 120°；每管通态平均电流为负载电流 1/3，晶闸管峰值电压 2.45U₂。</text>
</svg>
