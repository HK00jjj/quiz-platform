<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">380V / 3kW 三相电机选型：估电流 → 选接触器 → 定热继整定</text>
  <rect x="46" y="48" width="568" height="30" rx="5" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.3"/>
  <text x="58" y="68" font-size="12.3" fill="#2F5FD0">① 估算额定电流：按每 kW 约 2A → 3kW × 2A ≈ 6A</text>
  <rect x="46" y="84" width="568" height="30" rx="5" fill="#fff8ec" stroke="#b8860b" stroke-width="1.3"/>
  <text x="58" y="104" font-size="12.3" fill="#7a5c00">② 选接触器：约为电机千瓦数的 2 倍 → 选 12A 等级（如 CJX2-1210）</text>
  <rect x="46" y="120" width="568" height="30" rx="5" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.3"/>
  <text x="58" y="140" font-size="12.3" fill="#2a7a2a">③ 热继整定：额定电流的 1.05~1.2 倍 → 整定 6~7A</text>
  <rect x="46" y="160" width="568" height="58" rx="8" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.4"/>
  <text x="58" y="180" font-size="12.3" fill="#2F5FD0">选型链路是逐步放大余量：先估电流，再放大一档选接触器，最后按 1.05~1.2 倍整定热继，</text>
  <text x="58" y="200" font-size="12.3" fill="#2F5FD0">让保护既不误动、也不失灵。</text>
  <rect x="46" y="230" width="568" height="30" rx="5" fill="#fdecec" stroke="#c33" stroke-width="1.3"/>
  <text x="58" y="250" font-size="12.3" fill="#c33">✗ 接触器按电机额定电流等值选（选 6A）：长期满负荷，触点寿命急剧缩短</text>
  <rect x="46" y="266" width="568" height="30" rx="5" fill="#fdecec" stroke="#c33" stroke-width="1.3"/>
  <text x="58" y="286" font-size="12.3" fill="#c33">✗ 热继整定等于或高于额定电流：过载时保护失灵</text>
  <rect x="30" y="304" width="600" height="58" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="326" font-size="12.3" fill="#7a5c00">记忆点：电流 ≈ 2A/kW；接触器 ≈ 2×kW；热继整定 1.05~1.2×Ie。</text>
  <text x="46" y="347" font-size="12.3" fill="#7a5c00">三步走完，选型链条闭合（估电流 → 接触器 → 热继）。</text>
</svg>