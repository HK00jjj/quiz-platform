<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">电缆截面的两项校验：载流量 + 电压损失</text>
  <!-- 配电干线示意 -->
  <rect x="50" y="80" width="120" height="80" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="2"/>
  <text x="110" y="112" font-size="12" text-anchor="middle" font-weight="bold" fill="#7a5c00">变压器/配电</text>
  <text x="110" y="132" font-size="11" text-anchor="middle" fill="#7a5c00">U₁（首端）</text>
  <rect x="490" y="80" width="130" height="80" rx="8" fill="#eef2fb" stroke="#36c" stroke-width="2"/>
  <text x="555" y="112" font-size="12" text-anchor="middle" font-weight="bold" fill="#234">用电设备端</text>
  <text x="555" y="132" font-size="11" text-anchor="middle" fill="#234">U₂（要求偏移内）</text>
  <rect x="200" y="96" width="260" height="22" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="112" font-size="11" text-anchor="middle" fill="#333">远距离配电干线（长电缆）</text>
  <text x="330" y="140" font-size="12" text-anchor="middle" fill="#c33">ΔU = I·L·(R₀cosφ + X₀sinφ) 距离越长损失越大</text>
  <line x1="170" y1="107" x2="200" y2="107" stroke="#333" stroke-width="2.5"/>
  <line x1="460" y1="107" x2="490" y2="107" stroke="#333" stroke-width="2.5"/>
  <!-- 两项校验框 -->
  <rect x="50" y="180" width="270" height="120" rx="8" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="66" y="206" font-size="12.5" font-weight="bold" fill="#1c5c1c">① 载流量校验（防过热）</text>
  <text x="66" y="230" font-size="12" fill="#1c5c1c">I载 ≥ 计算电流；按敷设方式、</text>
  <text x="66" y="250" font-size="12" fill="#1c5c1c">环境温度修正系数后核对；</text>
  <text x="66" y="270" font-size="12" fill="#1c5c1c">不满足 → 加大截面。</text>
  <rect x="350" y="180" width="270" height="120" rx="8" fill="#eef2fb" stroke="#36c" stroke-width="1.5"/>
  <text x="366" y="206" font-size="12.5" font-weight="bold" fill="#234">② 电压损失校验（防欠压）</text>
  <text x="366" y="230" font-size="12" fill="#234">ΔU% ≤ 允许值（常用 5%）；</text>
  <text x="366" y="250" font-size="12" fill="#234">长距离时往往先卡在这条；</text>
  <text x="366" y="270" font-size="12" fill="#234">不满足 → 加大截面补偿。</text>
  <text x="20" y="330" font-size="12" fill="#888">要点：两项校验取大者定截面——短距离通常载流量说了算，远距离干线常常是电压损失说了算。</text>
</svg>
