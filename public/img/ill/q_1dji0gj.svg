<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">单结晶体管同步触发电路——移相靠调节 RP 对 C 的充电快慢</text>
  <!-- 链式组成 -->
  <rect x="40" y="104" width="110" height="60" rx="8" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="95" y="128" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c5c1c">同步变压器</text>
  <text x="95" y="148" font-size="11" text-anchor="middle" fill="#1c5c1c">同步电压→整流</text>
  <line x1="150" y1="134" x2="180" y2="134" stroke="#333" stroke-width="2"/>
  <path d="M180,128 L192,134 L180,140 Z" fill="#333"/>
  <rect x="192" y="104" width="88" height="60" rx="8" fill="#eef4ff" stroke="#2F5FD0" stroke-width="2"/>
  <text x="236" y="128" font-size="12" text-anchor="middle" font-weight="bold" fill="#2F5FD0">桥式整流</text>
  <text x="236" y="148" font-size="11" text-anchor="middle" fill="#2F5FD0">全波脉动直流</text>
  <line x1="280" y1="134" x2="310" y2="134" stroke="#333" stroke-width="2"/>
  <path d="M310,128 L322,134 L310,140 Z" fill="#333"/>
  <rect x="322" y="104" width="96" height="60" rx="8" fill="#eef4ff" stroke="#2F5FD0" stroke-width="2"/>
  <text x="370" y="128" font-size="12" text-anchor="middle" font-weight="bold" fill="#2F5FD0">稳压管削波</text>
  <text x="370" y="148" font-size="11" text-anchor="middle" fill="#2F5FD0">限幅＋扩大移相</text>
  <line x1="418" y1="134" x2="444" y2="134" stroke="#333" stroke-width="2"/>
  <!-- 充电支路：RP + C -->
  <rect x="444" y="118" width="58" height="30" rx="4" fill="#fff5f5" stroke="#c33" stroke-width="2.5"/>
  <text x="473" y="138" font-size="12" text-anchor="middle" fill="#c33" font-weight="bold">RP</text>
  <text x="473" y="112" font-size="11" text-anchor="middle" fill="#c33">← 调节对象（电位器）</text>
  <line x1="502" y1="134" x2="530" y2="134" stroke="#333" stroke-width="2"/>
  <circle cx="530" cy="134" r="3.5" fill="#333"/>
  <line x1="530" y1="120" x2="530" y2="148" stroke="#333" stroke-width="2.5"/>
  <line x1="544" y1="120" x2="544" y2="148" stroke="#333" stroke-width="2.5"/>
  <text x="537" y="170" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">C 充电</text>
  <line x1="544" y1="134" x2="572" y2="134" stroke="#333" stroke-width="2"/>
  <!-- 单结管 -->
  <circle cx="594" cy="134" r="22" fill="#fff8ec" stroke="#b8860b" stroke-width="2"/>
  <text x="594" y="130" font-size="11" text-anchor="middle" fill="#7a5c00" font-weight="bold">单结管</text>
  <text x="594" y="146" font-size="10" text-anchor="middle" fill="#7a5c00">VU</text>
  <line x1="616" y1="134" x2="636" y2="134" stroke="#c33" stroke-width="2"/>
  <path d="M636,128 L648,134 L636,140 Z" fill="#c33"/>
  <text x="540" y="216" font-size="12" fill="#c33" font-weight="bold">→ 触发脉冲送晶闸管门极</text>
  <!-- 移相因果 -->
  <rect x="40" y="196" width="470" height="44" rx="8" fill="#fdf0f0" stroke="#c33" stroke-width="1.5"/>
  <text x="56" y="216" font-size="12" fill="#a33">RP 调大 → C 充电时间常数变大 → u_C 上升到峰点电压 U_P 的时刻推迟</text>
  <text x="56" y="233" font-size="12" fill="#a33">→ 第一脉冲后移 → 控制角 α 增大（要增大 α，就调 RP）</text>
  <!-- 要点 -->
  <rect x="40" y="262" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="282" font-size="12.5" fill="#7a5c00">同步电压经整流削波后兼作同步信号与电源：过零点同步，保证每半周第一个脉冲相位一致。</text>
  <text x="20" y="334" font-size="12" fill="#888">组成三部分：同步电源（削波）、移相（RP＋C 充电）、脉冲形成（单结管）。</text>
</svg>
