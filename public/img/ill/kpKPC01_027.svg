  <text x="180" y="345" font-size="15" fill="#8b1a1a" text-anchor="middle">发热 Q₁</text>

  <rect x="355" y="45" width="255" height="310" rx="8" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
