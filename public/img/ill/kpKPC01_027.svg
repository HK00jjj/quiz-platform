  <text x="490" y="345" font-size="15" fill="#1a3a6b" text-anchor="middle">发热 Q₂</text>

  <text x="332" y="205" font-size="24" fill="#1a1a1a" text-anchor="middle">⇔</text>

  <text x="330" y="380" font-size="15" fill="#1a1a1a" text-anchor="middle">Q₁ = Q₂：交流电的有效值 = 产生相同热量的直流值 I</text>
  <text x="330" y="397" font-size="14" fill="#666666" text-anchor="middle">交流仪表读数、市电 220V 指的都是有效值</text>
