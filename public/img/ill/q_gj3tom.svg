<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">行程终端限位：两只行程开关的动断触头串接在控制回路中</text>
  <!-- 母排 -->
  <line x1="70" y1="66" x2="70" y2="240" stroke="#c33" stroke-width="2.6"/>
  <text x="52" y="60" font-size="12" fill="#c33" font-weight="bold">L1</text>
  <line x1="600" y1="66" x2="600" y2="240" stroke="#2F5FD0" stroke-width="2.6"/>
  <text x="606" y="60" font-size="12" fill="#2F5FD0" font-weight="bold">N</text>
  <!-- 主回路 y=160 -->
  <line x1="70" y1="160" x2="110" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="152" x2="110" y2="168" stroke="#333" stroke-width="2.2"/>
  <line x1="124" y1="152" x2="124" y2="168" stroke="#333" stroke-width="2.2"/>
  <line x1="124" y1="160" x2="180" y2="160" stroke="#333" stroke-width="2"/>
  <text x="117" y="146" font-size="10.5" text-anchor="middle" fill="#555">FR 常闭</text>
  <!-- SB1 停止常闭 -->
  <line x1="180" y1="152" x2="180" y2="168" stroke="#333" stroke-width="2.2"/>
  <line x1="194" y1="152" x2="194" y2="168" stroke="#333" stroke-width="2.2"/>
  <line x1="180" y1="149" x2="194" y2="171" stroke="#333" stroke-width="1.6"/>
  <line x1="194" y1="160" x2="270" y2="160" stroke="#333" stroke-width="2"/>
  <text x="187" y="146" font-size="10.5" text-anchor="middle" fill="#555">SB1 停止</text>
  <!-- SQ1 动断 -->
  <line x1="270" y1="152" x2="270" y2="168" stroke="#2a7a2a" stroke-width="2.4"/>
  <line x1="284" y1="152" x2="284" y2="168" stroke="#2a7a2a" stroke-width="2.4"/>
  <line x1="270" y1="149" x2="284" y2="171" stroke="#2a7a2a" stroke-width="1.8"/>
  <line x1="284" y1="160" x2="350" y2="160" stroke="#333" stroke-width="2"/>
  <text x="297" y="144" font-size="11" text-anchor="middle" fill="#2a7a2a" font-weight="bold">SQ1 动断</text>
  <!-- SQ2 动断 -->
  <line x1="350" y1="152" x2="350" y2="168" stroke="#2a7a2a" stroke-width="2.4"/>
  <line x1="364" y1="152" x2="364" y2="168" stroke="#2a7a2a" stroke-width="2.4"/>
  <line x1="350" y1="149" x2="364" y2="171" stroke="#2a7a2a" stroke-width="1.8"/>
  <line x1="364" y1="160" x2="436" y2="160" stroke="#333" stroke-width="2"/>
  <text x="357" y="144" font-size="11" text-anchor="middle" fill="#2a7a2a" font-weight="bold">SQ2 动断</text>
  <!-- KM 线圈 -->
  <rect x="436" y="142" width="56" height="36" rx="6" fill="#fff8ec" stroke="#b8860b" stroke-width="1.8"/>
  <text x="464" y="165" font-size="13" text-anchor="middle" fill="#7a5c00" font-weight="bold">KM</text>
  <line x1="492" y1="160" x2="600" y2="160" stroke="#333" stroke-width="2"/>
  <text x="464" y="136" font-size="10.5" text-anchor="middle" fill="#555">接触器线圈</text>
  <!-- 起动支路：SB2 ∥ KM 自锁，并联在 SB1 与 SQ1 之间（拓扑：不旁路停止按钮与限位开关） -->
  <line x1="214" y1="160" x2="214" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="258" y1="160" x2="258" y2="100" stroke="#333" stroke-width="2"/>
  <!-- SB2（上支路，常开） -->
  <line x1="214" y1="100" x2="224" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="224" y1="92" x2="224" y2="108" stroke="#333" stroke-width="2.2"/>
  <line x1="238" y1="92" x2="238" y2="108" stroke="#333" stroke-width="2.2"/>
  <line x1="238" y1="100" x2="258" y2="100" stroke="#333" stroke-width="2"/>
  <text x="200" y="94" font-size="11" text-anchor="end" fill="#555">SB2 起动</text>
  <!-- KM 自锁（下支路，常开） -->
  <line x1="214" y1="128" x2="224" y2="128" stroke="#c33" stroke-width="2"/>
  <line x1="224" y1="120" x2="224" y2="136" stroke="#c33" stroke-width="2.2"/>
  <line x1="238" y1="120" x2="238" y2="136" stroke="#c33" stroke-width="2.2"/>
  <line x1="238" y1="128" x2="258" y2="128" stroke="#c33" stroke-width="2"/>
  <text x="200" y="124" font-size="11" text-anchor="end" fill="#c33">KM 自锁</text>
  <text x="236" y="196" font-size="10.5" text-anchor="middle" fill="#888">上：SB2 起动　下：KM 自锁（两支路并联）</text>
  <!-- 现场示意 -->
  <rect x="60" y="196" width="540" height="100" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.4"/>
  <line x1="100" y1="274" x2="560" y2="274" stroke="#333" stroke-width="2"/>
  <rect x="190" y="236" width="86" height="30" rx="4" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="233" y="256" font-size="11.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">SQ1 终端1</text>
  <rect x="384" y="236" width="86" height="30" rx="4" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="427" y="256" font-size="11.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">SQ2 终端2</text>
  <rect x="290" y="212" width="72" height="26" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.4"/>
  <text x="326" y="230" font-size="11" text-anchor="middle" fill="#7a5c00">运动台</text>
  <path d="M 290 225 L 280 225" stroke="#b8860b" stroke-width="1.8"/>
  <polygon points="280,221 270,225 280,229" fill="#b8860b"/>
  <path d="M 362 225 L 376 225" stroke="#b8860b" stroke-width="1.8"/>
  <polygon points="376,221 386,225 376,229" fill="#b8860b"/>
  <text x="330" y="290" font-size="11.5" text-anchor="middle" fill="#555">运动台到达任一终端 → 撞块压下行程开关 → 动断触头断开</text>
  <!-- 要点 -->
  <rect x="40" y="308" width="580" height="56" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="329" font-size="12.5" fill="#7a5c00">两只行程开关的动断触头「串接」于控制回路（在自锁支路之后）：任一端被压下即断开 →</text>
  <text x="56" y="350" font-size="12.5" fill="#7a5c00">KM 失电停机，实现行程控制与限位保护——这是典型接法（符合规范）。</text>
</svg>
