<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">触摸屏组态的正确顺序：先建变量表并绑定 PLC 地址（正解 B）</text>
  <rect x="46" y="48" width="568" height="30" rx="5" fill="#fff8ec" stroke="#b8860b" stroke-width="1.3"/>
  <text x="58" y="68" font-size="12.3" fill="#7a5c00">① 先在组态软件建立变量表，把变量绑定到 PLC 实际地址（DB、I、Q）</text>
  <rect x="46" y="84" width="568" height="30" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="104" font-size="12.3" fill="#555">② 画面控件再关联这些变量，控件才知道显示与写入哪个地址</text>
  <rect x="46" y="120" width="568" height="30" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="140" font-size="12.3" fill="#555">③ 变量链路建好后做离线仿真，验证画面动作逻辑</text>
  <rect x="46" y="156" width="568" height="30" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.3"/>
  <text x="58" y="176" font-size="12.3" fill="#555">④ 最后下载到触摸屏，联机验证</text>
  <rect x="46" y="198" width="568" height="52" rx="8" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.4"/>
  <text x="58" y="218" font-size="12.3" fill="#2F5FD0">本质：屏上控件不直接认识 PLC，靠「变量」这一层与 PLC 地址交换数据；</text>
  <text x="58" y="238" font-size="12.3" fill="#2F5FD0">没有绑定地址的变量只是一串空名字。</text>
  <rect x="30" y="258" width="600" height="84" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="280" font-size="12.3" fill="#7a5c00">正解 B：先建变量绑地址，是一切画面与通讯功能的地基。</text>
  <text x="46" y="301" font-size="12.3" fill="#7a5c00">误诊提醒：选 A（先拖控件后补变量）把工序颠倒——控件先于变量存在，关联无从谈起；</text>
  <text x="46" y="322" font-size="12.3" fill="#7a5c00">选 C（只起中文名不绑定）留下空名字；选 D（先跑演示工程）与「从零组态」的前提相悖。</text>
</svg>