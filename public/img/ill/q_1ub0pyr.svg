<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">分相式单相异步电动机反转：改接辅助绕组（副绕组）接线</text>
  <!-- 左：接线示意 -->
  <rect x="40" y="60" width="280" height="210" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="180" y="84" font-size="13" text-anchor="middle" fill="#555" font-weight="bold">分相式电动机内部</text>
  <!-- 主绕组 -->
  <rect x="70" y="120" width="220" height="26" rx="4" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.8"/>
  <text x="180" y="138" font-size="12" text-anchor="middle" fill="#2F5FD0" font-weight="bold">主绕组（运行绕组）WM</text>
  <!-- 辅助绕组（垂直放置示意90°电角度） -->
  <rect x="150" y="156" width="60" height="60" rx="4" fill="#fff8ec" stroke="#b8860b" stroke-width="1.8" transform="rotate(0)"/>
  <text x="180" y="192" font-size="12" text-anchor="middle" fill="#7a5c00" font-weight="bold">辅助绕组（起动绕组）WA</text>
  <!-- 电容器 -->
  <circle cx="298" cy="180" r="14" fill="#fff" stroke="#2a7a2a" stroke-width="1.8"/>
  <line x1="284" y1="180" x2="312" y2="180" stroke="#2a7a2a" stroke-width="2"/>
  <text x="298" y="212" font-size="11" text-anchor="middle" fill="#2a7a2a">C 电容</text>
  <line x1="210" y1="180" x2="284" y2="180" stroke="#2a7a2a" stroke-width="2"/>
  <line x1="210" y1="180" x2="210" y2="200" stroke="#2a7a2a" stroke-width="2"/>
  <!-- 标注 -->
  <text x="54" y="248" font-size="11" fill="#555">两套绕组空间差 90° 电角度</text>
  <!-- 右：改接说明 -->
  <rect x="360" y="60" width="270" height="220" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="495" y="86" font-size="13.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ 反转方法（现场正确做法）</text>
  <text x="378" y="112" font-size="12.5" fill="#333">将辅助绕组（起动绕组）的两端</text>
  <text x="378" y="134" font-size="12.5" fill="#333">首尾对调 → 旋转磁场反向 → 转子反转</text>
  <line x1="378" y1="148" x2="612" y2="148" stroke="#d0e3d0" stroke-width="1"/>
  <text x="378" y="170" font-size="12.5" fill="#c33" font-weight="bold">✗ 不能改接主绕组</text>
  <text x="378" y="192" font-size="12" fill="#555">主绕组决定旋转磁场基准方向，</text>
  <text x="378" y="212" font-size="12" fill="#555">调换主绕组首端不改变磁场旋转方向</text>
  <text x="378" y="240" font-size="12" fill="#555">（仅改变电流方向，磁场不变）</text>
  <!-- 要点 -->
  <rect x="30" y="294" width="600" height="70" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="316" font-size="12.5" fill="#7a5c00">分相式电动机的反转：只调换辅助绕组（起动绕组）首尾两端接线，</text>
  <text x="46" y="338" font-size="12.5" fill="#7a5c00">主绕组接线不变。因为辅助绕组的电流相位反转后，旋转磁场方向才反转。</text>
  <text x="46" y="358" font-size="12" fill="#7a5c00">记忆：反转调副不调主——调主没用，调副才转。</text>
</svg>
