<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">梯形图等效变换：本机型不许可的三种形态 → 等效改</text>
  <!-- 左：不许可形态 -->
  <text x="165" y="60" font-size="14" text-anchor="middle" fill="#c33" font-weight="bold">✗ 多数机型不许可</text>
  <!-- (a) 交叉 -->
  <rect x="30" y="74" width="270" height="96" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.4"/>
  <text x="44" y="94" font-size="12.5" fill="#c33" font-weight="bold">① 含交叉（信息流左→右被交叉打断）</text>
  <line x1="70" y1="112" x2="252" y2="112" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="148" x2="252" y2="148" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="112" x2="70" y2="148" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="112" x2="140" y2="148" stroke="#c33" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="180" y1="112" x2="180" y2="148" stroke="#c33" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="286" y="120" font-size="11" fill="#c33">✗</text>
  <!-- (b) 桥式 -->
  <rect x="30" y="180" width="270" height="76" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.4"/>
  <text x="44" y="200" font-size="12.5" fill="#c33" font-weight="bold">② 桥式电路（多数机型不允许）</text>
  <line x1="70" y1="218" x2="252" y2="218" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="218" x2="110" y2="244" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="244" x2="212" y2="244" stroke="#333" stroke-width="2"/>
  <line x1="212" y1="218" x2="212" y2="244" stroke="#333" stroke-width="2"/>
  <text x="161" y="240" font-size="10.5" text-anchor="middle" fill="#c33">桥接</text>
  <!-- (c) 多分支输出 -->
  <rect x="30" y="266" width="270" height="72" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.4"/>
  <text x="44" y="280" font-size="12.5" fill="#c33" font-weight="bold">③ 触点多分支输出（部分机型不许）</text>
  <line x1="70" y1="310" x2="150" y2="310" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="310" x2="150" y2="298" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="298" x2="230" y2="298" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="310" x2="150" y2="324" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="324" x2="230" y2="324" stroke="#333" stroke-width="2"/>
  <rect x="230" y="290" width="30" height="16" rx="3" fill="#fff" stroke="#c33" stroke-width="1.4"/>
  <rect x="230" y="316" width="30" height="16" rx="3" fill="#fff" stroke="#c33" stroke-width="1.4"/>
  <!-- 右：等效改 -->
  <text x="495" y="60" font-size="14" text-anchor="middle" fill="#2a7a2a" font-weight="bold">✓ 等效改：无交叉形式</text>
  <rect x="360" y="74" width="270" height="264" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <text x="376" y="98" font-size="12.5" fill="#2a7a2a" font-weight="bold">重排为串/并组合，逻辑不变</text>
  <line x1="392" y1="130" x2="598" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="392" y1="130" x2="392" y2="176" stroke="#333" stroke-width="2"/>
  <line x1="392" y1="176" x2="598" y2="176" stroke="#333" stroke-width="2"/>
  <!-- 触点符号（并联两支路，无交叉） -->
  <line x1="392" y1="130" x2="440" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="440" y1="122" x2="440" y2="138" stroke="#333" stroke-width="2.2"/>
  <line x1="454" y1="122" x2="454" y2="138" stroke="#333" stroke-width="2.2"/>
  <line x1="454" y1="130" x2="598" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="392" y1="176" x2="440" y2="176" stroke="#333" stroke-width="2"/>
  <line x1="440" y1="168" x2="440" y2="184" stroke="#333" stroke-width="2.2"/>
  <line x1="454" y1="168" x2="454" y2="184" stroke="#333" stroke-width="2.2"/>
  <line x1="454" y1="176" x2="598" y2="176" stroke="#333" stroke-width="2"/>
  <line x1="500" y1="130" x2="500" y2="176" stroke="#333" stroke-width="2"/>
  <rect x="516" y="112" width="64" height="36" rx="5" fill="#fff" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="548" y="136" font-size="12.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">线圈</text>
  <text x="376" y="212" font-size="12" fill="#555">· 含交叉 → 改为无交叉（本题正确项 D）</text>
  <text x="376" y="234" font-size="12" fill="#555">· 桥式、多分支输出 → 按机型规定等效改</text>
  <text x="376" y="256" font-size="12" fill="#555">· 等效改不得改变原逻辑功能</text>
  <text x="376" y="286" font-size="12" fill="#2a7a2a" font-weight="bold">等效的判据：输入输出真值表完全一致</text>
  <text x="376" y="312" font-size="11.5" fill="#888">（等效＝换画法，不是改逻辑）</text>
  <!-- 要点 -->
  <rect x="30" y="352" width="600" height="52" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="373" font-size="12.5" fill="#7a5c00">遇到本机型不许可的梯形图，必须按机型规定作等效变换（改画法、不改逻辑）：</text>
  <text x="46" y="393" font-size="12.5" fill="#7a5c00">含交叉的应改为无交叉形式——这是最典型、最必须改的一类。</text>
</svg>
