<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L8,4 L0,7.5 z" fill="#333333"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L8,4 L0,7.5 z" fill="#8b1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="25" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">正弦交流电波形：相位 ωt 的含义</text>

  <line x1="80" y1="350" x2="80" y2="88" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="80" y1="250" x2="602" y2="250" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="60" y="98" font-size="14" fill="#1a1a1a">u</text>
  <text x="590" y="270" font-size="14" fill="#1a1a1a">t</text>

  <path d="M80,250 C121.67,85 163.33,85 205,250 C246.67,415 288.33,415 330,250 C371.67,85 413.33,85 455,250 C496.67,415 538.33,415 580,250" fill="none" stroke="#333333" stroke-width="2.2"/>

  <text x="225" y="110" font-size="20" fill="#1a1a1a" text-anchor="middle">u = Um·sin ωt</text>
  <ellipse cx="290" cy="102" rx="38" ry="17" fill="none" stroke="#8b1a1a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="330" y1="102" x2="472" y2="102" stroke="#8b1a1a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ahr)"/>

  <rect x="478" y="72" width="162" height="106" rx="8" fill="#ffffff" stroke="#8b1a1a" stroke-width="1.4"/>
  <text x="559" y="100" font-size="15" fill="#8b1a1a" text-anchor="middle">ωt → 相位</text>
  <text x="559" y="128" font-size="14" fill="#1a1a1a" text-anchor="middle">（某时刻的角度）</text>
  <text x="559" y="158" font-size="15" fill="#1a1a1a" text-anchor="middle">ω → 角频率</text>

  <line x1="142.5" y1="250" x2="142.5" y2="140" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="80" y1="140" x2="142.5" y2="140" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="142.5" cy="140" r="4" fill="#333333"/>
  <text x="56" y="145" font-size="14" fill="#1a1a1a">Um</text>
  <path d="M112,250 A32,32 0 0 0 80,218" fill="none" stroke="#8b1a1a" stroke-width="1.6"/>
  <text x="102" y="231" font-size="14" fill="#8b1a1a">ωt₁</text>
  <line x1="142.5" y1="246" x2="142.5" y2="254" stroke="#333333" stroke-width="1.2"/>
  <text x="142.5" y="270" font-size="13" fill="#1a1a1a" text-anchor="middle">t₁</text>
  <line x1="330" y1="246" x2="330" y2="254" stroke="#333333" stroke-width="1.2"/>
  <text x="330" y="270" font-size="13" fill="#1a1a1a" text-anchor="middle">T</text>

  <text x="330" y="390" font-size="15" fill="#1a1a1a" text-anchor="middle">ωt 整体表示相位；拆开的 ω 才是角频率</text>
</svg>
