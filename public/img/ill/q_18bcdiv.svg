<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">检修完毕恢复送电前的确认流程</text>
  <!-- 流程链 -->
  <g font-size="12.5" font-weight="bold">
    <rect x="30" y="90" width="120" height="64" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
    <text x="90" y="116" text-anchor="middle" fill="#1c5c1c">① 接线检查</text>
    <text x="90" y="136" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">按图核对无错接</text>
    <rect x="180" y="90" width="120" height="64" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
    <text x="240" y="116" text-anchor="middle" fill="#1c5c1c">② 紧固确认</text>
    <text x="240" y="136" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">端子螺栓全紧固</text>
    <rect x="330" y="90" width="120" height="64" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
    <text x="390" y="116" text-anchor="middle" fill="#1c5c1c">③ 接地确认</text>
    <text x="390" y="136" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">PE 连续无遗漏</text>
    <rect x="480" y="90" width="150" height="64" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
    <text x="555" y="116" text-anchor="middle" fill="#1c5c1c">④ 复测绝缘</text>
    <text x="555" y="136" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">相间/相对地全合格</text>
  </g>
  <line x1="150" y1="122" x2="180" y2="122" stroke="#333" stroke-width="2.5"/>
  <line x1="300" y1="122" x2="330" y2="122" stroke="#333" stroke-width="2.5"/>
  <line x1="450" y1="122" x2="480" y2="122" stroke="#333" stroke-width="2.5"/>
  <!-- 合闸闸门 -->
  <rect x="220" y="200" width="220" height="66" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="2.5"/>
  <text x="330" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">④ 全部合格 → 才允许合闸</text>
  <text x="330" y="250" text-anchor="middle" font-size="11.5" fill="#7a5c00">拆接地线/短接线、清点人员工具、撤标示牌</text>
  <line x1="555" y1="154" x2="555" y2="233" stroke="#333" stroke-width="2.5"/>
  <line x1="555" y1="233" x2="440" y2="233" stroke="#333" stroke-width="2.5"/>
  <path d="M 440 233 l 12 -6 v 12 z" fill="#333"/>
  <!-- 安全栏 -->
  <text x="20" y="300" font-size="12.5" fill="#333">倒闸操作纪律：不做完不送电——绝缘复测是最后一道技术闸，送电指令由工作负责人统一下达；</text>
  <text x="20" y="320" font-size="12.5" fill="#333">临时接地线未拆除即送电 = 三相短路事故，工具遗留在柜内 = 送电瞬间放电事故。</text>
  <text x="20" y="340" font-size="12" fill="#888">要点：流程的顺序不可倒置，「检查→紧固→接地→绝缘→送电」每步留证（记录/挂牌）。</text>
</svg>
