<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="410" fill="#ffffff"/>
  <text x="20" y="30" font-size="17.5" fill="#222" font-weight="bold">线圈电流 I = P / U = 0.2 A，与输出点 0.3 A 比较</text>
  <rect x="34" y="48" width="300" height="138" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="184" y="72" font-size="13" fill="#555" font-weight="bold" text-anchor="middle">（1）校核依据</text>
  <rect x="64" y="84" width="240" height="36" rx="10" fill="#eef2ff" stroke="#2F5FD0" stroke-width="1.8"/>
  <text x="184" y="108" font-size="15" fill="#2F5FD0" font-weight="bold" text-anchor="middle">P = U · I   →   I = P / U</text>
  <text x="64" y="142" font-size="12.3" fill="#333">感性负载稳态下按额定功率取电流</text>
  <text x="64" y="164" font-size="11.5" fill="#777">线圈电流与阀本体无关</text>

  <rect x="348" y="48" width="278" height="138" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="487" y="72" font-size="13" fill="#2a7a2a" font-weight="bold" text-anchor="middle">（2）计算</text>
  <text x="364" y="96" font-size="13" fill="#333">I = 4.8 W ÷ 24 V = 0.2 A</text>
  <text x="364" y="118" font-size="13" fill="#333">输出点额定 = 0.3 A</text>
  <text x="364" y="142" font-size="12.6" fill="#2a7a2a">0.2 A ＜ 0.3 A，裕量约 33%</text>
  <text x="364" y="164" font-size="12.3" fill="#333">结论：可以直接驱动</text>

  <rect x="34" y="198" width="592" height="96" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="50" y="220" font-size="12.5" fill="#c33" font-weight="bold">（3）能驱动 ≠ 可以直接接线了事</text>
  <text x="50" y="242" font-size="12.3" fill="#333">感性负载关断时产生反向电动势，须在线圈两端并联续流二极管</text>
  <text x="50" y="264" font-size="12.3" fill="#333">二极管极性：与线圈并联且反向偏置，正常工作时不导通</text>
  <text x="50" y="286" font-size="11.5" fill="#777">只比电流不比感性冲击：输出晶体管会被关断尖峰击穿</text>

  <rect x="34" y="306" width="592" height="62" rx="10" fill="#fff8ec" stroke="#b8860b" stroke-width="1.8"/>
  <text x="50" y="328" font-size="12.3" fill="#7a5c00">校核三步：算线圈稳态电流 → 与输出点额定值比余量 → 感性负载加抑制</text>
  <text x="50" y="350" font-size="11.5" fill="#777">余量判据：留 20%~30% 以上；低于此值应经中间继电器隔离</text>
  <rect x="30" y="378" width="600" height="30" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="400" font-size="12.3" fill="#7a5c00">记忆：I = P/U；0.2 A 对比 0.3 A 留三成余量；感性负载必并续流二极管。</text>
</svg>