<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">阻容移相桥触发电路（小容量单相整流）</text>
  <!-- 同步变压器中心抽头 -->
  <rect x="40" y="110" width="120" height="110" rx="8" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="100" y="136" font-size="12" text-anchor="middle" font-weight="bold" fill="#1c5c1c">同步变压器</text>
  <text x="100" y="158" font-size="11" text-anchor="middle" fill="#1c5c1c">（带中心抽头）</text>
  <circle cx="160" cy="140" r="4" fill="#1c5c1c"/>
  <circle cx="160" cy="190" r="4" fill="#1c5c1c"/>
  <text x="168" y="134" font-size="10" fill="#555">上端 a</text>
  <text x="168" y="196" font-size="10" fill="#555">下端 b</text>
  <circle cx="160" cy="165" r="4" fill="#c33"/>
  <text x="168" y="170" font-size="10" fill="#c33">中心抽头 0</text>
  <!-- 移相桥：R（电位器）与 C -->
  <rect x="300" y="100" width="60" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="330" y="118" font-size="11" text-anchor="middle">RP 电位器</text>
  <line x1="160" y1="140" x2="300" y2="113" stroke="#333" stroke-width="2"/>
  <line x1="360" y1="113" x2="470" y2="113" stroke="#333" stroke-width="2"/>
  <line x1="470" y1="113" x2="470" y2="165" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="190" x2="300" y2="217" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="217" x2="450" y2="217" stroke="#333" stroke-width="0"/>
  <!-- C -->
  <line x1="300" y1="217" x2="360" y2="217" stroke="#333" stroke-width="2"/>
  <line x1="360" y1="203" x2="360" y2="231" stroke="#333" stroke-width="2.5"/>
  <line x1="376" y1="203" x2="376" y2="231" stroke="#333" stroke-width="2.5"/>
  <text x="368" y="252" font-size="11" text-anchor="middle">电容 C</text>
  <line x1="376" y1="217" x2="470" y2="217" stroke="#333" stroke-width="2"/>
  <line x1="470" y1="217" x2="470" y2="165" stroke="#333" stroke-width="2"/>
  <!-- 输出 -->
  <circle cx="470" cy="165" r="6" fill="#2F5FD0"/>
  <line x1="470" y1="165" x2="520" y2="165" stroke="#2F5FD0" stroke-width="2.5"/>
  <text x="526" y="170" font-size="12" fill="#2F5FD0">→ 触发信号（移相）</text>
  <text x="490" y="150" font-size="11" fill="#2F5FD0">od 间电压</text>
  <line x1="160" y1="165" x2="520" y2="0" stroke="none"/>
  <line x1="160" y1="165" x2="240" y2="165" stroke="#c33" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="246" y="170" font-size="11" fill="#c33">o（中心抽头）</text>
  <!-- 要点 -->
  <rect x="40" y="268" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="290" font-size="12.5" fill="#7a5c00">od 为移相后输出：调 RP → 阻容分压比变化 → 输出电压相位移动 → 改变晶闸管控制角 α。</text>
  <text x="20" y="334" font-size="12" fill="#888">要点：结构简单可靠，精度一般，定位在 50A 以下小容量单相整流的触发；大容量/高精度用单结晶体管或集成触发。</text>
</svg>
