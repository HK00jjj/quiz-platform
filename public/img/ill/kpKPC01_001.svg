<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#ffffff"/>

  <!-- 顶部导线与开关 -->
  <line x1="60" y1="95" x2="220" y2="95" stroke="#333333" stroke-width="2"/>
  <circle cx="220" cy="95" r="4" fill="#333333"/>
  <line x1="224" y1="95" x2="286" y2="95" stroke="#333333" stroke-width="2"/>
  <circle cx="290" cy="95" r="4" fill="#333333"/>
  <line x1="294" y1="95" x2="470" y2="95" stroke="#333333" stroke-width="2"/>

  <!-- 右侧导线与灯泡（负载） -->
  <line x1="470" y1="95" x2="470" y2="152" stroke="#333333" stroke-width="2"/>
  <circle cx="470" cy="182" r="30" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="449" y1="161" x2="491" y2="203" stroke="#333333" stroke-width="2"/>
  <line x1="491" y1="161" x2="449" y2="203" stroke="#333333" stroke-width="2"/>
  <line x1="470" y1="212" x2="470" y2="280" stroke="#333333" stroke-width="2"/>

  <!-- 底部导线与干电池（电源） -->
  <line x1="470" y1="280" x2="180" y2="280" stroke="#333333" stroke-width="2"/>
  <rect x="100" y="262" width="80" height="36" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="180" y1="280" x2="100" y2="280" stroke="#333333" stroke-width="2"/>
  <line x1="100" y1="280" x2="60" y2="280" stroke="#333333" stroke-width="2"/>
  <line x1="60" y1="280" x2="60" y2="95" stroke="#333333" stroke-width="2"/>
  <text x="118" y="287" font-size="16" fill="#333333">−</text>
  <text x="158" y="287" font-size="16" fill="#333333">＋</text>

  <!-- 电流方向箭头 -->
  <polygon points="120,90 155,90 155,85 170,95 155,105 155,100 120,100" fill="#333333"/>
  <text x="140" y="80" font-size="15" font-style="italic" font-weight="bold" text-anchor="middle" fill="#333333">I</text>

  <!-- 虚线框1：电源 -->
  <rect x="85" y="250" width="110" height="62" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="140" y="335" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">电源（干电池）</text>
  <text x="140" y="357" font-size="14" text-anchor="middle" fill="#444444">提供电能</text>

  <!-- 虚线框2：中间环节 -->
  <rect x="200" y="65" width="120" height="60" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="305" y="52" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">中间环节（开关和导线）</text>
  <text x="255" y="120" font-size="14" text-anchor="middle" fill="#444444">控制通断</text>
  <polygon points="375,90 410,90 410,86 425,95 410,104 410,100 375,100" fill="#333333" transform="translate(0,-5)"/>
  <text x="398" y="72" font-size="14" text-anchor="middle" fill="#444444">输送电能</text>

  <!-- 虚线框3：负载 -->
  <rect x="425" y="140" width="90" height="85" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="528" y="178" font-size="15" font-weight="bold" fill="#111111">负载（小灯泡）</text>
  <text x="528" y="200" font-size="14" fill="#444444">消耗电能</text>

  <!-- 底部公式 -->
  <text x="330" y="382" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">完整电路 = 电源 + 中间环节 + 负载</text>
</svg>
