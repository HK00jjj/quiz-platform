<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#1a1a1a">
    <text x="330" y="32" font-size="20" font-weight="bold" text-anchor="middle">左手定则：安培力的定义</text>

    <!-- 磁铁两极 -->
    <rect x="140" y="140" width="60" height="120" fill="#4a4a4a" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="460" y="140" width="60" height="120" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <text x="170" y="208" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">N</text>
    <text x="490" y="208" font-size="22" font-weight="bold" text-anchor="middle">S</text>
    <text x="170" y="282" font-size="14" text-anchor="middle">磁铁</text>
    <text x="490" y="282" font-size="14" text-anchor="middle">磁铁</text>

    <!-- 极间磁感线：N→S 向右 -->
    <line x1="200" y1="168" x2="446" y2="168" stroke="#444444" stroke-width="1.5" stroke-dasharray="7 5"/>
    <polygon points="456,168 442,162 442,174" fill="#444444"/>
    <line x1="200" y1="205" x2="446" y2="205" stroke="#444444" stroke-width="1.5" stroke-dasharray="7 5"/>
    <polygon points="456,205 442,199 442,211" fill="#444444"/>
    <line x1="200" y1="240" x2="446" y2="240" stroke="#444444" stroke-width="1.5" stroke-dasharray="7 5"/>
    <polygon points="456,240 442,234 442,246" fill="#444444"/>
    <text x="226" y="128" font-size="15">磁场 B</text>
    <line x1="238" y1="134" x2="260" y2="158" stroke="#555555" stroke-width="1"/>

    <!-- 通电导体（水平放于磁场中） -->
    <rect x="235" y="196" width="190" height="20" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="330" cy="206" r="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="330" cy="206" r="4" fill="#1a1a1a"/>
    <text x="352" y="228" font-size="14">电流 I 垂直纸面向外</text>

    <!-- 安培力箭头：向上 -->
    <line x1="330" y1="188" x2="330" y2="112" stroke="#1a1a1a" stroke-width="3"/>
    <polygon points="330,100 321,120 339,120" fill="#1a1a1a"/>
    <text x="348" y="112" font-size="17" font-weight="bold">F（安培力）</text>

    <!-- 导体接线与电源 -->
    <polyline points="235,206 185,206 185,308" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <polyline points="425,206 475,206 475,308" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="185" y1="308" x2="312" y2="308" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="312" y1="292" x2="312" y2="324" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="330" y1="300" x2="330" y2="316" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="330" y1="308" x2="475" y2="308" stroke="#1a1a1a" stroke-width="2"/>
    <text x="322" y="348" font-size="14" text-anchor="middle">电源</text>

    <!-- 结论框 -->
    <rect x="110" y="360" width="440" height="34" fill="none" stroke="#555555" stroke-width="1.5" rx="6"/>
    <text x="330" y="383" font-size="15" text-anchor="middle" font-weight="bold">通电导体在磁场中受到的力，称为安培力（F = BILsinα）</text>
  </g>
</svg>
