<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">同一电阻负载：星形与三角形接法的电压/功率关系</text>
  <!-- 左：星形 -->
  <rect x="40" y="60" width="270" height="200" rx="10" fill="#eef2fb" stroke="#36c" stroke-width="2"/>
  <text x="175" y="86" font-size="13" text-anchor="middle" font-weight="bold" fill="#234">星形（Y）接法</text>
  <!-- 三相星形 -->
  <g stroke="#333" stroke-width="2.5" fill="none">
    <line x1="175" y1="150" x2="175" y2="112"/>
    <line x1="175" y1="150" x2="140" y2="208"/>
    <line x1="175" y1="150" x2="210" y2="208"/>
  </g>
  <g fill="#fff" stroke="#333" stroke-width="2">
    <circle cx="175" cy="110" r="7"/>
    <circle cx="138" cy="210" r="7"/>
    <circle cx="212" cy="210" r="7"/>
  </g>
  <text x="175" y="96" font-size="11" text-anchor="middle" fill="#234">L1</text>
  <text x="120" y="226" font-size="11" fill="#234">L2</text>
  <text x="216" y="226" font-size="11" fill="#234">L3</text>
  <circle cx="175" cy="150" r="6" fill="#2a7a2a"/>
  <text x="175" y="172" font-size="11" text-anchor="middle" fill="#2a7a2a">中性点 N</text>
  <text x="60" y="250" font-size="12" fill="#234">相电压 = U线 / √3（线电压 U）</text>
  <text x="60" y="252" font-size="0" fill="#234"/>
  <!-- 右：三角形 -->
  <rect x="350" y="60" width="270" height="200" rx="10" fill="#fdf0f0" stroke="#c33" stroke-width="2"/>
  <text x="485" y="86" font-size="13" text-anchor="middle" font-weight="bold" fill="#922">三角形（Δ）接法</text>
  <g fill="#fff" stroke="#333" stroke-width="2">
    <circle cx="485" cy="115" r="7"/>
    <circle cx="415" cy="220" r="7"/>
    <circle cx="555" cy="220" r="7"/>
  </g>
  <g stroke="#333" stroke-width="2.5">
    <line x1="485" y1="122" x2="421" y2="216"/>
    <line x1="421" y1="216" x2="549" y2="216"/>
    <line x1="549" y1="216" x2="485" y2="122"/>
  </g>
  <text x="485" y="102" font-size="11" text-anchor="middle" fill="#922">L1</text>
  <text x="395" y="238" font-size="11" fill="#922">L2</text>
  <text x="560" y="238" font-size="11" fill="#922">L3</text>
  <text x="370" y="250" font-size="12" fill="#922">每相直接承受线电压 = U</text>
  <!-- 推导框 -->
  <rect x="40" y="278" width="580" height="58" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="300" font-size="12.5" fill="#7a5c00">每相功率 P相 = U相²/R：Y 接时 U相=U/√3，Δ 接时 U相=U；同一线电压下比较总功率 P总 = 3×U相²/R，</text>
  <text x="56" y="322" font-size="12.5" fill="#7a5c00">相电压比值的平方即总功率之比（电压差 √3 倍 → 功率差 √3² 倍）。</text>
  <text x="20" y="352" font-size="12" fill="#888">要点：Δ 接功率是 Y 接的 3 倍——这就是星三角降压起动「限流同时也限转矩」的数学根源。</text>
</svg>
