<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#1a1a1a">
    <text x="330" y="32" font-size="20" font-weight="bold" text-anchor="middle">磁铁吸引铁钉：隔空吸引的磁场原因</text>

    <!-- 条形磁铁 -->
    <rect x="200" y="80" width="110" height="40" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="310" y="80" width="110" height="40" fill="#4a4a4a" stroke="#1a1a1a" stroke-width="2"/>
    <text x="255" y="107" font-size="20" font-weight="bold" text-anchor="middle">S</text>
    <text x="365" y="107" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">N</text>

    <!-- 磁感线（N 端出、S 端入的闭合弧线） -->
    <path d="M 408 92 C 360 36, 240 36, 194 92" fill="none" stroke="#444444" stroke-width="1.5"/>
    <polygon points="300,44 314,36 314,52" fill="#444444"/>
    <path d="M 404 96 C 364 62, 236 62, 196 96" fill="none" stroke="#444444" stroke-width="1.5"/>
    <polygon points="300,70 312,63 312,77" fill="#444444"/>
    <path d="M 404 124 C 364 158, 236 158, 196 124" fill="none" stroke="#444444" stroke-width="1.5"/>
    <polygon points="244,150 256,143 256,157" fill="#444444"/>
    <path d="M 408 128 C 368 180, 240 178, 194 128" fill="none" stroke="#444444" stroke-width="1.5"/>
    <polygon points="248,172 260,165 260,179" fill="#444444"/>
    <text x="140" y="60" font-size="15">磁感线</text>
    <line x1="168" y1="64" x2="240" y2="52" stroke="#444444" stroke-width="1"/>

    <!-- 被吸起的铁钉（悬空） -->
    <rect x="302" y="188" width="16" height="66" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="294" y="180" width="32" height="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="302,254 318,254 310,272" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="340" y="212" font-size="15">铁钉被磁场力</text>
    <text x="340" y="234" font-size="15">拉起（未接触）</text>

    <!-- 原位置与上吸虚线 -->
    <ellipse cx="310" cy="318" rx="24" ry="5" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="310" y1="308" x2="310" y2="288" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="310,282 304,294 316,294" fill="#888888"/>

    <!-- 桌面 -->
    <line x1="70" y1="322" x2="600" y2="322" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="90" y1="332" x2="180" y2="332" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="120" y1="340" x2="240" y2="340" stroke="#1a1a1a" stroke-width="1"/>
    <text x="596" y="312" font-size="14" text-anchor="end">桌面</text>

    <rect x="110" y="352" width="440" height="34" fill="none" stroke="#555555" stroke-width="1.5" rx="6"/>
    <text x="330" y="375" font-size="15" text-anchor="middle" font-weight="bold">磁铁周围存在磁场，磁场对铁类物质施力——不接触也能吸引</text>
  </g>
</svg>
