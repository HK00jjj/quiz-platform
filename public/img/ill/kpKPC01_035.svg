<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L8,4 L0,7.5 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="25" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">星形连接供电方式：线圈接法与引出线</text>

  <circle cx="175" cy="195" r="110" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="243" y="148" font-size="15" fill="#1a1a1a" text-anchor="middle">发电机</text>

  <rect x="-16" y="-95" width="32" height="65" fill="#ffffff" stroke="#333333" stroke-width="1.8" transform="translate(175,195) rotate(0)"/>
  <rect x="-16" y="-95" width="32" height="65" fill="#ffffff" stroke="#333333" stroke-width="1.8" transform="translate(175,195) rotate(120)"/>
  <rect x="-16" y="-95" width="32" height="65" fill="#ffffff" stroke="#333333" stroke-width="1.8" transform="translate(175,195) rotate(240)"/>
  <circle cx="175" cy="195" r="5" fill="#333333"/>
  <text x="175" y="222" font-size="13" fill="#555555" text-anchor="middle">公共点</text>

  <line x1="175" y1="100" x2="175" y2="70" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="175" y="58" font-size="15" fill="#1a1a1a" text-anchor="middle">U</text>
  <line x1="257.3" y1="242.5" x2="287" y2="259.5" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="300" y="270" font-size="15" fill="#1a1a1a" text-anchor="middle">V</text>
  <line x1="92.7" y1="242.5" x2="63" y2="259.5" stroke="#333333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="52" y="270" font-size="15" fill="#1a1a1a" text-anchor="middle">W</text>

  <line x1="175" y1="200" x2="175" y2="345" stroke="#333333" stroke-width="2"/>
  <text x="175" y="365" font-size="15" fill="#1a1a1a" text-anchor="middle">N（中性线）</text>

  <rect x="428" y="88" width="222" height="150" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
  <text x="539" y="115" font-size="15" fill="#1a1a1a" text-anchor="middle">星形（Y形）连接</text>
  <text x="539" y="145" font-size="14" fill="#1a1a1a" text-anchor="middle">三组线圈末端接在一起</text>
  <text x="539" y="173" font-size="14" fill="#1a1a1a" text-anchor="middle">公共点 → 引出中性线 N</text>
  <text x="539" y="201" font-size="14" fill="#1a1a1a" text-anchor="middle">三个首端 → U、V、W 相线</text>
  <text x="539" y="228" font-size="13" fill="#666666" text-anchor="middle">共引出四根导线（三相四线制）</text>
  <line x1="426" y1="150" x2="192" y2="193" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <text x="330" y="390" font-size="15" fill="#1a1a1a" text-anchor="middle">星形连接：末端接在一起引出中性线 N，三个首端各引一根相线</text>
</svg>
