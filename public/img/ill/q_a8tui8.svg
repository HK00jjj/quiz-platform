<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">梯形图绘制规则：输出线圈置于行最右，右侧不得再有触点</text>
  <!-- 正确 -->
  <text x="20" y="62" font-size="14" fill="#2a7a2a" font-weight="bold">✓ 符合规则（B）：线圈在最右端，右侧无触点</text>
  <rect x="30" y="74" width="600" height="86" rx="8" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.6"/>
  <line x1="60" y1="117" x2="620" y2="117" stroke="#333" stroke-width="2"/>
  <!-- 触点1 -->
  <line x1="60" y1="117" x2="150" y2="117" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="109" x2="150" y2="125" stroke="#333" stroke-width="2.2"/>
  <line x1="164" y1="109" x2="164" y2="125" stroke="#333" stroke-width="2.2"/>
  <line x1="164" y1="117" x2="250" y2="117" stroke="#333" stroke-width="2"/>
  <text x="157" y="100" font-size="11" text-anchor="middle" fill="#555">X0 常开</text>
  <!-- 触点2 -->
  <line x1="250" y1="117" x2="340" y2="117" stroke="#333" stroke-width="2"/>
  <line x1="340" y1="109" x2="340" y2="125" stroke="#333" stroke-width="2.2"/>
  <line x1="354" y1="109" x2="354" y2="125" stroke="#333" stroke-width="2.2"/>
  <line x1="340" y1="106" x2="354" y2="128" stroke="#333" stroke-width="1.6"/>
  <line x1="354" y1="117" x2="520" y2="117" stroke="#333" stroke-width="2"/>
  <text x="347" y="100" font-size="11" text-anchor="middle" fill="#555">X1 常闭</text>
  <!-- 线圈最右 -->
  <ellipse cx="556" cy="117" rx="34" ry="17" fill="#fff" stroke="#2a7a2a" stroke-width="2"/>
  <text x="556" y="122" font-size="12.5" text-anchor="middle" fill="#2a7a2a" font-weight="bold">Y0</text>
  <line x1="520" y1="117" x2="522" y2="117" stroke="#333" stroke-width="2"/>
  <text x="556" y="152" font-size="11" text-anchor="middle" fill="#2a7a2a">线圈在最右 ✓</text>
  <!-- 右侧无触点示意 -->
  <line x1="592" y1="92" x2="592" y2="150" stroke="#2a7a2a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="598" y="110" font-size="11" fill="#2a7a2a">右侧</text>
  <text x="598" y="126" font-size="11" fill="#2a7a2a">空白</text>
  <!-- 错误 -->
  <text x="20" y="196" font-size="14" fill="#c33" font-weight="bold">✗ 违反规则的两种画法</text>
  <rect x="30" y="208" width="292" height="86" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.5"/>
  <text x="44" y="228" font-size="12" fill="#c33" font-weight="bold">① 线圈右侧还有触点</text>
  <line x1="50" y1="262" x2="120" y2="262" stroke="#333" stroke-width="2"/>
  <ellipse cx="140" cy="262" rx="20" ry="12" fill="#fff" stroke="#c33" stroke-width="1.8"/>
  <text x="140" y="266" font-size="10.5" text-anchor="middle" fill="#c33">Y0</text>
  <line x1="160" y1="262" x2="300" y2="262" stroke="#333" stroke-width="2"/>
  <line x1="230" y1="254" x2="230" y2="270" stroke="#c33" stroke-width="2.2"/>
  <line x1="244" y1="254" x2="244" y2="270" stroke="#c33" stroke-width="2.2"/>
  <text x="237" y="250" font-size="10.5" text-anchor="middle" fill="#c33">触点（错位）✗</text>
  <rect x="338" y="208" width="292" height="86" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.5"/>
  <text x="352" y="228" font-size="12" fill="#c33" font-weight="bold">② 线圈不在行末（夹在中间）</text>
  <line x1="358" y1="262" x2="420" y2="262" stroke="#333" stroke-width="2"/>
  <ellipse cx="446" cy="262" rx="22" ry="12" fill="#fff" stroke="#c33" stroke-width="1.8"/>
  <text x="446" y="266" font-size="10.5" text-anchor="middle" fill="#c33">Y0</text>
  <line x1="468" y1="262" x2="610" y2="262" stroke="#333" stroke-width="2"/>
  <text x="536" y="250" font-size="10.5" text-anchor="middle" fill="#c33">后面又串触点 ✗</text>
  <!-- 要点 -->
  <rect x="30" y="308" width="600" height="72" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="330" font-size="12.5" fill="#7a5c00">规则：① 输出线圈一律画在梯级行最右端，线圈右侧不得再有任何触点；</text>
  <text x="46" y="350" font-size="12.5" fill="#7a5c00">② 触点只允许出现在线圈左侧；③ 同一输出线圈避免重复使用（双线圈易致误动作）。</text>
  <text x="46" y="370" font-size="12" fill="#7a5c00">判据：先找行末的线圈，再看它右侧是否干净。</text>
</svg>
