<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#222">两组公共端独立极性：NPN 与 PNP 各归一组</text>
  <!-- 第1组 -->
  <rect x="40" y="70" width="270" height="180" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="175" y="94" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c5c1c">第 1 组 X0~X7（配 NPN）</text>
  <rect x="60" y="110" width="110" height="46" rx="8" fill="#eef2fb" stroke="#36c" stroke-width="1.5"/>
  <text x="115" y="130" font-size="11" text-anchor="middle">NPN 接近开关</text>
  <text x="115" y="147" font-size="10" text-anchor="middle" fill="#555">棕+ 蓝- 黑OUT</text>
  <line x1="170" y1="133" x2="230" y2="133" stroke="#222" stroke-width="2.5"/>
  <circle cx="238" cy="133" r="6" fill="#fff" stroke="#333"/>
  <text x="252" y="138" font-size="11">X0</text>
  <text x="60" y="185" font-size="11.5" fill="#1c5c1c">S/S1 → 接 L+（+24V）</text>
  <text x="60" y="205" font-size="11.5" fill="#1c5c1c">NPN 导通把 X 拉向 0V，</text>
  <text x="60" y="223" font-size="11.5" fill="#1c5c1c">电流自 S/S1(L+) 流向 X。</text>
  <!-- 第2组 -->
  <rect x="350" y="70" width="270" height="180" rx="10" fill="#f0f7f0" stroke="#2a7a2a" stroke-width="2"/>
  <text x="485" y="94" font-size="13" text-anchor="middle" font-weight="bold" fill="#1c5c1c">第 2 组 X10~X17（配 PNP）</text>
  <rect x="370" y="110" width="110" height="46" rx="8" fill="#fdf0f0" stroke="#c33" stroke-width="1.5"/>
  <text x="425" y="130" font-size="11" text-anchor="middle">PNP 光电开关</text>
  <text x="425" y="147" font-size="10" text-anchor="middle" fill="#555">棕+ 蓝- 黑OUT</text>
  <line x1="480" y1="133" x2="540" y2="133" stroke="#222" stroke-width="2.5"/>
  <circle cx="548" cy="133" r="6" fill="#fff" stroke="#333"/>
  <text x="562" y="138" font-size="11">X10</text>
  <text x="370" y="185" font-size="11.5" fill="#1c5c1c">S/S2 → 接 M（0V）</text>
  <text x="370" y="205" font-size="11.5" fill="#1c5c1c">PNP 导通把 X 拉向 +24V，</text>
  <text x="370" y="223" font-size="11.5" fill="#1c5c1c">电流自 X 流向 S/S2(M)。</text>
  <text x="20" y="282" font-size="12.5" fill="#333">两组公共端极性互相独立，同机混合使用 NPN/PNP 的正解：按类型分组，各自配置 S/S。</text>
  <text x="20" y="322" font-size="12" fill="#888">要点：看 PLC 手册「输入分组 + 公共端可否独立接极」；不能独立分组的机型用继电器转换极性。</text>
</svg>
