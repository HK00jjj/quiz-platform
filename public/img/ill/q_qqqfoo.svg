<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="390" fill="#ffffff"/>
  <text x="20" y="30" font-size="17.5" fill="#222" font-weight="bold">PLC 定期检查标准：温度 0~55℃、相对湿度 85% 以下</text>
  <rect x="34" y="48" width="300" height="176" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="184" y="72" font-size="13" fill="#c33" font-weight="bold" text-anchor="middle">题干给出的值（均超标）</text>
  <text x="52" y="96" font-size="12.6" fill="#333">温度上限 60℃</text>
  <text x="52" y="120" font-size="12.6" fill="#333">相对湿度上限 90%</text>
  <text x="52" y="148" font-size="12" fill="#c33">两项都超出源文标准</text>
  <text x="52" y="172" font-size="12.3" fill="#333">结论：该说法错误</text>
  <text x="52" y="196" font-size="11.5" fill="#777">题干问是否符合 → 判「错误」</text>
  <text x="52" y="216" font-size="11.5" fill="#777">不要把「差不多」当符合</text>

  <rect x="348" y="48" width="278" height="176" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="487" y="72" font-size="13" fill="#2a7a2a" font-weight="bold" text-anchor="middle">源文标准值</text>
  <text x="364" y="96" font-size="12.6" fill="#333">环境温度：0 ~ 55 ℃</text>
  <text x="364" y="120" font-size="12.6" fill="#333">相对湿度：85% 以下</text>
  <text x="364" y="148" font-size="12.6" fill="#333">供电电压：80% ~ 110%</text>
  <text x="364" y="172" font-size="12.6" fill="#333">振动：幅度 < 0.5 mm</text>
  <text x="364" y="196" font-size="11.5" fill="#777">频率 10 ~ 55 Hz、不积尘</text>

  <rect x="34" y="238" width="592" height="88" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="50" y="260" font-size="12.5" fill="#555" font-weight="bold">顺带记住的寿命与更换项</text>
  <text x="50" y="282" font-size="12.3" fill="#333">继电器：阻性 30 万次、感性 10 万次</text>
  <text x="50" y="304" font-size="12.3" fill="#333">后备电池：约 5 年更换</text>
  <text x="50" y="322" font-size="11.5" fill="#777">温湿度超标会加速元件老化并引发误动作，属定期检查的硬指标</text>
  <rect x="30" y="336" width="600" height="50" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="358" font-size="12.3" fill="#7a5c00">记忆：温度 0~55℃、湿度 85% 以下；题干 60℃/90% 两项均超标，判错误。</text>
  <text x="46" y="379" font-size="12.3" fill="#7a5c00">误诊提醒：把「环境条件」当成可参考值而非限值。</text>
</svg>