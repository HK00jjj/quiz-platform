<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="28" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">电路图：用简单图形符号代替实物画出电路</text>

  <!-- ===== 左：实物连接图 ===== -->
  <text x="175" y="118" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">实物连接图</text>
  <!-- 干电池实物（竖圆柱） -->
  <rect x="48" y="188" width="34" height="56" rx="8" fill="#ffffff" stroke="#222" stroke-width="2.2"/>
  <rect x="56" y="180" width="18" height="9" rx="3" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="41" y="192" font-size="14" fill="#222" text-anchor="end">＋</text>
  <text x="41" y="242" font-size="14" fill="#222" text-anchor="end">－</text>
  <text x="65" y="262" font-size="13" fill="#555" text-anchor="middle">干电池</text>
  <!-- 开关实物（底座+闸刀） -->
  <rect x="146" y="134" width="12" height="12" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <rect x="202" y="134" width="12" height="12" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <line x1="150" y1="136" x2="204" y2="118" stroke="#222" stroke-width="2.5"/>
  <text x="180" y="106" font-size="13" fill="#555" text-anchor="middle">开关</text>
  <!-- 灯泡实物 -->
  <circle cx="290" cy="220" r="27" fill="#ffffff" stroke="#222" stroke-width="2.2"/>
  <path d="M283,232 L283,214 L290,226 L297,214 L297,232" fill="none" stroke="#222" stroke-width="1.8"/>
  <rect x="281" y="247" width="18" height="10" rx="2" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <line x1="306" y1="198" x2="316" y2="188" stroke="#222" stroke-width="1.5"/>
  <line x1="310" y1="220" x2="322" y2="220" stroke="#222" stroke-width="1.5"/>
  <line x1="306" y1="242" x2="316" y2="252" stroke="#222" stroke-width="1.5"/>
  <text x="290" y="280" font-size="13" fill="#555" text-anchor="middle">小灯泡</text>
  <!-- 实物连线 -->
  <polyline points="65,180 65,140 146,140" fill="none" stroke="#222" stroke-width="2"/>
  <polyline points="214,140 290,140 290,193" fill="none" stroke="#222" stroke-width="2"/>
  <polyline points="290,257 290,300 65,300 65,244" fill="none" stroke="#222" stroke-width="2"/>

  <!-- 中间转化箭头 -->
  <line x1="308" y1="218" x2="382" y2="218" stroke="#1a5c2e" stroke-width="4"/>
  <polygon points="394,218 378,211 378,225" fill="#1a5c2e"/>
  <text x="345" y="200" font-size="14" font-weight="bold" fill="#1a5c2e" text-anchor="middle">符号代替</text>
  <text x="345" y="244" font-size="14" fill="#555" text-anchor="middle">画法规范</text>

  <!-- ===== 右：电路图 ===== -->
  <text x="510" y="118" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">电路图</text>
  <!-- 电池符号 -->
  <line x1="406" y1="205" x2="434" y2="205" stroke="#222" stroke-width="3"/>
  <line x1="413" y1="218" x2="427" y2="218" stroke="#222" stroke-width="2"/>
  <text x="398" y="216" font-size="13" fill="#555" text-anchor="end">电池</text>
  <!-- 开关符号 -->
  <circle cx="472" cy="140" r="3.5" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <circle cx="528" cy="140" r="3.5" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <line x1="474" y1="138" x2="526" y2="118" stroke="#222" stroke-width="2"/>
  <text x="500" y="106" font-size="13" fill="#555" text-anchor="middle">开关</text>
  <!-- 灯泡符号（圆内打叉） -->
  <circle cx="620" cy="220" r="22" fill="#ffffff" stroke="#222" stroke-width="2.2"/>
  <line x1="605" y1="205" x2="635" y2="235" stroke="#222" stroke-width="2"/>
  <line x1="635" y1="205" x2="605" y2="235" stroke="#222" stroke-width="2"/>
  <text x="648" y="225" font-size="13" fill="#555" text-anchor="end">灯泡</text>
  <!-- 电路连线 -->
  <polyline points="420,140 420,205" fill="none" stroke="#222" stroke-width="2"/>
  <polyline points="420,218 420,300 620,300 620,242" fill="none" stroke="#222" stroke-width="2"/>
  <polyline points="620,198 620,140 528,140" fill="none" stroke="#222" stroke-width="2"/>
  <polyline points="472,140 420,140" fill="none" stroke="#222" stroke-width="2"/>

  <!-- 定义框 -->
  <rect x="115" y="330" width="430" height="40" rx="6" fill="#f7f7f7" stroke="#222" stroke-width="1.8"/>
  <text x="330" y="356" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">电路图＝用统一规范的图形符号代替实物画出的图形</text>
  <text x="330" y="390" font-size="13" fill="#555" text-anchor="middle">符号简洁、连接关系一目了然，便于分析、安装与技术交流</text>
</svg>
