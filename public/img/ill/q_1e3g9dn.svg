<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#222">单相半波可控整流（α=0 时输出最大：Uo=0.45U₂）</text>
  <!-- 电源 u2 -->
  <circle cx="95" cy="180" r="24" fill="#eef4ff" stroke="#2F5FD0" stroke-width="2"/>
  <text x="95" y="186" font-size="14" text-anchor="middle" fill="#2F5FD0" font-weight="bold">~u₂</text>
  <line x1="95" y1="156" x2="95" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="95" y1="110" x2="240" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="95" y1="204" x2="95" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="95" y1="250" x2="430" y2="250" stroke="#333" stroke-width="2"/>
  <!-- 晶闸管 VT -->
  <line x1="240" y1="110" x2="280" y2="110" stroke="#333" stroke-width="2"/>
  <path d="M280,96 L280,124 L302,110 Z" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="302" y1="96" x2="302" y2="124" stroke="#222" stroke-width="2.5"/>
  <line x1="292" y1="118" x2="292" y2="138" stroke="#c33" stroke-width="1.8"/>
  <text x="268" y="152" font-size="11" fill="#c33">触发脉冲 u_G</text>
  <text x="276" y="88" font-size="12" fill="#222" font-weight="bold">VT</text>
  <line x1="302" y1="110" x2="430" y2="110" stroke="#333" stroke-width="2"/>
  <circle cx="430" cy="110" r="3.5" fill="#333"/>
  <line x1="430" y1="110" x2="430" y2="146" stroke="#333" stroke-width="2"/>
  <!-- 负载 RL -->
  <rect x="400" y="146" width="60" height="68" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="430" y="176" font-size="12" text-anchor="middle" fill="#222">负载</text>
  <text x="430" y="196" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">R_L</text>
  <line x1="430" y1="214" x2="430" y2="250" stroke="#333" stroke-width="2"/>
  <circle cx="430" cy="250" r="3.5" fill="#333"/>
  <!-- 波形（基线在横轴上，仅画 0～2π 正半周窗口） -->
  <line x1="480" y1="240" x2="480" y2="140" stroke="#888" stroke-width="1.5"/>
  <path d="M480,146 L480,140 L486,140" stroke="#888" stroke-width="1.5" fill="none"/>
  <line x1="480" y1="240" x2="645" y2="240" stroke="#888" stroke-width="1.5"/>
  <path d="M484,240 Q512,108 540,240" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <line x1="540" y1="240" x2="640" y2="240" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M484,240 Q512,108 540,240" stroke="#c33" stroke-width="2.4" fill="none"/>
  <line x1="540" y1="240" x2="640" y2="240" stroke="#c33" stroke-width="2.4"/>
  <text x="492" y="150" font-size="11" fill="#888">u₂（虚线）</text>
  <text x="548" y="172" font-size="11" fill="#c33">u₀＝u₂ 全导通</text>
  <text x="600" y="262" font-size="11" fill="#888">ωt</text>
  <text x="484" y="262" font-size="11" fill="#888">0</text>
  <!-- 要点 -->
  <rect x="40" y="268" width="580" height="48" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="56" y="290" font-size="12.5" fill="#7a5c00">α=0 时晶闸管在 u₂ 整个正半周导通，输出平均电压最大：Uo = 0.45U₂；移相范围 0～π（180°）。</text>
  <text x="20" y="334" font-size="12" fill="#888">一只晶闸管、输出脉动大；改变触发时刻 α 即可平滑调节直流平均电压。</text>
</svg>
