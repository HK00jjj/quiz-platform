<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="sans-serif">
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="28" font-size="19" font-weight="bold" fill="#1a1a1a" text-anchor="middle">两相触电：人体同时接触两根相线</text>

  <!-- 电源框 -->
  <rect x="240" y="44" width="180" height="36" rx="6" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
  <text x="330" y="68" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">三相电源</text>

  <!-- 两根相线 -->
  <line x1="260" y1="80" x2="260" y2="178" stroke="#222" stroke-width="3.5"/>
  <line x1="400" y1="80" x2="400" y2="178" stroke="#222" stroke-width="3.5"/>
  <circle cx="260" cy="178" r="4" fill="#222"/>
  <circle cx="400" cy="178" r="4" fill="#222"/>
  <text x="260" y="206" font-size="14" fill="#222" text-anchor="middle">L1（相线）</text>
  <text x="400" y="206" font-size="14" fill="#222" text-anchor="middle">L2（相线）</text>

  <!-- 线电压标注：双向箭头 -->
  <line x1="270" y1="112" x2="390" y2="112" stroke="#8a1f1f" stroke-width="2.5"/>
  <polygon points="260,112 274,106 274,118" fill="#8a1f1f"/>
  <polygon points="400,112 386,106 386,118" fill="#8a1f1f"/>
  <text x="330" y="100" font-size="17" font-weight="bold" fill="#8a1f1f" text-anchor="middle">U = 380 V</text>

  <!-- 电流方向：L1 向下、L2 向上 -->
  <line x1="260" y1="126" x2="260" y2="152" stroke="#1a5c2e" stroke-width="2.5"/>
  <polygon points="260,160 255,148 265,148" fill="#1a5c2e"/>
  <text x="244" y="146" font-size="14" font-weight="bold" fill="#1a5c2e" text-anchor="end">i</text>
  <line x1="400" y1="152" x2="400" y2="126" stroke="#1a5c2e" stroke-width="2.5"/>
  <polygon points="400,118 395,130 405,130" fill="#1a5c2e"/>
  <text x="414" y="146" font-size="14" font-weight="bold" fill="#1a5c2e">i</text>

  <!-- 人形 -->
  <circle cx="330" cy="172" r="15" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <line x1="330" y1="187" x2="330" y2="252" stroke="#222" stroke-width="5"/>
  <polyline points="330,196 295,182 263,179" fill="none" stroke="#222" stroke-width="4"/>
  <polyline points="330,196 365,182 397,179" fill="none" stroke="#222" stroke-width="4"/>
  <line x1="330" y1="252" x2="314" y2="300" stroke="#222" stroke-width="4"/>
  <line x1="330" y1="252" x2="346" y2="300" stroke="#222" stroke-width="4"/>
  <text x="255" y="166" font-size="13" fill="#555" text-anchor="end">左手触 L1</text>
  <text x="405" y="166" font-size="13" fill="#555">右手触 L2</text>
  <text x="316" y="230" font-size="15" font-weight="bold" fill="#8a1f1f" text-anchor="end">i</text>

  <!-- 地面 -->
  <line x1="200" y1="306" x2="460" y2="306" stroke="#222" stroke-width="2"/>
  <g stroke="#555" stroke-width="1.5">
    <line x1="215" y1="306" x2="207" y2="316"/>
    <line x1="255" y1="306" x2="247" y2="316"/>
    <line x1="295" y1="306" x2="287" y2="316"/>
    <line x1="335" y1="306" x2="327" y2="316"/>
    <line x1="375" y1="306" x2="367" y2="316"/>
    <line x1="415" y1="306" x2="407" y2="316"/>
    <line x1="450" y1="306" x2="442" y2="316"/>
  </g>

  <!-- 结论框 -->
  <rect x="115" y="330" width="430" height="48" rx="6" fill="#fdf4f4" stroke="#8a1f1f" stroke-width="2"/>
  <text x="330" y="350" font-size="15" font-weight="bold" fill="#8a1f1f" text-anchor="middle">两相触电：人体同时接触两根相线，跨接于线电压之间</text>
  <text x="330" y="370" font-size="14" fill="#8a1f1f" text-anchor="middle">承受电压 U = 380V（远高于 220V 相电压），触电危险性最大</text>
</svg>
