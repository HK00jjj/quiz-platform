<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Microsoft YaHei',sans-serif">
  <rect width="660" height="460" fill="#ffffff"/>
  <text x="20" y="30" font-size="17.5" fill="#222" font-weight="bold">光电开关四类光路：对射、漫反射、回归反射、槽型</text>
  <rect x="34" y="48" width="286" height="128" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="177" y="72" font-size="13" fill="#2a7a2a" font-weight="bold" text-anchor="middle">A 对射式</text>
  <text x="50" y="96" font-size="12.3" fill="#333">发射器与接收器分离对置</text>
  <text x="50" y="118" font-size="12.3" fill="#333">检测距离最长</text>
  <text x="50" y="140" font-size="12.3" fill="#333">只要遮断光路即动作</text>
  <text x="50" y="162" font-size="12" fill="#2a7a2a">不受被检物表面颜色影响</text>

  <rect x="334" y="48" width="292" height="128" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="480" y="72" font-size="13" fill="#2a7a2a" font-weight="bold" text-anchor="middle">B 漫反射式</text>
  <text x="350" y="96" font-size="12.3" fill="#333">发射与接收一体</text>
  <text x="350" y="118" font-size="12.3" fill="#333">靠被检物表面反射回光</text>
  <text x="350" y="140" font-size="12.3" fill="#333">距离较短</text>
  <text x="350" y="162" font-size="12" fill="#2a7a2a">受颜色与表面状态影响</text>

  <rect x="34" y="188" width="286" height="128" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.8"/>
  <text x="177" y="212" font-size="13" fill="#555" font-weight="bold" text-anchor="middle">C 回归反射式</text>
  <text x="50" y="236" font-size="12.3" fill="#333">发射接收一体 + 反光板</text>
  <text x="50" y="258" font-size="12.3" fill="#333">靠反光板维持光路</text>
  <text x="50" y="280" font-size="12" fill="#c33">透明物会透光 → 本项说法不成立</text>
  <text x="50" y="302" font-size="11.5" fill="#777">对透明被检物不可靠</text>

  <rect x="334" y="188" width="292" height="128" rx="10" fill="#e9f5ec" stroke="#2a7a2a" stroke-width="1.8"/>
  <text x="480" y="212" font-size="13" fill="#2a7a2a" font-weight="bold" text-anchor="middle">D 槽型</text>
  <text x="350" y="236" font-size="12.3" fill="#333">发射与接收对置一体成型</text>
  <text x="350" y="258" font-size="12.3" fill="#333">光路固定，无需对光</text>
  <text x="350" y="280" font-size="12" fill="#2a7a2a">常用于定位、计数与限位</text>
  <text x="350" y="302" font-size="11.5" fill="#777">安装即对准，抗偏移</text>

  <rect x="34" y="328" width="592" height="60" rx="10" fill="#fdecec" stroke="#c33" stroke-width="1.8"/>
  <text x="50" y="350" font-size="12.3" fill="#c33">✗ E 电感式：靠涡流检测金属，不是光电开关</text>
  <text x="50" y="372" font-size="11.5" fill="#777">检测媒介不同（电涡流 vs 光），分类上不属于光电开关</text>
  <rect x="30" y="400" width="600" height="52" rx="8" fill="#fff8ec" stroke="#b8860b" stroke-width="1.5"/>
  <text x="46" y="422" font-size="12.3" fill="#7a5c00">记忆：对射距离最长且不受颜色影响；漫反射一体但受颜色表面影响；回归反射靠反光板；槽型光路固定。</text>
  <text x="46" y="443" font-size="12.3" fill="#7a5c00">误诊提醒：电感式靠涡流检测金属，检测媒介不同，不属于光电开关。</text>
</svg>