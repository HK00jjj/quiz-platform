  <text x="355" y="252" font-size="13" fill="#1a1a1a" text-anchor="middle">0.01</text>
  <text x="492.5" y="252" font-size="13" fill="#1a1a1a" text-anchor="middle">0.015</text>
  <text x="355" y="272" font-size="13" fill="#888888" text-anchor="middle">时间 t/s</text>

  <text x="330" y="382" font-size="15" fill="#1a1a1a" text-anchor="middle">最大瞬时值 Um = √2 × 有效值：Um = 1.414 × 220 V ≈ 311 V</text>
