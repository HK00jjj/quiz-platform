      <path d="M8,0.5 L0,4 L8,7.5 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="400" fill="#ffffff"/>
  <text x="330" y="25" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">交流电有效值说明图</text>

  <line x1="80" y1="330" x2="80" y2="60" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="80" y1="230" x2="634" y2="230" stroke="#333333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="50" y="70" font-size="14" fill="#1a1a1a">u/V</text>
  <text x="618" y="252" font-size="14" fill="#1a1a1a">t</text>
  <text x="70" y="250" font-size="13" fill="#1a1a1a">0</text>

  <path d="M80,230 C125.83,50 171.67,50 217.5,230 C263.33,410 309.17,410 355,230 C400.83,50 446.67,50 492.5,230" fill="none" stroke="#333333" stroke-width="2.2"/>

  <line x1="80" y1="110" x2="560" y2="110" stroke="#888888" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="80" y1="145" x2="560" y2="145" stroke="#888888" stroke-width="1.3" stroke-dasharray="6 4"/>
  <circle cx="148.75" cy="110" r="4" fill="#333333"/>
  <text x="52" y="114" font-size="14" fill="#1a1a1a">311</text>
  <text x="52" y="149" font-size="14" fill="#1a1a1a">220</text>
  <text x="452" y="103" font-size="14" fill="#1a1a1a">Um ≈ 311 V（最大瞬时值）</text>
  <text x="452" y="138" font-size="14" fill="#1a1a1a">U = 220 V（有效值）</text>
  <line x1="95" y1="110" x2="95" y2="145" stroke="#555555" stroke-width="1.2" marker-start="url(#ah2)" marker-end="url(#ah)"/>
  <text x="104" y="133" font-size="13" fill="#555555">√2倍</text>

  <line x1="217.5" y1="226" x2="217.5" y2="234" stroke="#333333" stroke-width="1.2"/>
  <line x1="355" y1="226" x2="355" y2="234" stroke="#333333" stroke-width="1.2"/>
  <line x1="492.5" y1="226" x2="492.5" y2="234" stroke="#333333" stroke-width="1.2"/>
